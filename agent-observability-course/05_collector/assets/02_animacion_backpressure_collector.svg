<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="100%" height="460">
  <style>
    text { stroke: none !important; font-family: 'Segoe UI', system-ui, sans-serif; text-rendering: geometricPrecision; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .step1 { animation: s1 9s infinite; }
    .step2 { animation: s2 9s infinite; }
    .step3 { animation: s3 9s infinite; }
    .step4 { animation: s4 9s infinite; }
    @keyframes s1 { 0%,5%{opacity:0.3} 10%,90%{opacity:1} 95%,100%{opacity:0.3} }
    @keyframes s2 { 0%,25%{opacity:0.3} 30%,90%{opacity:1} 95%,100%{opacity:0.3} }
    @keyframes s3 { 0%,48%{opacity:0.3} 54%,90%{opacity:1} 95%,100%{opacity:0.3} }
    @keyframes s4 { 0%,70%{opacity:0.25} 76%,92%{opacity:1} 96%,100%{opacity:0.25} }
  </style>
  <rect width="1040" height="460" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect width="1040" height="70" rx="16" fill="#0f172a" />
  <rect y="48" width="1040" height="22" fill="#0f172a" />
  <text x="36" y="34" font-size="21" font-weight="700" fill="#ffffff">ANIMACIÓN DE BACKPRESSURE: CAÍDA DE BACKEND Y MEMORY_LIMITER</text>
  <text x="36" y="56" font-size="14" fill="#cbd5e1">Secuencia temporal cuando Tempo/Loki cae: de la cola de exportación al freno de emergencia del Collector</text>

  <!-- 1. Backend Down -->
  <g class="step1">
    <rect x="770" y="92" width="244" height="190" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3" />
    <rect x="788" y="110" width="208" height="28" rx="6" fill="#dc2626" />
    <text x="892" y="129" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1. BACKEND CAÍDO (503)</text>
    <text x="788" y="160" font-size="15" font-weight="700" fill="#7f1d1d" class="mono">Tempo / Loki no responde</text>
    <text x="788" y="186" font-size="14" fill="#991b1b">El exporter falla al enviar</text>
    <text x="788" y="208" font-size="14" fill="#991b1b">y activa retry_on_failure</text>
    <text x="788" y="236" font-size="13" font-weight="700" fill="#b91c1c" class="mono">exporter_send_failed_spans ↑</text>
  </g>

  <!-- 2. Sending Queue Fills -->
  <g class="step2">
    <rect x="510" y="92" width="240" height="190" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="3" />
    <rect x="528" y="110" width="204" height="28" rx="6" fill="#d97706" />
    <text x="630" y="129" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2. SENDING_QUEUE SUBE</text>
    <text x="528" y="160" font-size="15" font-weight="700" fill="#78350f" class="mono">queue_size / queue_capacity</text>
    <text x="528" y="186" font-size="14" fill="#92400e">Los lotes se acumulan en RAM</text>
    <text x="528" y="208" font-size="14" fill="#92400e">esperando el backoff de red.</text>
    <text x="528" y="236" font-size="13" font-weight="700" fill="#b45309" class="mono">exporter_queue_size → 100%</text>
  </g>

  <!-- 3. Memory Limiter Trips -->
  <g class="step3">
    <rect x="260" y="92" width="230" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3" />
    <rect x="278" y="110" width="194" height="28" rx="6" fill="#2563eb" />
    <text x="375" y="129" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3. MEMORY_LIMITER</text>
    <text x="278" y="160" font-size="15" font-weight="700" fill="#1e3a8a" class="mono">RAM ≥ limit_mib</text>
    <text x="278" y="186" font-size="14" fill="#1e40af">¡Evita el OOM-Kill del proceso!</text>
    <text x="278" y="208" font-size="14" fill="#1e40af">Rechaza entradas nuevas con</text>
    <text x="278" y="228" font-size="14" fill="#1e40af">error recuperable (429/503).</text>
    <text x="278" y="256" font-size="13" font-weight="700" fill="#1d4ed8" class="mono">processor_refused_spans ↑</text>
  </g>

  <!-- 4. App SDK Buffers & Retries -->
  <g class="step4">
    <rect x="26" y="92" width="214" height="190" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3" />
    <rect x="44" y="110" width="178" height="28" rx="6" fill="#7c3aed" />
    <text x="133" y="129" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4. SDK DE LA APP</text>
    <text x="44" y="160" font-size="15" font-weight="700" fill="#4c1d95" class="mono">BatchSpanProcessor</text>
    <text x="44" y="186" font-size="14" fill="#5b21b6">Recibe el rechazo temporal y</text>
    <text x="44" y="208" font-size="14" fill="#5b21b6">reintenta desde su propia cola</text>
    <text x="44" y="228" font-size="14" fill="#5b21b6">sin tumbar al Collector.</text>
  </g>

  <!-- Bottom Golden Rule Box -->
  <rect x="26" y="304" width="988" height="130" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <text x="48" y="334" font-size="16" font-weight="700" fill="#0f172a">🔍 Cómo diagnosticar el Collector en 30 segundos mirando :8888/metrics</text>
  <text x="48" y="364" font-size="14" font-weight="600" fill="#334155" class="mono">• receiver_accepted_spans &gt; exporter_sent_spans  → El Collector está reteniendo o perdiendo datos.</text>
  <text x="48" y="390" font-size="14" font-weight="600" fill="#dc2626" class="mono">• exporter_send_failed_spans &gt; 0                 → El problema está aguas abajo (Tempo/Loki caído o red rota).</text>
  <text x="48" y="416" font-size="14" font-weight="600" fill="#2563eb" class="mono">• processor_refused_spans &gt; 0                    → memory_limiter activado: sube RAM o reduce batch/cola.</text>
</svg>
