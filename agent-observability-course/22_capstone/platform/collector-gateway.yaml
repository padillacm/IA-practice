# Gateway de la plataforma de SupportOps (capstone, módulo 22). Integra: memory_limiter (05), redaction (20), span_metrics ANTES del muestreo (18), tail_sampling (18) y exportadores a Tempo/Loki/Prometheus (OTLP).
# Generado por _tools/builders/build_22.py; validado con `otelcol-contrib validate` (0.162.0). Pensado para correr en la red de Compose del stack (`agentobs_default`): resuelve tempo, loki y prometheus por nombre.
# Prometheus recibe métricas por su receptor OTLP (http://prometheus:9090/api/v1/otlp). `num_traces` ≥ tráfico × decision_wait (módulo 18).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  resource/lab:
    attributes:
    - key: deployment.environment.name
      value: lab
      action: upsert
  redaction:
    allow_all_keys: true
    blocked_values:
    - \b(?:sk|pk|rk)-[A-Za-z0-9]{16,}\b|\bAKIA[0-9A-Z]{16}\b|\bBearer [A-Za-z0-9._~+/-]{16,}
    - '\bES\d{2}(?: ?\d{4}){5}\b'
    - '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+'
    - \b\d{8}[A-HJ-NP-TV-Z]\b|\b[XYZ]\d{7}[A-Z]\b
    - (?:\+34[ -]?)?\b[6-9]\d{2}[ .-]?\d{3}[ .-]?\d{3}\b
    - \b(?:\d[ -]?){13,19}\b
    summary: info
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
    - name: errors
      type: status_code
      status_code:
        status_codes:
        - ERROR
    - name: slow
      type: latency
      latency:
        threshold_ms: 8000
    - name: costly
      type: ottl_condition
      ottl_condition:
        error_mode: ignore
        span:
        - attributes["supportops.tree.cost_usd"] > 0.004
    - name: baseline
      type: probabilistic
      probabilistic:
        sampling_percentage: 10
  batch:
    timeout: 1s
    send_batch_size: 512
connectors:
  forward: {}
  span_metrics:
    histogram:
      explicit:
        buckets:
        - 100ms
        - 500ms
        - 1s
        - 2s
        - 5s
        - 10s
    dimensions:
    - name: supportops.status
    metrics_flush_interval: 10s
exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
service:
  extensions:
  - health_check
  pipelines:
    traces/in:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - redaction
      - resource/lab
      exporters:
      - forward
      - span_metrics
    traces/sampled:
      receivers:
      - forward
      processors:
      - tail_sampling
      - batch
      exporters:
      - otlp_grpc/tempo
    metrics:
      receivers:
      - otlp
      - span_metrics
      processors:
      - memory_limiter
      - resource/lab
      - batch
      exporters:
      - otlp_http/prometheus
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - redaction
      - resource/lab
      - batch
      exporters:
      - otlp_http/loki
  telemetry:
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
