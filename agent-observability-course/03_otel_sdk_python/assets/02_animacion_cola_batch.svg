<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="480">
  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .span-in { animation: arriveBurst 8s infinite; }
    .q-fill-1 { animation: fillSlot1 8s infinite; }
    .q-fill-2 { animation: fillSlot2 8s infinite; }
    .q-fill-3 { animation: fillSlot3 8s infinite; }
    .q-drop   { animation: dropOldest 8s infinite; }
    .batch-out{ animation: exportBatch 8s infinite; }

    @keyframes arriveBurst {
      0%, 5%   { opacity: 0.25; }
      10%, 85% { opacity: 1; }
      92%, 100%{ opacity: 0.25; }
    }
    @keyframes fillSlot1 {
      0%, 10%  { fill: #e2e8f0; }
      15%, 45% { fill: #3b82f6; }
      50%, 85% { fill: #16a34a; }
      90%, 100%{ fill: #e2e8f0; }
    }
    @keyframes fillSlot2 {
      0%, 20%  { fill: #e2e8f0; }
      25%, 45% { fill: #3b82f6; }
      50%, 85% { fill: #16a34a; }
      90%, 100%{ fill: #e2e8f0; }
    }
    @keyframes fillSlot3 {
      0%, 30%  { fill: #e2e8f0; }
      35%, 85% { fill: #3b82f6; }
      90%, 100%{ fill: #e2e8f0; }
    }
    @keyframes dropOldest {
      0%, 42%  { opacity: 0.2; }
      48%, 88% { opacity: 1; }
      94%, 100%{ opacity: 0.2; }
    }
    @keyframes exportBatch {
      0%, 60%  { opacity: 0.25; }
      68%, 92% { opacity: 1; }
      96%, 100%{ opacity: 0.25; }
    }
  </style>

  <rect width="1000" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="72" rx="16" fill="#0f172a" />
  <rect x="0" y="50" width="1000" height="22" fill="#0f172a" />
  <text x="36" y="34" font-size="21" font-weight="700" fill="#ffffff">DINÁMICA TEMPORAL: SATURACIÓN DE COLA EN BATCHSPANPROCESSOR</text>
  <text x="36" y="57" font-size="14" font-weight="400" fill="#cbd5e1">Por qué cuando λ &gt; B/d en una ráfaga se descartan los spans MÁS ANTIGUOS de la cola (hueco central)</text>

  <!-- Stage 1: Application Thread Burst -->
  <g class="span-in">
    <rect x="30" y="96" width="260" height="190" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
    <rect x="48" y="114" width="180" height="28" rx="6" fill="#2563eb" />
    <text x="138" y="133" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1. HILO DEL AGENTE (λ)</text>
    <text x="48" y="164" font-size="16" font-weight="700" fill="#0f172a" class="mono">span.end() → queue.append()</text>
    <text x="48" y="192" font-size="14" font-weight="600" fill="#334155">Coste en tu código: ~2 µs</text>
    <text x="48" y="216" font-size="14" font-weight="500" fill="#475569">No bloquea al agente, pero en</text>
    <text x="48" y="236" font-size="14" font-weight="500" fill="#475569">ráfaga produce λ = 3.000 spans/s</text>
    <text x="48" y="264" font-size="13" font-weight="700" fill="#1d4ed8">Ráfaga: seq #000 … #999</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 294 190 L 336 190" stroke="#64748b" stroke-width="3" />
  <polygon points="336,184 348,190 336,196" fill="#64748b" />

  <!-- Stage 2: Ring Buffer Queue (deque(maxlen=Q)) -->
  <rect x="352" y="96" width="320" height="190" rx="12" fill="#ffffff" stroke="#475569" stroke-width="3" />
  <rect x="370" y="114" width="236" height="28" rx="6" fill="#334155" />
  <text x="488" y="133" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2. COLA CIRCULAR (max_queue_size=Q)</text>
  <text x="370" y="164" font-size="15" font-weight="700" fill="#0f172a" class="mono">collections.deque(maxlen=Q)</text>

  <!-- Queue slots visual -->
  <rect x="370" y="180" width="86" height="38" rx="6" class="q-fill-1" stroke="#cbd5e1" stroke-width="2" />
  <text x="413" y="204" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mono">Nuevos</text>

  <rect x="466" y="180" width="86" height="38" rx="6" class="q-fill-2" stroke="#cbd5e1" stroke-width="2" />
  <text x="509" y="204" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mono">#850..999</text>

  <rect x="562" y="180" width="90" height="38" rx="6" class="q-fill-3" stroke="#cbd5e1" stroke-width="2" />
  <text x="607" y="204" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" class="mono">Lote #0..63</text>

  <text x="370" y="244" font-size="14" font-weight="600" fill="#334155">Tiempo hasta llenarse:</text>
  <text x="370" y="266" font-size="15" font-weight="700" fill="#0f172a" class="mono">t = Q / (λ - B/d)</text>

  <!-- Arrow 2 -->
  <path d="M 676 190 L 718 190" stroke="#64748b" stroke-width="3" />
  <polygon points="718,184 730,190 718,196" fill="#64748b" />

  <!-- Stage 3: Exporter Worker Thread -->
  <g class="batch-out">
    <rect x="734" y="96" width="236" height="190" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="3" />
    <rect x="752" y="114" width="200" height="28" rx="6" fill="#16a34a" />
    <text x="852" y="133" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3. HILO EXPORTADOR (B/d)</text>
    <text x="752" y="164" font-size="15" font-weight="700" fill="#0f172a" class="mono">POST :4318/v1/traces</text>
    <text x="752" y="192" font-size="14" font-weight="600" fill="#334155">Drena lotes de B=512 spans</text>
    <text x="752" y="216" font-size="14" font-weight="500" fill="#475569">Si la red tarda d=0.2s:</text>
    <text x="752" y="240" font-size="15" font-weight="700" fill="#15803d" class="mono">λ_max = 2.560 spans/s</text>
    <text x="752" y="266" font-size="13" font-weight="600" fill="#475569">1 llamada HTTP por lote</text>
  </g>

  <!-- Overflow / Dropped Spans Banner -->
  <g class="q-drop">
    <rect x="30" y="312" width="940" height="140" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3" />
    <rect x="52" y="330" width="246" height="28" rx="6" fill="#dc2626" />
    <text x="175" y="349" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">EFECTO COLA LLENA (Q PEQUEÑA)</text>
    <text x="314" y="350" font-size="17" font-weight="700" fill="#7f1d1d" class="mono">Se descartan los spans MÁS ANTIGUOS aún en cola (seq #064 … #849)</text>
    <text x="52" y="382" font-size="15" font-weight="600" fill="#991b1b">1. El primer lote (#000..#063) ya había salido hacia el exportador y se salva.</text>
    <text x="52" y="406" font-size="15" font-weight="600" fill="#991b1b">2. Mientras el exportador está ocupado en red (20 ms), los nuevos spans sobrescriben a los antiguos en el deque.</text>
    <text x="52" y="430" font-size="15" font-weight="700" fill="#b91c1c">3. Resultado: un «hueco ciego» en mitad del incidente, y al morir el proceso necesitas force_flush() / shutdown().</text>
  </g>
</svg>
