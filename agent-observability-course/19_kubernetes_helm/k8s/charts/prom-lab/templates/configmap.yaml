apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: otel-gateway
        dns_sd_configs:
          - names: ["{{ .Values.scrapeGatewayHost }}"]
            type: A
            port: {{ .Values.scrapeGatewayPort }}
