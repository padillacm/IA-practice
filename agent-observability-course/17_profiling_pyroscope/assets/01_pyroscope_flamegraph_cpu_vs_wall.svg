<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
    <marker id="arr17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">EL CUARTO PILAR: PROFILING CONTINUO CON PYROSCOPE Y FLAMEGRAPHS (MÓDULO 17)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">La traza te dice qué span tardó 800 ms; el perfil te dice qué línea exacta de Python quemó la CPU o bloqueó el hilo</text>

  <!-- Left Panel: How to Read a Flamegraph + Amdahl's Law -->
  <rect x="20" y="90" width="535" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="90" width="535" height="38" rx="12" fill="#ffedd5"/>
  <text x="36" y="114" class="panel-title" style="fill:#9a3412;">1. Anatomía de un Flamegraph (Ancho = Tiempo, NO Orden Temporal)</text>

  <!-- Flamegraph Visual -->
  <rect x="36" y="140" width="503" height="232" rx="8" fill="#0f172a"/>
  <text x="52" y="162" class="mono" style="fill:#94a3b8;">Muestreo a 100 Hz (cada 10 ms): el eje X ordena alfabéticamente y agrupa pilas</text>

  <!-- Root frame -->
  <rect x="52" y="176" width="471" height="28" rx="4" fill="#ea580c"/>
  <text x="287" y="195" text-anchor="middle" class="mono" style="fill:#ffffff;">invoke_agent (100% de las muestras = 500 samples)</text>

  <!-- Level 1 frames -->
  <rect x="52" y="208" width="110" height="28" rx="4" fill="#f59e0b"/>
  <text x="107" y="227" text-anchor="middle" class="mono" style="fill:#0f172a;font-size:11px;">build_prompt (22%)</text>

  <rect x="166" y="208" width="357" height="28" rx="4" fill="#dc2626"/>
  <text x="344" y="227" text-anchor="middle" class="mono" style="fill:#ffffff;">redact_pii_and_validate (78% de las muestras)</text>

  <!-- Level 2 frames (The Wide Plateau = Bottleneck!) -->
  <rect x="52" y="240" width="110" height="28" rx="4" fill="#fbbf24"/>
  <text x="107" y="259" text-anchor="middle" class="mono" style="fill:#0f172a;font-size:11px;">json.dumps (22%)</text>

  <rect x="166" y="240" width="315" height="28" rx="4" fill="#b91c1c" stroke="#fef08a" stroke-width="2"/>
  <text x="323" y="259" text-anchor="middle" class="mono" style="fill:#fef08a;">🔥 MESETA ANCHA: re.compile() dentro del bucle (67% self)</text>

  <rect x="485" y="240" width="38" height="28" rx="4" fill="#f87171"/>
  <text x="504" y="259" text-anchor="middle" class="mono" style="fill:#0f172a;font-size:10px;">hash</text>

  <rect x="52" y="282" width="471" height="76" rx="6" fill="#1e293b"/>
  <text x="66" y="304" class="body" style="fill:#f8fafc;font-size:12px;">• <tspan style="font-weight:700;fill:#fbbf24;">Torre estrecha y alta:</tspan> funciones que solo delegan (0% tiempo propio).</text>
  <text x="66" y="324" class="body" style="fill:#f8fafc;font-size:12px;">• <tspan style="font-weight:700;fill:#f87171;">Meseta ancha arriba del todo:</tspan> función hoja que quema CPU real → <tspan style="font-weight:700;">optimiza aquí</tspan>.</text>
  <text x="66" y="344" class="mono" style="fill:#4ade80;font-size:11.5px;">Ley de Amdahl: S = 1 / ((1 - p) + p/k) → Si p=0.67 y k=50x, speedup = 2.91×</text>

  <!-- Differential Flamegraph Box -->
  <rect x="36" y="384" width="503" height="156" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="408" class="card-title">Perfil Diferencial (Baseline v1 vs. Optimizado v2) en Pyroscope 2.x</text>
  <text x="52" y="430" class="body">Compara dos versiones o ventanas temporales superpuestas:</text>
  <rect x="52" y="444" width="225" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="164" y="467" text-anchor="middle" class="mono" style="fill:#991b1b;">Rojo = Creció consumo CPU</text>
  <rect x="294" y="444" width="225" height="36" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="406" y="467" text-anchor="middle" class="mono" style="fill:#166534;">Verde = Se redujo tras el fix</text>
  <text x="52" y="504" class="body" style="font-size:12px;">En un agente de N pasos, la fontanería por paso (serialización JSON, copia de</text>
  <text x="52" y="522" class="body" style="font-size:12px;">mensajes, redacción PII) se ejecuta N veces: un ahorro de 15 ms × 10 pasos = 150 ms.</text>

  <!-- Right Panel: CPU vs Wall Time + GIL + Trace-to-Profile Correlation -->
  <rect x="570" y="90" width="530" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="90" width="530" height="38" rx="12" fill="#ede9fe"/>
  <text x="586" y="114" class="panel-title" style="fill:#5b21b6;">2. CPU vs. Wall-Time en Agentes LLM y Correlación con Trazas</text>

  <!-- CPU vs Wall Comparison -->
  <rect x="586" y="140" width="498" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="602" y="164" class="card-title">¿Por qué un Agente lento puede mostrar 2% de CPU?</text>

  <text x="602" y="192" class="mono" style="fill:#1e40af;">Perfil Wall-Time (Reloj real = 2,000 ms):</text>
  <rect x="602" y="200" width="85" height="24" rx="4" fill="#ea580c"/>
  <rect x="687" y="200" width="380" height="24" rx="4" fill="#3b82f6"/>
  <text x="644" y="216" text-anchor="middle" class="mono" style="fill:#ffffff;font-size:10.5px;">CPU (180ms)</text>
  <text x="877" y="216" text-anchor="middle" class="mono" style="fill:#ffffff;font-size:11px;">I/O Red: Esperando respuesta del LLM / MCP (1,820 ms)</text>

  <text x="602" y="250" class="mono" style="fill:#9a3412;">Perfil CPU-Time (Solo hilos ejecutando instrucciones = 180 ms):</text>
  <rect x="602" y="258" width="465" height="24" rx="4" fill="#ea580c"/>
  <text x="834" y="274" text-anchor="middle" class="mono" style="fill:#ffffff;font-size:11px;">100% visible: serialización Pydantic, regex PII, tiktoken, compresión</text>

  <text x="602" y="302" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Sesgo del GIL en Python:</tspan> un muestreador en hilo Python no interrumpe extensiones C</text>
  <text x="602" y="320" class="body" style="font-size:12px;">  que retienen el GIL; en producción usa perfiladores nativos (<tspan class="mono">pyroscope-io / py-spy / eBPF</tspan>).</text>

  <!-- Span Profiles: Trace <-> Flamegraph Bridge -->
  <rect x="586" y="344" width="498" height="196" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="602" y="368" class="card-title" style="fill:#5b21b6;">Puente Traza ↔ Perfil (Span Profiles): De Tempo a Pyroscope en 1 Clic</text>

  <rect x="602" y="382" width="466" height="82" rx="6" fill="#0f172a"/>
  <text x="616" y="404" class="mono" style="fill:#38bdf8;">with tracer.start_as_current_span("invoke_agent") as span:</text>
  <text x="616" y="424" class="mono" style="fill:#4ade80;">    with pyroscope.tag_wrapper({"span_id": span_id_hex, "step": "redact"}):</text>
  <text x="616" y="444" class="mono" style="fill:#f8fafc;">        run_supportops_step()</text>

  <text x="602" y="486" class="body">• Etiquetas de <tspan style="font-weight:700;fill:#15803d;">baja cardinalidad</tspan> en Pyroscope: <tspan class="mono">service.version, agent, step</tspan>.</text>
  <text x="602" y="506" class="body">• <tspan class="mono" style="fill:#6d28d9;">span_id</tspan> se adjunta como etiqueta de correlación de perfil para saltar desde</text>
  <text x="602" y="524" class="body">  un span lento en Tempo directamente al flamegraph exacto de ese span.</text>

  <!-- Bottom Banner -->
  <rect x="20" y="568" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="595" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Sobrecarga en Producción: muestrear a 100 Hz cuesta &lt; 1.5% de CPU y revela cuellos de botella invisibles para los spans.</text>
</svg>