<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="100%" height="480">
  <style>
    text { stroke: none !important; font-family: 'Segoe UI', system-ui, sans-serif; text-rendering: geometricPrecision; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
  </style>
  <rect width="1040" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect width="1040" height="70" rx="16" fill="#0f172a" />
  <rect y="48" width="1040" height="22" fill="#0f172a" />
  <text x="36" y="34" font-size="21" font-weight="700" fill="#ffffff">ARQUITECTURA DE LOKI 3 Y PIPELINE DE CONSULTA LOGQL (MÓDULO 08)</text>
  <text x="36" y="56" font-size="14" fill="#cbd5e1">Dónde guardar cada campo (Labels vs. Structured Metadata vs. JSON) para búsquedas rápidas sin explotar el índice</text>

  <!-- 3 Tiers of Loki Storage -->
  <rect x="26" y="90" width="312" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
  <rect x="44" y="108" width="210" height="26" rx="5" fill="#16a34a" />
  <text x="149" y="126" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1. ETIQUETAS DE STREAM (INDEXADAS)</text>
  <text x="44" y="156" font-size="15" font-weight="700" fill="#14532d"> Cardinalidad MUY BAJA (&lt; 100)</text>
  <text x="44" y="182" font-size="13" fill="#0f172a" class="mono">service_name = "supportops-agent"</text>
  <text x="44" y="202" font-size="13" fill="#0f172a" class="mono">deployment_environment = "prod"</text>
  <text x="44" y="232" font-size="13" fill="#166534">Cada combinación crea un stream</text>
  <text x="44" y="252" font-size="13" fill="#166534">y un chunk propio en el índice.</text>
  <text x="44" y="278" font-size="13" font-weight="700" fill="#dc2626">¡PROHIBIDO poner trace_id aquí!</text>

  <rect x="364" y="90" width="312" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <rect x="382" y="108" width="230" height="26" rx="5" fill="#2563eb" />
  <text x="497" y="126" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. STRUCTURED METADATA (LOKI 3)</text>
  <text x="382" y="156" font-size="15" font-weight="700" fill="#1e3a8a">Alta Cardinalidad (Sin inflar índice)</text>
  <text x="382" y="182" font-size="13" fill="#0f172a" class="mono">trace_id = "4bf92f3577b34da6..."</text>
  <text x="382" y="202" font-size="13" fill="#0f172a" class="mono">span_id  = "00f067aa0ba902b7"</text>
  <text x="382" y="222" font-size="13" fill="#0f172a" class="mono">ticket_id = "T-00981"</text>
  <text x="382" y="252" font-size="13" fill="#1e40af">Viaja junto al log por OTLP nativo.</text>
  <text x="382" y="274" font-size="13" font-weight="700" fill="#1d4ed8">Acelerado por Bloom Filters.</text>

  <rect x="702" y="90" width="312" height="210" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5" />
  <rect x="720" y="108" width="200" height="26" rx="5" fill="#7c3aed" />
  <text x="820" y="126" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. CUERPO / ATRIBUTOS JSON</text>
  <text x="720" y="156" font-size="15" font-weight="700" fill="#4c1d95">Se parsea en Tiempo de Consulta</text>
  <text x="720" y="182" font-size="13" fill="#0f172a" class="mono">{"msg": "error de herramienta",</text>
  <text x="720" y="202" font-size="13" fill="#0f172a" class="mono"> "tool": "get_order", "ms": 5012}</text>
  <text x="720" y="236" font-size="13" fill="#5b21b6">Cero coste al escribir; pagas CPU</text>
  <text x="720" y="256" font-size="13" fill="#5b21b6">solo al descomprimir el bloque.</text>

  <!-- Bottom: Optimal LogQL Query Pipeline -->
  <rect x="26" y="320" width="988" height="134" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
  <text x="46" y="350" font-size="16" font-weight="700" fill="#0f172a">⚡ El Orden Óptimo de una Consulta LogQL (De Más Barato a Más Caro)</text>
  <text x="46" y="382" font-size="15" font-weight="700" fill="#1e3a8a" class="mono">{service_name="supportops-agent"}  |= "error"  | trace_id="4bf9..."  | json  | duration_ms &gt; 1000</text>
  <text x="46" y="412" font-size="13" font-weight="600" fill="#334155">① Selector de Stream (Índice) → ② Filtro de texto crudo (grep) → ③ Structured Metadata → ④ Parser JSON (al final, sobre pocas líneas)</text>
  <text x="46" y="436" font-size="13" font-weight="700" fill="#dc2626">Regla de rendimiento: NUNCA pongas `| json` antes de `|= "texto"` o parsearás millones de líneas innecesariamente.</text>
</svg>
