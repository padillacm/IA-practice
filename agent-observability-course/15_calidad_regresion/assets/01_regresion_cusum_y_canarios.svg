<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
    <marker id="arr15" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">CALIDAD Y REGRESIÓN: DE TRAZAS REALES A COMPUERTA DE RELEASE Y CUSUM (MÓDULO 15)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Cuando un prompt nuevo parece «más rápido y barato» porque dejó de llamar a herramientas: cómo cazarlo antes y durante el canario</text>

  <!-- Top Panel: The Silent Regression Paradox + Flywheel -->
  <rect x="20" y="90" width="1080" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="116" class="panel-title">1. La Paradoja de la Regresión Silenciosa y el Ciclo Trazas → Dataset → Replay Gate</text>

  <!-- Paradox Box -->
  <rect x="38" y="132" width="440" height="162" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="54" y="156" class="card-title" style="fill:#991b1b;">¿Por qué el dashboard clásico aplaude una regresión?</text>
  <text x="54" y="180" class="mono" style="fill:#15803d;">v1 (Estable):  Latencia 1.1s | Coste $0.004 | Calidad: 92%</text>
  <text x="54" y="202" class="mono" style="fill:#b91c1c;">v2 (Prompt):   Latencia 0.5s | Coste $0.001 | Calidad: 61% ❌</text>
  <text x="54" y="228" class="body" style="font-size:12px;fill:#7f1d1d;">• En <tspan class="mono">v2</tspan> el prompt dice «sé conciso» y el agente deja de llamar a <tspan class="mono">get_order</tspan>.</text>
  <text x="54" y="248" class="body" style="font-size:12px;fill:#7f1d1d;">• Latencia y coste bajan a la mitad, HTTP 200 = 100%, pero inventa estados.</text>
  <text x="54" y="272" class="mono" style="font-size:11.5px;fill:#991b1b;">Huella en telemetría: caída brusca en ratio spans(execute_tool)/spans(invoke_agent)</text>

  <!-- Flywheel 4 boxes -->
  <rect x="500" y="132" width="582" height="162" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="516" y="156" class="card-title" style="fill:#1e40af;">Compuerta de Release con Datos de Producción:</text>

  <rect x="516" y="172" width="128" height="104" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="580" y="196" text-anchor="middle" class="card-title" style="font-size:12.5px;fill:#1d4ed8;">1. Trazas Reales</text>
  <text x="580" y="218" text-anchor="middle" class="body" style="font-size:11px;">Extrae fallos,</text>
  <text x="580" y="234" text-anchor="middle" class="body" style="font-size:11px;">bordes y estratos</text>
  <text x="580" y="250" text-anchor="middle" class="body" style="font-size:11px;">desde Tempo</text>

  <line x1="644" y1="224" x2="662" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arr15)"/>

  <rect x="666" y="172" width="128" height="104" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="730" y="196" text-anchor="middle" class="card-title" style="font-size:12.5px;fill:#5b21b6;">2. Replay Dual</text>
  <text x="730" y="218" text-anchor="middle" class="body" style="font-size:11px;">Mocks grabados</text>
  <text x="730" y="234" text-anchor="middle" class="body" style="font-size:11px;">(determinista) o</text>
  <text x="730" y="250" text-anchor="middle" class="body" style="font-size:11px;">Live end-to-end</text>

  <line x1="794" y1="224" x2="812" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arr15)"/>

  <rect x="816" y="172" width="128" height="104" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="880" y="196" text-anchor="middle" class="card-title" style="font-size:12.5px;fill:#047857;">3. Test Pareado</text>
  <text x="880" y="218" text-anchor="middle" class="body" style="font-size:11px;">Bootstrap IC 95%</text>
  <text x="880" y="234" text-anchor="middle" class="body" style="font-size:11px;">sobre los mismos</text>
  <text x="880" y="250" text-anchor="middle" class="body" style="font-size:11px;">tickets (A - B)</text>

  <line x1="944" y1="224" x2="962" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arr15)"/>

  <rect x="966" y="172" width="102" height="104" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1017" y="196" text-anchor="middle" class="card-title" style="font-size:12.5px;fill:#b45309;">4. Canario</text>
  <text x="1017" y="218" text-anchor="middle" class="body" style="font-size:11px;">5% → 25%</text>
  <text x="1017" y="234" text-anchor="middle" class="body" style="font-size:11px;">con SPRT</text>
  <text x="1017" y="250" text-anchor="middle" class="body" style="font-size:11px;">y CUSUM</text>

  <!-- Bottom Left: Three Types of Drift & PSI / JS -->
  <rect x="20" y="325" width="535" height="285" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="325" width="535" height="38" rx="12" fill="#ede9fe"/>
  <text x="36" y="349" class="panel-title" style="fill:#5b21b6;">2. Los 3 Tipos de Drift y Cómo Medirlos sin Etiquetas</text>

  <rect x="36" y="376" width="503" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="396" class="card-title" style="fill:#1d4ed8;">A. Drift de Entrada (Cambió el mundo / los usuarios):</text>
  <text x="50" y="416" class="body">Mide <tspan style="font-weight:700;">PSI (Population Stability Index)</tspan> o <tspan style="font-weight:700;">Jensen-Shannon</tspan> sobre categorías e idiomas.</text>
  <text x="50" y="434" class="mono" style="font-size:11.5px;fill:#475569;">PSI &lt; 0.10 (Estable)  |  0.10–0.25 (Vigilar)  |  PSI ≥ 0.25 (Drift Severo)</text>

  <rect x="36" y="452" width="503" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="472" class="card-title" style="fill:#7c3aed;">B. Drift de Comportamiento (La huella de versión en trazas):</text>
  <text x="50" y="492" class="body">Incluso sin juez online, compara por <tspan class="mono">service.version</tspan> la distribución de</text>
  <text x="50" y="510" class="mono" style="font-size:11.5px;fill:#5b21b6;">pasos por ticket, mix de herramientas llamadas y finish_reason.</text>

  <rect x="36" y="528" width="503" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="548" class="card-title" style="fill:#b45309;">C. El Pecado del «Peeking» (Mirar el p-valor cada hora):</text>
  <text x="50" y="568" class="body">Mirar repetidamente un test A/B dispara los falsos positivos del 5% al &gt;25%.</text>
  <text x="50" y="586" class="body">Usa un <tspan style="font-weight:700;fill:#b45309;">test secuencial (SPRT de Wald)</tspan> diseñado para evaluar cada muestra en vivo.</text>

  <!-- Bottom Right: CUSUM Chart Visual -->
  <rect x="570" y="325" width="530" height="285" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="325" width="530" height="38" rx="12" fill="#fee2e2"/>
  <text x="586" y="349" class="panel-title" style="fill:#991b1b;">3. CUSUM: Detectar Degradaciones Lentas que No Disparan Umbrales</text>

  <text x="586" y="382" class="body">Una caída del 3% diario no cruza un umbral puntual, pero acumula evidencia:</text>
  <rect x="586" y="394" width="498" height="34" rx="6" fill="#0f172a"/>
  <text x="835" y="416" text-anchor="middle" class="mono" style="fill:#4ade80;font-size:13px;">S_t = max(0, S_{t-1} + (μ_0 - x_t - k))   →   Alerta si S_t &gt; h</text>

  <!-- Mini chart -->
  <rect x="586" y="438" width="498" height="156" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Threshold line h -->
  <line x1="610" y1="475" x2="1060" y2="475" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="616" y="468" class="mono" style="fill:#dc2626;font-size:11px;">Umbral de Alerta CUSUM (h = 4.5)</text>

  <!-- Baseline -->
  <line x1="610" y1="565" x2="1060" y2="565" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="800" y1="450" x2="800" y2="575" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="800" y="588" text-anchor="middle" class="mono" style="font-size:11px;fill:#475569;">t = Despliegue v2 (Deriva de -4%)</text>

  <!-- CUSUM curve -->
  <polyline points="610,562 650,555 690,563 730,558 770,564 800,562 835,545 870,526 905,508 940,485 975,460 1010,452" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <circle cx="960" cy="470" r="6" fill="#dc2626"/>
  <text x="965" y="456" class="mono" style="fill:#dc2626;font-size:11.5px;">¡Alarma S_t &gt; h!</text>
</svg>