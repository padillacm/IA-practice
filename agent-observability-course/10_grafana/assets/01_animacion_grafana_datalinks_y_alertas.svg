<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="100%" height="480">
  <style>
    text { stroke: none !important; font-family: 'Segoe UI', system-ui, sans-serif; text-rendering: geometricPrecision; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .st-norm { animation: aNorm 9s infinite; }
    .st-pend { animation: aPend 9s infinite; }
    .st-fire { animation: aFire 9s infinite; }
    @keyframes aNorm { 0%,25%{opacity:1} 30%,80%{opacity:0.35} 85%,100%{opacity:1} }
    @keyframes aPend { 0%,25%{opacity:0.35} 30%,58%{opacity:1} 62%,100%{opacity:0.35} }
    @keyframes aFire { 0%,58%{opacity:0.35} 62%,84%{opacity:1} 88%,100%{opacity:0.35} }
  </style>
  <rect width="1040" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect width="1040" height="70" rx="16" fill="#0f172a" />
  <rect y="48" width="1040" height="22" fill="#0f172a" />
  <text x="36" y="34" font-size="21" font-weight="700" fill="#ffffff">GRAFANA COMO CÓDIGO: MÁQUINA DE ESTADOS DE ALERTAS Y CORRELACIÓN</text>
  <text x="36" y="56" font-size="14" fill="#cbd5e1">Ciclo temporal Normal → Pending (ventana "for") → Firing y aprovisionamiento reproducible en YAML/JSON</text>

  <!-- Alert State Machine Animation -->
  <rect x="26" y="88" width="988" height="202" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
  <text x="46" y="116" font-size="17" font-weight="700" fill="#0f172a">1. Animación del Ciclo de Vida de una Alerta (Por qué la ventana `for` evita falsas alarmas)</text>

  <!-- State 1: Normal -->
  <g class="st-norm">
    <rect x="46" y="136" width="260" height="132" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" />
    <rect x="64" y="152" width="110" height="26" rx="5" fill="#16a34a" />
    <text x="119" y="170" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1. NORMAL</text>
    <text x="64" y="198" font-size="14" font-weight="700" fill="#14532d" class="mono">condición == False</text>
    <text x="64" y="222" font-size="13" fill="#166534">El SLI cumple el umbral.</text>
    <text x="64" y="244" font-size="13" fill="#166534">Si vuelve aquí desde Pending,</text>
    <text x="64" y="260" font-size="13" font-weight="700" fill="#15803d">¡no se envía ninguna alerta!</text>
  </g>

  <path d="M 310 202 L 368 202" stroke="#64748b" stroke-width="3" />
  <polygon points="368,196 380,202 368,208" fill="#64748b" />
  <text x="344" y="192" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Umbral roto</text>

  <!-- State 2: Pending -->
  <g class="st-pend">
    <rect x="384" y="136" width="280" height="132" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="3" />
    <rect x="402" y="152" width="176" height="26" rx="5" fill="#d97706" />
    <text x="490" y="170" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2. PENDING (for: 5m)</text>
    <text x="402" y="198" font-size="14" font-weight="700" fill="#78350f" class="mono">condición == True (t &lt; for)</text>
    <text x="402" y="222" font-size="13" fill="#92400e">Filtra picos breves y ruido.</text>
    <text x="402" y="244" font-size="13" fill="#92400e">Espera a que la degradación sea</text>
    <text x="402" y="260" font-size="13" font-weight="700" fill="#b45309">sostenida durante todo `for`.</text>
  </g>

  <path d="M 668 202 L 726 202" stroke="#dc2626" stroke-width="3" />
  <polygon points="726,196 738,202 726,208" fill="#dc2626" />
  <text x="702" y="192" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">t ≥ 5m</text>

  <!-- State 3: Firing -->
  <g class="st-fire">
    <rect x="742" y="136" width="252" height="132" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="3" />
    <rect x="760" y="152" width="116" height="26" rx="5" fill="#dc2626" />
    <text x="818" y="170" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3. FIRING</text>
    <text x="760" y="198" font-size="14" font-weight="700" fill="#7f1d1d" class="mono">Notifica a On-Call</text>
    <text x="760" y="222" font-size="13" fill="#991b1b">Incluye anotaciones con</text>
    <text x="760" y="244" font-size="13" font-weight="700" fill="#b91c1c">enlace al Dashboard y Runbook.</text>
  </g>

  <!-- Bottom Section: Provisioning & Data Links as Code -->
  <rect x="26" y="308" width="988" height="146" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <text x="46" y="336" font-size="17" font-weight="700" fill="#1e3a8a">2. Aprovisionamiento como Código y Puentes de Correlación en `datasources.yaml`</text>
  <text x="46" y="366" font-size="14" font-weight="600" fill="#334155">• Prometheus (`exemplarTraceIdDestinations`) → Convierte cada punto de exemplar en un botón directo hacia Tempo.</text>
  <text x="46" y="392" font-size="14" font-weight="600" fill="#334155">• Tempo (`tracesToLogsV2`) → Añade el botón «Logs for this span» filtrando en Loki por `service.name` + `trace_id`.</text>
  <text x="46" y="418" font-size="14" font-weight="600" fill="#334155">• Loki (`derivedFields`) → Detecta `trace_id` en los logs y genera el enlace inverso para abrir la cascada en Tempo.</text>
  <text x="46" y="442" font-size="13" font-weight="700" fill="#dc2626">⚠️ Regla de GitOps: un cambio hecho a clic en la UI sobre un dashboard aprovisionado se pierde al reiniciar si no se exporta al JSON del repo.</text>
</svg>
