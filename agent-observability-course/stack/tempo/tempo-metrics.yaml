# Igual que tempo.yaml + metrics-generator (span metrics y service graphs) con remote-write a Prometheus.
# Úsalo con:  TEMPO_CONFIG=tempo-metrics.yaml docker compose --profile core --profile metrics up -d
# Requiere el perfil `metrics` (Prometheus con --web.enable-remote-write-receiver). Lo explica el módulo 07.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

live_store:
  max_trace_idle: 10s
  max_block_duration: 5m
  max_block_bytes: 1_000_000

backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        max_block_bytes: 100_000_000
        block_retention: 24h
        compacted_block_retention: 10m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  processor:
    span_metrics:
      dimensions: []
    service_graphs: {}
  registry:
    collection_interval: 15s
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
