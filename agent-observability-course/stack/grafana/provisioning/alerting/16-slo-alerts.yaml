# Alertas de SLO de SupportOps (módulo 16): burn rate MULTIVENTANA con ventanas comprimidas de laboratorio (larga 5 min + corta 1 min = página; 15 + 3 min = ticket).
# Generado por _tools/builders/build_16.py con supportops.slo.grafana_burn_rule. Cada regla: A (burn largo) B (burn corto) -> reduce C/D -> math E ($C > f && $D > f) -> umbral F.
# interval: múltiplo de 10 s (tick del planificador de Grafana; 15s hace que NO arranque). El vínculo alerta-panel va en annotations.__dashboardUid__ / __panelId__.
apiVersion: 1
groups:
- orgId: 1
  name: supportops-slo
  folder: Curso observabilidad de agentes
  interval: 30s
  rules:
  - uid: slo-availability-fast-burn
    title: SLO availability · fast-burn (×14.4)
    condition: F
    for: 0s
    noDataState: OK
    execErrState: Error
    isPaused: false
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (1 - (sum(rate(supportops_agent_requests_total{service_name="supportops-agent",supportops_status=~"ok|escalated"}[5m])) / sum(rate(supportops_agent_requests_total{service_name="supportops-agent"}[5m])))) / 0.01
        instant: true
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: B
        expr: (1 - (sum(rate(supportops_agent_requests_total{service_name="supportops-agent",supportops_status=~"ok|escalated"}[1m])) / sum(rate(supportops_agent_requests_total{service_name="supportops-agent"}[1m])))) / 0.01
        instant: true
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: D
      datasourceUid: __expr__
      model:
        refId: D
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: dropNN
    - refId: E
      datasourceUid: __expr__
      model:
        refId: E
        type: math
        expression: $C > 14.4 && $D > 14.4
    - refId: F
      datasourceUid: __expr__
      model:
        refId: F
        type: threshold
        expression: E
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    annotations:
      __dashboardUid__: slo-agente
      __panelId__: '12'
      summary: 'SLO availability: burn rate ≥ 14.4× en 5m y 1m'
      description: 'El SLO «El ticket termina `ok` o `escalated` (no error, degradado ni max_steps)» (objetivo 99.00%) consume presupuesto a ≥ 14.4× el ritmo sostenible en la ventana larga (5m) y en la corta (1m). Burn rate largo: {{ humanize $values.C.Value }}×.'
      runbook_url: https://github.com/padillacm/IA-practice/blob/master/agent-observability-course/16_slos_alertas_incidentes/runbooks/slo-availability-fast-burn.md
    labels:
      severity: page
      team: plataforma
      service: supportops-agent
      slo: availability
