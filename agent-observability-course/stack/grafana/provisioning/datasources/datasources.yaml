# Datasources aprovisionados como código (Grafana carga esto al arrancar). UIDs FIJOS: úsalos en dashboards y alertas.
#   tempo | loki | prometheus | pyroscope
apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus        # requiere span metrics (perfil metrics + tempo-metrics.yaml)
      tracesToLogsV2:                    # salto traza -> logs relacionados en Loki
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:                   # salto span -> métricas en Prometheus
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
      tracesToProfiles:                  # salto span -> perfil en Pyroscope (módulo 17; el span lleva pyroscope.profile.id = span_id)
        datasourceUid: pyroscope
        profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
        tags:
          - key: service.name
            value: service_name
        # Sin customQuery: Grafana construye {service_name="..."} y, si el span lleva pyroscope.profile.id, filtra por ese span
        # (spanSelector). OJO: `span_id="..."` dentro del selector de etiquetas NO funciona en Pyroscope 2.1.2 (medido: 0 muestras;
        # span_id se consulta con SelectMergeSpanProfile/spanSelector, no como etiqueta).
      streamingEnabled:
        search: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:                     # trace_id (structured metadata) -> abre la traza en Tempo
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Ver traza en Tempo

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      exemplarTraceIdDestinations:       # exemplar -> traza en Tempo
        - name: trace_id
          datasourceUid: tempo

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
