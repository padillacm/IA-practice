# Loki 3.x en modo monolítico (single binary), almacenamiento en el sistema de ficheros.
# Ingesta OTLP nativa en /otlp (la usa el Collector) y estructurada con "structured metadata".
auth_enabled: false                 # un único tenant (laboratorio)

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13                   # v13 es requisito para structured metadata / OTLP nativo
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true   # trace_id, span_id... viajan como metadatos, no como labels
  volume_enabled: true              # usado por Grafana Logs Drilldown
  retention_period: 168h

compactor:                          # la retención solo se aplica si el compactor la activa
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem  # obligatorio con retention_enabled

analytics:
  reporting_enabled: false
