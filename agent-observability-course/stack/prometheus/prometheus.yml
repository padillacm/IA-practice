# Prometheus (perfil "metrics"). Raspa al Collector (métricas de las apps en :8889, internas en :8888),
# y a sí mismo. Tempo y Loki exponen /metrics en sus puertos HTTP.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector-apps        # métricas OTel de las aplicaciones (vía exporter prometheus)
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-internal    # telemetría interna del Collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
