<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="100%">
  <defs>
    <style>
      
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }

      @keyframes streamIn {
        0% { stroke-dashoffset: 180; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseError {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #ef4444); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 10px #ef4444); }
      }
      @keyframes fadeDrop {
        0%, 40% { opacity: 1; }
        70%, 100% { opacity: 0.22; }
      }
      .stream-arrow {
        stroke-dasharray: 10 6;
        animation: streamIn 1.8s linear infinite;
      }
      .keep-card {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseError 2.4s ease-in-out infinite;
      }
      .drop-card {
        animation: fadeDrop 3.2s ease-in-out infinite;
      }
    </style>
    <marker id="arr18a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr18r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1120" height="560" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#1e1b4b"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">DINÁMICA DEL BUFFER DE TAIL SAMPLING: DECISION_WAIT EN VIVO (ANIMACIÓN)</text>
  <text x="40" y="64" class="subtitle" style="fill:#c7d2fe;">El Collector agrupa todos los spans por trace_id durante decision_wait (ej. 10s) antes de decidir si guarda o descarta</text>

  <!-- Stage 1: Incoming Spans -->
  <rect x="20" y="92" width="250" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="92" width="250" height="36" rx="12" fill="#e0e7ff"/>
  <text x="145" y="115" text-anchor="middle" class="panel-title" style="fill:#3730a3;">1. Entrada de Spans</text>

  <rect x="36" y="144" width="218" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="166" class="card-title">Llegan desordenados:</text>
  <text x="50" y="188" class="mono" style="fill:#2563eb;">span: chat (T1) [OK]</text>
  <text x="50" y="206" class="mono" style="fill:#16a34a;">span: get_order (T2) [OK]</text>
  <text x="50" y="224" class="mono" style="fill:#dc2626;">span: refund (T1) [ERROR]</text>

  <rect x="36" y="250" width="218" height="214" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="274" class="card-title" style="fill:#b45309;">Requisito de Escalado:</text>
  <text x="50" y="298" class="body">Si tienes múltiples réplicas del Collector Gateway, <tspan style="font-weight:700;fill:#92400e;">todos los spans del mismo trace_id</tspan></text>
  <text x="50" y="340" class="body">deben ir al <tspan style="font-weight:700;">mismo pod</tspan> usando el exporter <tspan class="mono" style="fill:#b45309;">loadbalancing</tspan> con</text>
  <text x="50" y="382" class="mono" style="fill:#78350f;">routing_key: "traceID"</text>
  <text x="50" y="410" class="body" style="font-size:11.5px;">Sin afinidad, cada Collector ve media traza y toma decisiones opuestas.</text>

  <line x1="270" y1="240" x2="310" y2="240" stroke="#4f46e5" stroke-width="3" class="stream-arrow"/>

  <!-- Stage 2: Ring Buffer in RAM (decision_wait) -->
  <rect x="315" y="92" width="465" height="390" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="315" y="92" width="465" height="36" rx="12" fill="#4f46e5"/>
  <text x="547" y="115" text-anchor="middle" class="panel-title" style="fill:#ffffff;">2. Buffer en Memoria (decision_wait = 10s | num_traces = 50,000)</text>

  <!-- Trace T1 Slot (Has error -> KEEP) -->
  <rect x="335" y="144" width="425" height="102" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" class="keep-card"/>
  <text x="351" y="166" class="card-title" style="fill:#991b1b;">Bucket trace_id = T1 (Ticket con fallo en paso 4)</text>
  <text x="351" y="188" class="mono" style="fill:#334155;">[t=0.1s] chat (OK)  →  [t=0.8s] get_order (OK)</text>
  <text x="351" y="208" class="mono" style="fill:#dc2626;">[t=5.9s] execute_tool issue_refund (STATUS_ERROR / Timeout)</text>
  <text x="351" y="230" class="mono" style="fill:#b91c1c;">⚡ Regla activada: status_code == ERROR  →  DECISIÓN: SAMPLED (100%)</text>

  <!-- Trace T2 Slot (High Cost / Loop -> KEEP) -->
  <rect x="335" y="258" width="425" height="96" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" class="keep-card"/>
  <text x="351" y="280" class="card-title" style="fill:#92400e;">Bucket trace_id = T2 (HTTP 200 OK, pero Bucle Caro)</text>
  <text x="351" y="302" class="mono" style="fill:#334155;">[10 spans chat/tool]  |  supportops.cost_usd = $0.084</text>
  <text x="351" y="322" class="mono" style="fill:#b45309;">⚡ Regla activada: numeric_attribute(cost_usd &gt; 0.03)</text>
  <text x="351" y="342" class="mono" style="fill:#15803d;">→ DECISIÓN AL EXPIRAR TIMER: SAMPLED (100%)</text>

  <!-- Trace T3..T20 Slot (Normal Happy Path -> 95% DROP) -->
  <rect x="335" y="366" width="425" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" class="drop-card"/>
  <text x="351" y="388" class="card-title" style="fill:#475569;">Buckets trace_id = T3 … T20 (Tráfico normal rápido &lt; 1.2s, OK)</text>
  <text x="351" y="410" class="mono" style="fill:#64748b;">[t=0.6s] invoke_agent (OK) + chat (OK) + get_order (OK)</text>
  <text x="351" y="430" class="mono" style="fill:#475569;">Ninguna regla de anomalía coincide → cae a probabilistic(5%)</text>
  <text x="351" y="452" class="mono" style="fill:#dc2626;">🗑️ 95% DESCARTADO de RAM (No se envía a Tempo)</text>

  <!-- Stage 3: Output -->
  <line x1="780" y1="195" x2="825" y2="195" stroke="#16a34a" stroke-width="3" class="stream-arrow" marker-end="url(#arr18a)"/>
  <line x1="780" y1="305" x2="825" y2="305" stroke="#16a34a" stroke-width="3" class="stream-arrow" marker-end="url(#arr18a)"/>
  <line x1="780" y1="415" x2="825" y2="415" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr18r)"/>

  <rect x="830" y="92" width="270" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="830" y="92" width="270" height="36" rx="12" fill="#dcfce7"/>
  <text x="965" y="115" text-anchor="middle" class="panel-title" style="fill:#166534;">3. Exportación a Tempo</text>

  <rect x="846" y="148" width="238" height="190" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="965" y="174" text-anchor="middle" class="card-title" style="fill:#15803d;">Trazas Guardadas (~12%):</text>
  <text x="860" y="202" class="body">✅ <tspan style="font-weight:700;">100%</tspan> de errores y timeouts</text>
  <text x="860" y="226" class="body">✅ <tspan style="font-weight:700;">100%</tspan> de tickets lentos (&gt;3s)</text>
  <text x="860" y="250" class="body">✅ <tspan style="font-weight:700;">100%</tspan> de bucles y sobrecostes</text>
  <text x="860" y="274" class="body">✅ <tspan style="font-weight:700;">100%</tspan> de alucinaciones cazadas</text>
  <text x="860" y="298" class="body">✅ <tspan style="font-weight:700;">5%</tspan> de muestra base sana</text>
  <text x="860" y="322" class="mono" style="fill:#166534;font-size:11.5px;">Ahorro de disco y red: -88%</text>

  <rect x="846" y="356" width="238" height="110" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="860" y="380" class="card-title" style="fill:#991b1b;">¿Qué pasa si num_traces se llena?</text>
  <text x="860" y="402" class="body" style="font-size:11.5px;">El Collector desaloja las trazas más antiguas antes de <tspan class="mono">decision_wait</tspan>.</text>
  <text x="860" y="438" class="mono" style="font-size:11px;fill:#b91c1c;">Dimensiona: num_traces ≥ RPS × decision_wait × 1.5</text>

  <!-- Footer -->
  <rect x="20" y="498" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="525" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Si un agente puede tardar hasta 25s en un bucle, decision_wait debe ser ≥ 30s para no decidir antes de que llegue el span raíz.</text>
</svg>