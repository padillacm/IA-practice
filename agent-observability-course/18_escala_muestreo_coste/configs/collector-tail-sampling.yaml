# Collector con TAIL SAMPLING (módulo 18). Verificado con `otelcol-contrib validate` 0.162.0.
# RED (span_metrics) se calcula ANTES del muestreo (pipeline traces/in); lo conservado sale por traces/sampled.
# ⚠️ numeric_attribute usa int64 en 0.162.0 (un decimal trunca y, con atributos double, el procesador cae): el coste va con ottl_condition.
receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
processors:
  tail_sampling:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 50
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes:
            - ERROR
      - name: slow
        type: latency
        latency:
          threshold_ms: 5000
      - name: costly
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - "attributes[\"supportops.cost_usd\"] > 0.0005"
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
    decision_cache:
      sampled_cache_size: 100000
      non_sampled_cache_size: 100000
connectors:
  forward: {}
  span_metrics:
    histogram:
      explicit:
        buckets:
          - 100ms
          - 500ms
          - 1s
          - 2s
          - 5s
          - 10s
    dimensions:
      - name: supportops.status
    metrics_flush_interval: 2s
exporters:
  file/traces:
    path: /out/traces.jsonl
  prometheus:
    endpoint: "0.0.0.0:8889"
service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces/in:
      receivers:
        - otlp
      exporters:
        - forward
        - span_metrics
    traces/sampled:
      receivers:
        - forward
      processors:
        - tail_sampling
      exporters:
        - file/traces
    metrics/red:
      receivers:
        - span_metrics
      exporters:
        - prometheus
