<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="500">
  <style>
    text { stroke: none !important; font-family: 'Segoe UI', system-ui, sans-serif; text-rendering: geometricPrecision; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
  </style>
  <rect width="1040" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect width="1040" height="70" rx="16" fill="#0f172a" />
  <rect y="48" width="1040" height="22" fill="#0f172a" />
  <text x="36" y="34" font-size="21" font-weight="700" fill="#ffffff">TEMPO 3 Y TRACEQL: ALMACENAMIENTO PARQUET Y CONSULTAS DE ÁRBOL</text>
  <text x="36" y="56" font-size="14" fill="#cbd5e1">Por qué las trazas tardan unos segundos en ser buscables y cómo preguntar relaciones padre-hijo con TraceQL</text>

  <!-- Top Section: Tempo 3 Path -->
  <rect x="26" y="88" width="988" height="176" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
  <text x="46" y="116" font-size="17" font-weight="700" fill="#1e3a8a">1. Camino de Ingesta y Consulta en Tempo 3 (Live Store → Bloques Parquet)</text>

  <rect x="46" y="132" width="270" height="112" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="62" y="156" font-size="15" font-weight="700" fill="#1d4ed8">① Live Store (En Memoria)</text>
  <text x="62" y="180" font-size="13" fill="#334155">Reúne spans que llegan desordenados.</text>
  <text x="62" y="200" font-size="13" font-weight="700" fill="#0f172a" class="mono">max_trace_idle: 10s</text>
  <text x="62" y="222" font-size="13" fill="#475569">Espera silencio antes de cerrar traza.</text>

  <path d="M 320 188 L 362 188" stroke="#2563eb" stroke-width="3" />
  <polygon points="362,182 374,188 362,194" fill="#2563eb" />

  <rect x="378" y="132" width="300" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="394" y="156" font-size="15" font-weight="700" fill="#15803d">② Bloques Parquet Columnar</text>
  <text x="394" y="180" font-size="13" fill="#334155">Cada atributo es una columna dedicada.</text>
  <text x="394" y="200" font-size="13" font-weight="700" fill="#14532d">Lo que no consultas, NO se lee de disco.</text>
  <text x="394" y="222" font-size="13" fill="#475569">+ Bloom filters para saltar bloques enteros.</text>

  <path d="M 682 188 L 724 188" stroke="#16a34a" stroke-width="3" />
  <polygon points="724,182 736,188 724,194" fill="#16a34a" />

  <rect x="740" y="132" width="254" height="112" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
  <text x="756" y="156" font-size="15" font-weight="700" fill="#6d28d9">③ Metrics-Generator</text>
  <text x="756" y="180" font-size="13" fill="#334155">Deriva métricas RED y grafo de</text>
  <text x="756" y="200" font-size="13" fill="#334155">servicios al vuelo y los escribe</text>
  <text x="756" y="222" font-size="13" font-weight="700" fill="#4c1d95">en Prometheus (remote_write).</text>

  <!-- Bottom Section: TraceQL Operators & Scopes -->
  <rect x="26" y="282" width="988" height="194" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2" />
  <text x="46" y="310" font-size="17" font-weight="700" fill="#0f172a">2. Ámbitos y Operadores Estructurales de TraceQL</text>

  <rect x="46" y="326" width="300" height="132" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <text x="62" y="350" font-size="14" font-weight="700" fill="#0f172a">Ámbitos (Evita colisiones de nombre)</text>
  <text x="62" y="376" font-size="13" fill="#1e3a8a" class="mono">resource.service.name = "supportops"</text>
  <text x="62" y="398" font-size="13" fill="#15803d" class="mono">span.gen_ai.tool.name = "get_order"</text>
  <text x="62" y="420" font-size="13" fill="#7c3aed" class="mono">status = error &amp;&amp; duration &gt; 3s</text>
  <text x="62" y="444" font-size="12" font-weight="600" fill="#dc2626">¡Usa siempre resource. o span. explícito!</text>

  <rect x="366" y="326" width="310" height="132" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <text x="382" y="350" font-size="14" font-weight="700" fill="#0f172a">Operadores de Árbol (Causalidad)</text>
  <text x="382" y="376" font-size="14" font-weight="700" fill="#2563eb" class="mono">{A} &gt;  {B}   → B es HIJO DIRECTO de A</text>
  <text x="382" y="400" font-size="14" font-weight="700" fill="#16a34a" class="mono">{A} &gt;&gt; {B}   → B es DESCENDIENTE de A</text>
  <text x="382" y="424" font-size="14" font-weight="700" fill="#d97706" class="mono">{A} ~  {B}   → A y B son HERMANOS</text>
  <text x="382" y="446" font-size="12" fill="#475569">Diferencia &amp;&amp; (mismo span) de &gt; (2 spans).</text>

  <rect x="696" y="326" width="298" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="712" y="350" font-size="14" font-weight="700" fill="#991b1b">Patrón Estrella de Guardia</text>
  <text x="712" y="374" font-size="12" font-weight="700" fill="#7f1d1d" class="mono">{ name="invoke_agent" &amp;&amp; status=ok }</text>
  <text x="712" y="394" font-size="12" font-weight="700" fill="#7f1d1d" class="mono">  &gt;&gt; { status=error }</text>
  <text x="712" y="420" font-size="13" fill="#991b1b">Encuentra fallos silenciosos: peticiones</text>
  <text x="712" y="440" font-size="13" fill="#991b1b">que respondieron OK con un hijo roto.</text>
</svg>
