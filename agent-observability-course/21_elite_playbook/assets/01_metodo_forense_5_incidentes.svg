<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
    <marker id="arr21" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">MASTERCLASS DE ÉLITE: EL BUCLE HIPÓTESIS → SEÑAL Y LOS 5 INCIDENTES (MÓDULO 21)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Depurar en producción no es adivinar ni leer logs al azar: es aplicar Change-Point Detection + Lift Ratio sobre los 4 pilares</text>

  <!-- Top Section: The 4-Step Scientific Triage Loop -->
  <rect x="20" y="90" width="1080" height="145" rx="12" fill="#0f172a"/>
  <text x="38" y="116" class="panel-title" style="fill:#38bdf8;">1. El Algoritmo Universal de Guardia (Diagnosticar cualquier incidente en &lt; 5 minutos)</text>

  <rect x="38" y="130" width="242" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="159" y="152" text-anchor="middle" class="card-title" style="fill:#38bdf8;">Paso 1 · Cuándo (<tspan class="mono">t₀</tspan>)</text>
  <text x="159" y="174" text-anchor="middle" class="body" style="fill:#e2e8f0;font-size:11.5px;">Métrica SLI / Burn Rate:</text>
  <text x="159" y="192" text-anchor="middle" class="mono" style="fill:#4ade80;font-size:11px;">detect_change_point(serie)</text>
  <text x="159" y="208" text-anchor="middle" class="body" style="fill:#94a3b8;font-size:11px;">Divide Antes (<tspan class="mono">t &lt; t₀</tspan>) vs Durante</text>

  <line x1="280" y1="175" x2="302" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr21)"/>

  <rect x="306" y="130" width="252" height="90" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="432" y="152" text-anchor="middle" class="card-title" style="fill:#c4b5fd;">Paso 2 · Qué distingue al fallo</text>
  <text x="432" y="174" text-anchor="middle" class="body" style="fill:#e2e8f0;font-size:11.5px;">Calcula el <tspan style="font-weight:700;fill:#fbbf24;">Lift Ratio</tspan> por atributo:</text>
  <text x="432" y="192" text-anchor="middle" class="mono" style="fill:#fbbf24;font-size:11px;">P(attr | malos) / P(attr | buenos)</text>
  <text x="432" y="208" text-anchor="middle" class="body" style="fill:#94a3b8;font-size:11px;">Aísla versión, modelo, tool o nodo</text>

  <line x1="558" y1="175" x2="580" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr21)"/>

  <rect x="584" y="130" width="242" height="90" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="705" y="152" text-anchor="middle" class="card-title" style="fill:#4ade80;">Paso 3 · Dónde (Exemplar)</text>
  <text x="705" y="174" text-anchor="middle" class="body" style="fill:#e2e8f0;font-size:11.5px;">Salta del pico a Tempo y compara</text>
  <text x="705" y="192" text-anchor="middle" class="mono" style="fill:#f8fafc;font-size:11px;">1 traza buena vs 1 traza mala</text>
  <text x="705" y="208" text-anchor="middle" class="body" style="fill:#94a3b8;font-size:11px;">Cruza con Logs (<tspan class="mono">trace_id</tspan>) y Perfil</text>

  <line x1="826" y1="175" x2="848" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr21)"/>

  <rect x="852" y="130" width="230" height="90" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="967" y="152" text-anchor="middle" class="card-title" style="fill:#f87171;">Paso 4 · Mitigar y Prevenir</text>
  <text x="967" y="174" text-anchor="middle" class="body" style="fill:#e2e8f0;font-size:11.5px;">1º Corta la hemorragia (Rollback)</text>
  <text x="967" y="192" text-anchor="middle" class="body" style="fill:#e2e8f0;font-size:11.5px;">2º Convierte la traza en Test</text>
  <text x="967" y="208" text-anchor="middle" class="body" style="fill:#94a3b8;font-size:11px;">3º Añade alerta o guarda</text>

  <!-- Bottom Section: Diagnostic Matrix of the 5 Classic Production Incidents -->
  <rect x="20" y="248" width="1080" height="362" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="274" class="panel-title">2. Matriz Forense de los 5 Incidentes Clásicos en Producción</text>

  <!-- Table Header -->
  <rect x="36" y="288" width="1048" height="32" rx="6" fill="#e2e8f0"/>
  <text x="50" y="309" class="card-title" style="font-size:12.5px;">Incidente</text>
  <text x="255" y="309" class="card-title" style="font-size:12.5px;">Síntoma (Lo que engaña)</text>
  <text x="530" y="309" class="card-title" style="font-size:12.5px;">Huella Inequívoca (TraceQL / PromQL / LogQL)</text>
  <text x="860" y="309" class="card-title" style="font-size:12.5px;">Mitigación en &lt; 5 min</text>

  <!-- Row 1: Retry Cascade -->
  <rect x="36" y="326" width="1048" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="50" y="348" class="card-title" style="fill:#991b1b;font-size:13px;">1. Cascada Reintentos</text>
  <text x="50" y="366" class="mono" style="font-size:11px;fill:#b91c1c;">Multi-agente (Mód 11)</text>
  <text x="255" y="348" class="body" style="font-size:12px;">Latencia p99 ×4 y gasto ×6;</text>
  <text x="255" y="366" class="body" style="font-size:12px;">parece pico de tráfico externo.</text>
  <text x="530" y="348" class="mono" style="font-size:11.5px;fill:#7f1d1d;">count(spans chat) / count(invoke_agent) &gt; 6</text>
  <text x="530" y="366" class="body" style="font-size:11.5px;">Spans hijos siguen vivos tras el timeout del padre (zombis).</text>
  <text x="860" y="348" class="body" style="font-size:12px;font-weight:700;">Desactivar retries en el</text>
  <text x="860" y="366" class="body" style="font-size:12px;">orquestador + propagar deadline.</text>

  <!-- Row 2: Tool Loop -->
  <rect x="36" y="382" width="1048" height="50" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="50" y="404" class="card-title" style="fill:#92400e;font-size:13px;">2. Bucle Herramientas</text>
  <text x="50" y="422" class="mono" style="font-size:11px;fill:#b45309;">FinOps / MCP (Mód 12-13)</text>
  <text x="255" y="404" class="body" style="font-size:12px;">Burn rate mensual se dispara;</text>
  <text x="255" y="422" class="body" style="font-size:12px;">RPS de usuarios es constante.</text>
  <text x="530" y="404" class="mono" style="font-size:11.5px;fill:#78350f;">status="max_steps" + mismo (tool, args_hash) ≥ 3</text>
  <text x="530" y="422" class="body" style="font-size:11.5px;">Lift alto en una herramienta que devuelve respuesta vacía/ambigua.</text>
  <text x="860" y="404" class="body" style="font-size:12px;font-weight:700;">Activar corta-circuitos</text>
  <text x="860" y="422" class="body" style="font-size:12px;">por <tspan class="mono">args_hash</tspan> repetido.</text>

  <!-- Row 3: Silent Regression -->
  <rect x="36" y="438" width="1048" height="50" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="50" y="460" class="card-title" style="fill:#5b21b6;font-size:13px;">3. Regresión Silenciosa</text>
  <text x="50" y="478" class="mono" style="font-size:11px;fill:#6d28d9;">Calidad / Prompt (Mód 14-15)</text>
  <text x="255" y="460" class="body" style="font-size:12px;">¡Latencia y coste mejoran!</text>
  <text x="255" y="478" class="body" style="font-size:12px;">HTTP 200 OK = 100%.</text>
  <text x="530" y="460" class="mono" style="font-size:11.5px;fill:#4c1d95;">Lift en service.version="v2" + caída en tool_calls</text>
  <text x="530" y="478" class="body" style="font-size:11.5px;">Alarma CUSUM en <tspan class="mono">groundedness_score</tspan> y subida de thumbs-down.</text>
  <text x="860" y="460" class="body" style="font-size:12px;font-weight:700;">Rollback inmediato del</text>
  <text x="860" y="478" class="body" style="font-size:12px;">canario <tspan class="mono">v2 → v1</tspan> + test replay.</text>

  <!-- Row 4: Cardinality Storm -->
  <rect x="36" y="494" width="1048" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="50" y="516" class="card-title" style="fill:#1e40af;font-size:13px;">4. Tormenta Cardinalidad</text>
  <text x="50" y="534" class="mono" style="font-size:11px;fill:#1d4ed8;">Prometheus (Mód 09, 18)</text>
  <text x="255" y="516" class="body" style="font-size:12px;">Prometheus OOM y paneles</text>
  <text x="255" y="534" class="body" style="font-size:12px;">de Grafana dan timeout.</text>
  <text x="530" y="516" class="mono" style="font-size:11.5px;fill:#1e3a8a;">topk(5, count by (__name__)({__name__=~".+"}))</text>
  <text x="530" y="534" class="body" style="font-size:11.5px;">Alguien metió <tspan class="mono">ticket_id</tspan> o <tspan class="mono">user_id</tspan> como label de métrica.</text>
  <text x="860" y="516" class="body" style="font-size:12px;font-weight:700;">Drop label con View SDK</text>
  <text x="860" y="534" class="body" style="font-size:12px;">o <tspan class="mono">metric_relabel_configs</tspan>.</text>

  <!-- Row 5: Broken Context / Orphan Traces -->
  <rect x="36" y="550" width="1048" height="50" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="50" y="572" class="card-title" style="fill:#065f46;font-size:13px;">5. Trazas Partidas</text>
  <text x="50" y="590" class="mono" style="font-size:11px;fill:#047857;">Contexto / K8s (Mód 03, 19)</text>
  <text x="255" y="572" class="body" style="font-size:12px;">Spans de herramientas sueltos</text>
  <text x="255" y="590" class="body" style="font-size:12px;">como raíces de 1 solo nodo.</text>
  <text x="530" y="572" class="mono" style="font-size:11.5px;fill:#064e3b;">Spans execute_tool con parent_span_id == null</text>
  <text x="530" y="590" class="body" style="font-size:11.5px;">Hilo <tspan class="mono">ThreadPoolExecutor</tspan> sin <tspan class="mono">copy_context()</tspan> o MCP sin <tspan class="mono">_meta</tspan>.</text>
  <text x="860" y="572" class="body" style="font-size:12px;font-weight:700;">Envolver worker con</text>
  <text x="860" y="590" class="body" style="font-size:12px;"><tspan class="mono">copy_context().run(fn)</tspan>.</text>
</svg>