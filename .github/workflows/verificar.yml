# Verificación del curso de LangGraph.
#
# Tres etapas, de más barata a más cara. La cuarta —la comprobación previa al despliegue
# del notebook 28— no está aquí: necesita mirar la base de datos de producción y vive en
# el pipeline de despliegue, no en el de un pull request.

name: Verificar el curso

on:
  push:
    paths: ["langgraph/**", ".github/workflows/verificar.yml"]
  pull_request:
    paths: ["langgraph/**", ".github/workflows/verificar.yml"]

defaults:
  run:
    working-directory: langgraph

jobs:
  estatico:
    name: 1 · Estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: langgraph/uv.lock

      # --frozen falla si uv.lock no cuadra con pyproject.toml, en vez de resolver
      # por su cuenta. Un lock desactualizado se detecta aquí, no en producción.
      - run: uv sync --frozen --all-groups

      - name: requirements.txt al día con uv.lock
        run: uv run _tools/exportar_requisitos.py --check

      - name: Los notebooks compilan y sus importaciones existen
        run: uv run _tools/validar.py

      - name: langgraph.json es válido
        run: uv run langgraph validate
        working-directory: langgraph/despliegue

  pruebas:
    name: 2 · Pruebas
    runs-on: ubuntu-latest
    needs: estatico
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: langgraph/uv.lock
      - run: uv sync --frozen --all-groups

      # Sin clave de API: estas pruebas no llaman a ningún modelo. Una CI que gasta
      # cuota se acaba desactivando.
      - run: uv run pytest

  notebooks:
    name: 3 · Los notebooks se ejecutan
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: langgraph/uv.lock
      - run: uv sync --frozen --all-groups

      - name: Ejecutar todos los notebooks con un modelo falso
        run: uv run _tools/ejecutar_notebooks.py
