<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 16 · SERVING</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">RECOMENDADORES EN PRODUCCIÓN: FEATURE STORE DUAL, SLA p99 Y FALLBACKS</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">Paridad Offline/Online sin Training-Serving Skew, presupuesto de latencia p99 < 60 ms y degradación elegante en cascada</text>


  <!-- Left Panel: Dual Feature Store & Point-in-Time Parity -->
  <rect x="24" y="108" width="604" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="568" height="32" rx="8" fill="#eff6ff"/>
  <text x="326" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">1. Feature Store Dual: Paridad Offline (Parquet) ↔ Online (Redis)</text>

  <!-- Feature Store Diagram -->
  <rect x="44" y="172" width="564" height="248" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="326" y="196" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">Una Sola Definición de Transformación → Dos Almacenes Sincronizados</text>

  <!-- Offline Store -->
  <rect x="62" y="212" width="252" height="134" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="188" y="234" text-anchor="middle" fill="#1e40af" font-size="12.5" font-weight="800">OFFLINE STORE (Parquet / Iceberg)</text>
  <text x="76" y="256" fill="#334155" font-size="11.5">• Guarda toda la serie histórica (u, t, val)</text>
  <text x="76" y="276" fill="#334155" font-size="11.5">• <tspan font-weight="700" fill="#2563eb">AS-OF Join (merge_asof):</tspan></text>
  <text x="76" y="294" fill="#475569" font-size="11">  Para cada impresión en t_impr, busca el</text>
  <text x="76" y="310" fill="#475569" font-size="11">  último valor con t_feat ≤ t_impr.</text>
  <text x="76" y="330" fill="#1d4ed8" font-size="11" font-weight="700">Usado por: Entrenamiento y Backtesting</text>

  <!-- Online Store -->
  <rect x="336" y="212" width="254" height="134" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="463" y="234" text-anchor="middle" fill="#065f46" font-size="12.5" font-weight="800">ONLINE STORE (Redis / DynamoDB)</text>
  <text x="350" y="256" fill="#334155" font-size="11.5">• Guarda SOLO el último snapshot por ID</text>
  <text x="350" y="276" fill="#334155" font-size="11.5">• <tspan font-weight="700" fill="#059669">Lectura Batch MGET / Pipeline:</tspan></text>
  <text x="350" y="294" fill="#475569" font-size="11">  Hidrata 1 usuario + 200 candidatos en</text>
  <text x="350" y="310" fill="#475569" font-size="11">  una sola llamada de red (&lt; 3 ms p99).</text>
  <text x="350" y="330" fill="#047857" font-size="11" font-weight="700">Usado por: Microservicio en Tiempo Real</text>

  <rect x="62" y="358" width="528" height="48" rx="6" fill="#0f172a"/>
  <text x="326" y="380" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">Patrón Anti-Skew Definitivo: «Log-and-Wait» (Guardar las features servidas)</text>
  <text x="326" y="396" text-anchor="middle" fill="#cbd5e1" font-size="11">El servidor escribe el vector exacto x_t que vio el modelo junto al impression_id; al llegar el clic, entrenas con él.</text>

  <!-- Feature Freshness Tiers -->
  <rect x="44" y="434" width="564" height="196" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="62" y="458" fill="#9a3412" font-size="13.5" font-weight="800">Las 3 Velocidades de Features en un Recomendador:</text>
  <text x="62" y="482" fill="#334155" font-size="11.5">1. <tspan font-weight="700" fill="#64748b">Batch Diario (T+24h):</tspan> Embeddings base Two-Tower/EASE, género histórico del usuario.</text>
  <text x="62" y="506" fill="#334155" font-size="11.5">2. <tspan font-weight="700" fill="#2563eb">Nearline / Streaming (Segundos — Kafka/Flink → Redis):</tspan> Últimas 10 películas vistas</text>
  <text x="76" y="524" fill="#475569" font-size="11.5">en la sesión actual, CTR reciente de un estreno en las últimas 2 horas, lista de vistos hoy.</text>
  <text x="62" y="548" fill="#334155" font-size="11.5">3. <tspan font-weight="700" fill="#059669">On-Request (0 ms — Viaja en el Payload HTTP):</tspan> Hora del día, dispositivo (SmartTV vs</text>
  <text x="76" y="566" fill="#475569" font-size="11.5">móvil), idioma, velocidad de red y película ancla si está en una página de detalle.</text>
  <text x="62" y="596" fill="#c2410c" font-size="11.5" font-weight="700">• ¡Nunca hagas N=200 llamadas secuenciales a Redis! Usa siempre un único MGET vectorizado.</text>

  <!-- Right Panel: Latency Budget p99 & Graceful Degradation Cascade -->
  <rect x="644" y="108" width="612" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="662" y="126" width="576" height="32" rx="8" fill="#ecfdf5"/>
  <text x="950" y="147" text-anchor="middle" fill="#047857" font-size="14.5" font-weight="800">2. Presupuesto de Latencia p99 (&lt; 60 ms) y Cascada de Fallbacks (Proyecto 16)</text>

  <!-- Waterfall Latency Budget -->
  <rect x="662" y="172" width="576" height="222" rx="10" fill="#0f172a"/>
  <text x="682" y="196" fill="#38bdf8" font-size="13" font-weight="700">Desglose de Latencia p99 de una Petición GET /recommend/{user_id}:</text>

  <rect x="682" y="210" width="90" height="22" rx="4" fill="#38bdf8"/><text x="782" y="225" fill="#e2e8f0" font-size="11.5" class="mono">1. User Features + Seen List (Redis)     :  4 ms</text>
  <rect x="682" y="238" width="160" height="22" rx="4" fill="#8b5cf6"/><text x="852" y="253" fill="#e2e8f0" font-size="11.5" class="mono">2. Multi-Retrieval (FAISS + EASE + Pop)  : 12 ms (en paralelo)</text>
  <rect x="682" y="266" width="120" height="22" rx="4" fill="#f59e0b"/><text x="812" y="281" fill="#e2e8f0" font-size="11.5" class="mono">3. Candidate Feature Hydration + Crosses :  8 ms</text>
  <rect x="682" y="294" width="220" height="22" rx="4" fill="#10b981"/><text x="912" y="309" fill="#e2e8f0" font-size="11.5" class="mono">4. Heavy Ranker Inference (LightGBM/ONNX): 20 ms (batch 200)</text>
  <rect x="682" y="322" width="80" height="22" rx="4" fill="#ec4899"/><text x="772" y="337" fill="#e2e8f0" font-size="11.5" class="mono">5. Filter Seen + MMR Diversity + JSON    :  5 ms</text>
  <line x1="682" y1="354" x2="1218" y2="354" stroke="#334155" stroke-width="1"/>
  <text x="682" y="376" fill="#34d399" font-size="12.5" font-weight="700">Total p99 = 49 ms  (Cumple SLA &lt; 60 ms con margen de seguridad)</text>

  <!-- 3-Tier Fallback / Circuit Breaker Cascade -->
  <rect x="662" y="408" width="576" height="222" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="682" y="432" fill="#991b1b" font-size="13.5" font-weight="800">Arquitectura Resiliente: Un Recomendador NUNCA Devuelve HTTP 500</text>
  <text x="682" y="454" fill="#475569" font-size="11.5">Si una etapa supera su timeout o un servicio externo cae, degrada limpiamente al siguiente nivel:</text>

  <rect x="682" y="468" width="536" height="44" rx="6" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/>
  <text x="698" y="488" fill="#854d0e" font-size="12" font-weight="800">Nivel 1 (Falla el Ranker Pesado o Timeout &gt; 35 ms):</text>
  <text x="698" y="504" fill="#475569" font-size="11.5">Sirve directamente el orden de scores del Retriever (Two-Tower / EASE) filtrado por no-vistos.</text>

  <rect x="682" y="520" width="536" height="44" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="698" y="540" fill="#9a3412" font-size="12" font-weight="800">Nivel 2 (Usuario Cold-Start o Timeout en FAISS):</text>
  <text x="698" y="556" fill="#475569" font-size="11.5">Sirve la lista pre-calculada del segmento demográfico / género favorito o última caché del usuario.</text>

  <rect x="682" y="572" width="536" height="44" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="698" y="592" fill="#991b1b" font-size="12" font-weight="800">Nivel 3 (Caída Total de Redis / Red):</text>
  <text x="698" y="608" fill="#475569" font-size="11.5">Sirve el Top-50 de Media Bayesiana / Trending en RAM local del proceso (0 ms de red).</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">En el Proyecto 16 medirás cómo la degradación controlada mantiene disponibilidad del 100% ante fallos inyectados en el ranker.</text>
</svg>
