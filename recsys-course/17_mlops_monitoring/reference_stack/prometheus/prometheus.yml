global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]
scrape_configs:
  - job_name: pushgateway          # métricas de drift empujadas por el flow de CT
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
  - job_name: cinematch-api        # servicio del módulo 16 (si corre en la misma red)
    metrics_path: /metrics/
    static_configs: [{targets: ["api:8000"]}]
