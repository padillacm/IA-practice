<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 09 · ANIMACIÓN</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">RECOMENDACIÓN SECUENCIAL: CADENAS DE MARKOV, SASREC Y gSASREC</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">Por qué el orden cronológico importa: Atención Causal (SASRec) vs Enmascarado Bidireccional (BERT4Rec) y gSASRec</text>


  <!-- Left Panel: Animated SASRec Causal Self-Attention -->
  <rect x="24" y="108" width="620" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="584" height="32" rx="8" fill="#eff6ff"/>
  <text x="334" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">1. Animación 60 FPS: SASRec y la Máscara Causal Triangular (Kang &amp; McAuley)</text>

  <!-- Sequence inputs -->
  <text x="46" y="182" fill="#0f172a" font-size="12.5" font-weight="700">Secuencia Cronológica del Usuario (Long-term + Intención de Sesión Actual):</text>

  <!-- 4 sequence item boxes -->
  <rect x="48" y="388" width="124" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="412" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">t=1: Matrix</text>
  <text x="110" y="432" text-anchor="middle" fill="#475569" font-size="11" class="mono">e_{i1} + P_1</text>

  <rect x="192" y="388" width="124" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="254" y="412" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">t=2: Inception</text>
  <text x="254" y="432" text-anchor="middle" fill="#475569" font-size="11" class="mono">e_{i2} + P_2</text>

  <rect x="336" y="388" width="124" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="398" y="412" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="700">t=3: Toy Story 1</text>
  <text x="398" y="432" text-anchor="middle" fill="#2563eb" font-size="11" class="mono">e_{i3} + P_3</text>

  <rect x="480" y="388" width="136" height="58" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
  <text x="548" y="412" text-anchor="middle" fill="#065f46" font-size="12" font-weight="800">t=4: Toy Story 2</text>
  <text x="548" y="432" text-anchor="middle" fill="#047857" font-size="11" class="mono">e_{i4} + P_4 (Hoy)</text>

  <!-- Animated Causal Attention Arcs converging on t=4 -->
  <path d="M 110 388 Q 320 310 532 284" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 254 388 Q 390 320 538 284" fill="none" stroke="#64748b" stroke-width="2.2" class="flow-line"/>
  <path d="M 398 388 Q 470 330 544 284" fill="none" stroke="#2563eb" stroke-width="3.2" class="flow-fast" marker-end="url(#arrowBlue)"/>
  <line x1="548" y1="388" x2="548" y2="284" stroke="#059669" stroke-width="4" class="flow-fast" marker-end="url(#arrowGreen)"/>

  <text x="275" y="328" fill="#475569" font-size="11" font-weight="600">α_{4,1}=0.05</text>
  <text x="355" y="346" fill="#334155" font-size="11" font-weight="600">α_{4,2}=0.08</text>
  <text x="432" y="352" fill="#1d4ed8" font-size="11.5" font-weight="800">α_{4,3}=0.37</text>
  <text x="558" y="346" fill="#059669" font-size="11.5" font-weight="800">α_{4,4}=0.50</text>

  <!-- Transformer Causal Block & Output -->
  <rect x="448" y="200" width="176" height="82" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="536" y="224" text-anchor="middle" fill="#34d399" font-size="12" font-weight="800">Estado Oculto h_4</text>
  <text x="536" y="244" text-anchor="middle" fill="#e2e8f0" font-size="11" class="mono">s(u, j) = h_4^T · e_j</text>
  <text x="536" y="266" text-anchor="middle" fill="#fbbf24" font-size="11.5" font-weight="700">Predice → Toy Story 3 ★</text>

  <!-- Causal Mask Matrix Visual -->
  <rect x="48" y="196" width="376" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="64" y="218" fill="#0f172a" font-size="12" font-weight="800">Máscara Causal Triangular Inferior (M_{t,k} = -∞ si k &gt; t):</text>
  <text x="64" y="240" fill="#334155" font-size="11.5" class="mono">Paso t=2 solo ve {t1, t2} | Paso t=4 ve {t1, t2, t3, t4}</text>
  <text x="64" y="260" fill="#dc2626" font-size="11.5" font-weight="700">¡Sin máscara causal, el paso t mira la respuesta t+1</text>
  <text x="64" y="278" fill="#dc2626" font-size="11.5" font-weight="700">y aprende la función identidad con pérdida 0 (Leakage)!</text>
  <text x="64" y="296" fill="#1d4ed8" font-size="11" font-weight="700">Cuidado también con enmascarar los tokens de PADDING (id=0).</text>

  <!-- Left Padding vs Right Padding warning -->
  <rect x="48" y="464" width="576" height="166" rx="10" fill="#0f172a"/>
  <text x="68" y="488" fill="#38bdf8" font-size="13" font-weight="700">Detalle de Implementación Crítico en PyTorch (Proyecto 09):</text>
  <text x="68" y="512" fill="#34d399" font-size="12" class="mono">✓ Left-Padding : [ 0,   0,  i_1, i_2, i_3 ]  →  h[-1] SIEMPRE es el último ítem real</text>
  <text x="68" y="534" fill="#f87171" font-size="12" class="mono">✗ Right-Padding: [i_1, i_2, i_3,   0,   0 ]  →  h[-1] lee un token vacío de padding</text>
  <line x1="68" y1="548" x2="604" y2="548" stroke="#334155" stroke-width="1"/>
  <text x="68" y="570" fill="#e2e8f0" font-size="11.5">• <tspan font-weight="700" fill="#fbbf24">Weight Tying:</tspan> compartir la matriz de embeddings de entrada E con la matriz de salida</text>
  <text x="68" y="588" fill="#cbd5e1" font-size="11.5">  reduce parámetros a la mitad y estabiliza los ítems de la Long-Tail.</text>
  <text x="68" y="610" fill="#a78bfa" font-size="11.5">• <tspan font-weight="700">Dropout + LayerNorm (Pre-LN):</tspan> esencial porque MovieLens tiene secuencias cortas.</text>

  <!-- Right Panel: Markov vs SASRec vs BERT4Rec vs gSASRec -->
  <rect x="660" y="108" width="596" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="678" y="126" width="560" height="32" rx="8" fill="#f5f3ff"/>
  <text x="958" y="147" text-anchor="middle" fill="#6d28d9" font-size="14.5" font-weight="800">2. Evolución: Markov → SASRec → BERT4Rec → gSASRec (RecSys'23)</text>

  <!-- Markov Chain -->
  <rect x="678" y="172" width="560" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="696" y="194" fill="#0f172a" font-size="13" font-weight="800">A. Cadenas de Markov de Orden 1 y FPMC (Baseline Secuencial)</text>
  <text x="696" y="216" fill="#2563eb" font-size="12" class="mono">P(i_t = j | i_{t-1} = i) = (count(i → j) + α) / (count(i → *) + α·|I|)</text>
  <text x="696" y="238" fill="#475569" font-size="11.5">• Captura secuelas inmediatas (Toy Story 1 → Toy Story 2) con 0 parámetros entrenables.</text>
  <text x="696" y="258" fill="#dc2626" font-size="11.5">• Olvida todo lo ocurrido en t-2, t-3... y no generaliza entre ítems sin transición directa.</text>

  <!-- BERT4Rec -->
  <rect x="678" y="292" width="560" height="142" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="696" y="314" fill="#9a3412" font-size="13" font-weight="800">B. BERT4Rec (Sun et al., CIKM 2019): Tarea Cloze con [MASK] Bidireccional</text>
  <text x="696" y="336" fill="#475569" font-size="11.5">• En entrenamiento enmascara al azar el 20% de la secuencia: <tspan class="mono">[i_1, [MASK], i_3, i_4]</tspan></text>
  <text x="696" y="354" fill="#475569" font-size="11.5">  usando contexto izquierdo Y derecho con pérdida Softmax completa.</text>
  <text x="696" y="376" fill="#c2410c" font-size="11.5" font-weight="700">• Discrepancia Train–Test:</text>
  <text x="696" y="394" fill="#475569" font-size="11.5">  En producción nunca tienes eventos del futuro a la derecha; siempre añades <tspan class="mono">[MASK]</tspan></text>
  <text x="696" y="412" fill="#475569" font-size="11.5">  al final de la secuencia <tspan class="mono">[i_1, i_2, i_3, i_4, [MASK]]</tspan>.</text>

  <!-- gSASRec -->
  <rect x="678" y="448" width="560" height="182" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="696" y="472" fill="#065f46" font-size="13.5" font-weight="800">C. El Hallazgo de gSASRec (Petrov &amp; Macdonald, Best Paper RecSys 2023) ★</text>
  <text x="696" y="494" fill="#047857" font-size="11.5">¿Por qué BERT4Rec parecía superar a SASRec? ¡No era por ser bidireccional!</text>
  <text x="696" y="514" fill="#065f46" font-size="11.5">• El SASRec original entrenaba con <tspan font-weight="700">BCE y solo 1 negativo por paso</tspan> (sub-muestreo extremo).</text>
  <text x="696" y="534" fill="#065f46" font-size="11.5">• Al poner <tspan font-weight="700">K = 128–256 negativos por paso</tspan> + <tspan font-weight="700">gBCE (Generalized BCE con calibración β)</tspan>:</text>
  <rect x="696" y="546" width="524" height="36" rx="6" fill="#0f172a"/>
  <text x="958" y="569" text-anchor="middle" fill="#34d399" font-size="12" class="mono">L_gSASRec: causal unidireccional + K negativos + corrección de sobreconfianza β</text>
  <text x="696" y="602" fill="#059669" font-size="12" font-weight="700">★ gSASRec supera a BERT4Rec en NDCG entrenando en una fracción del tiempo.</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">Lección de Élite (Módulo 09): La función de pérdida y el número de negativos importan más que cambiar la arquitectura de causal a bidireccional.</text>
</svg>
