<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 05 · ANIMACIÓN</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">FACTORIZACIÓN MATRICIAL: ESPACIO LATENTE, iALS Y BPR (PAIRWISE)</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">De FunkSVD/SVD++ a iALS (Hu-Koren-Volinsky) y geometría animada de gradientes por tripletas en BPR</text>


  <!-- Left Panel: Explicit SVD++ vs Implicit iALS -->
  <rect x="24" y="108" width="606" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="570" height="32" rx="8" fill="#eff6ff"/>
  <text x="327" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">1. De Ratings Explícitos (SVD++) a iALS Implícito (O(K³))</text>

  <!-- FunkSVD + Biases -->
  <rect x="44" y="172" width="566" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="194" fill="#0f172a" font-size="13" font-weight="800">A. Factorización con Sesgos + SVD++ (Koren, Netflix Prize 2009)</text>
  <rect x="62" y="204" width="530" height="34" rx="6" fill="#0f172a"/>
  <text x="327" y="226" text-anchor="middle" fill="#38bdf8" font-size="12" class="mono">r̂_{ui} = μ + b_u + b_i + q_i^T · ( p_u + |I_u|^{-1/2} Σ_{j ∈ I_u} y_j )</text>
  <text x="62" y="258" fill="#475569" font-size="11.5">• <tspan font-weight="700">b_u, b_i</tspan> absorben usuarios gruñones y blockbusters (dejan a p_u^T q_i la afinidad pura).</text>
  <text x="62" y="276" fill="#475569" font-size="11.5">• <tspan font-weight="700">SVD++:</tspan> el mero hecho de elegir qué película puntuar (I_u) ya revela tu gusto implícito.</text>

  <!-- iALS -->
  <rect x="44" y="300" width="566" height="202" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="62" y="324" fill="#065f46" font-size="13.5" font-weight="800">B. iALS (Hu, Koren &amp; Volinsky, ICDM 2008): El Truco Algebraico</text>
  <text x="62" y="346" fill="#047857" font-size="11.5">En implícito ponderamos TODOS los pares U × I con preferencia p_{ui} ∈ {0,1} y confianza c_{ui}:</text>
  <rect x="62" y="356" width="530" height="36" rx="6" fill="#0f172a"/>
  <text x="327" y="379" text-anchor="middle" fill="#34d399" font-size="12" class="mono">L = Σ_{u,i} c_{ui} (p_{ui} - p_u^T q_i)^2 + λ (||P||_F^2 + ||Q||_F^2),   c_{ui} = 1 + α·r_{ui}</text>
  <text x="62" y="412" fill="#065f46" font-size="11.5" font-weight="700">¿Cómo evitar iterar sobre los 99.8% de ceros (coste O(|U|·|I|))?</text>
  <rect x="62" y="422" width="530" height="36" rx="6" fill="#064e3b"/>
  <text x="327" y="445" text-anchor="middle" fill="#a7f3d0" font-size="12" class="mono">Q^T C^u Q = (Q^T Q) + Q^T (C^u - I) Q   ← ¡(C^u - I) solo tiene n_u no-ceros!</text>
  <text x="62" y="476" fill="#047857" font-size="11.5">• Pre-calculas <tspan class="mono" font-weight="700">G_Q = Q^T Q</tspan> (dimensión K×K) una sola vez por época.</text>
  <text x="62" y="494" fill="#047857" font-size="11.5">• Cada usuario se resuelve de forma exacta e independiente en paralelo en GPU.</text>

  <!-- iALS vs BPR summary -->
  <rect x="44" y="514" width="566" height="116" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="62" y="536" fill="#1e40af" font-size="13" font-weight="800">¿Cuándo usar iALS vs BPR (Proyecto 05)?</text>
  <text x="62" y="558" fill="#334155" font-size="11.5">• <tspan font-weight="700" fill="#059669">iALS (Pointwise implícito ponderado):</tspan> Entrena en pocos segundos sin ajustar</text>
  <text x="62" y="576" fill="#334155" font-size="11.5">  learning rate ni muestreo negativo; produce embeddings muy bien calibrados.</text>
  <text x="62" y="596" fill="#334155" font-size="11.5">• <tspan font-weight="700" fill="#7c3aed">BPR (Pairwise ranking):</tspan> Optimiza directamente el área bajo la curva ROC (AUC)</text>
  <text x="62" y="614" fill="#334155" font-size="11.5">  por usuario y permite enchufar cualquier arquitectura neuronal con SGD.</text>

  <!-- Right Panel: Animated BPR Latent Space -->
  <rect x="646" y="108" width="610" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="664" y="126" width="574" height="32" rx="8" fill="#f5f3ff"/>
  <text x="951" y="147" text-anchor="middle" fill="#6d28d9" font-size="14.5" font-weight="800">2. Animación 60 FPS: Geometría Pairwise de BPR (Rendle et al., 2009)</text>

  <!-- Formula box -->
  <rect x="664" y="170" width="574" height="44" rx="8" fill="#0f172a"/>
  <text x="951" y="197" text-anchor="middle" fill="#a78bfa" font-size="12.5" class="mono">L_BPR = - Σ_{(u, i+, j-)} ln σ( x̂_{ui+} - x̂_{uj-} ) + λ ||Θ||^2</text>

  <!-- 2D Latent Plane Canvas -->
  <rect x="664" y="226" width="574" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Grid axes -->
  <line x1="690" y1="366" x2="1210" y2="366" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="950" y1="242" x2="950" y2="492" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="1198" y="358" text-anchor="end" fill="#64748b" font-size="11" font-weight="700">Eje Latente 1 (Acción ↔ Drama)</text>
  <text x="960" y="256" fill="#64748b" font-size="11" font-weight="700">Eje Latente 2 (Mainstream ↔ Indie)</text>

  <!-- User Anchor Node -->
  <circle cx="830" cy="390" r="56" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="830" cy="390" r="24" fill="#2563eb" filter="url(#shadow)"/>
  <text x="830" y="395" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">p_u</text>
  <text x="830" y="432" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="700">Usuario u (Ancla)</text>

  <!-- Positive Item i+ being pulled closer -->
  <g class="pull-anim">
    <line x1="990" y1="296" x2="862" y2="372" stroke="#059669" stroke-width="3" class="flow-fast" marker-end="url(#arrowGreen)"/>
    <circle cx="998" cy="290" r="24" fill="#10b981" filter="url(#shadow)"/>
    <text x="998" y="295" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">q_{i+}</text>
    <rect x="1030" y="266" width="184" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="1122" y="285" text-anchor="middle" fill="#065f46" font-size="11.5" font-weight="700">Ítem Positivo (Visto)</text>
    <text x="1122" y="302" text-anchor="middle" fill="#047857" font-size="11" class="mono">Δq_{i+} = +η (1-σ(Δ)) p_u</text>
  </g>

  <!-- Negative Item j- being pushed away -->
  <g class="push-anim">
    <line x1="854" y1="402" x2="1038" y2="458" stroke="#dc2626" stroke-width="3" class="flow-fast" marker-end="url(#arrowRed)"/>
    <circle cx="1052" cy="462" r="24" fill="#ef4444" filter="url(#shadow)"/>
    <text x="1052" y="467" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">q_{j-}</text>
    <rect x="1084" y="438" width="142" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="1155" y="457" text-anchor="middle" fill="#991b1b" font-size="11.5" font-weight="700">Negativo j- (No visto)</text>
    <text x="1155" y="474" text-anchor="middle" fill="#b91c1c" font-size="11" class="mono">Δq_{j-} = -η (1-σ(Δ)) p_u</text>
  </g>

  <!-- Bottom explanation of Negative Sampling in BPR -->
  <rect x="664" y="518" width="574" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="682" y="540" fill="#9a3412" font-size="13" font-weight="800">El Secreto del Éxito en BPR: Cómo Muestrear el Negativo j- (Proyecto 05)</text>
  <text x="682" y="562" fill="#475569" font-size="11.5">• <tspan font-weight="700">Muestreo Uniforme:</tspan> 90% de los j- son películas oscuras de la cola → gradiente (1 - σ(Δ)) ≈ 0</text>
  <text x="682" y="580" fill="#475569" font-size="11.5">  tras pocas épocas (el modelo aprende rápido a separar éxitos de desconocidas, pero no afina).</text>
  <text x="682" y="600" fill="#c2410c" font-size="11.5" font-weight="700">• Muestreo Mixto / Popularidad Suavizada p(j) ∝ count(j)^{0.75}:</text>
  <text x="682" y="618" fill="#475569" font-size="11.5">  Presenta negativos competitivos y despolariza al recomendador frente al sesgo de popularidad.</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">En BPR el escalar (1 - σ(x̂_{ui+} - x̂_{uj-})) actúa como peso adaptativo: si el par ya está bien ordenado (Δ ≫ 0), el gradiente se apaga solo.</text>
</svg>
