<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 10 · GRAFOS</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">RECOMENDACIÓN BASADA EN GRAFOS: BIPARTITO, LIGHTGCN, PINSAGE Y PPR</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">Por qué quitar pesos W y no-linealidades en LightGCN (SIGIR 2020) mejora la señal colaborativa de alto orden</text>


  <!-- Left Panel: Bipartite Multi-Hop & LightGCN -->
  <rect x="24" y="108" width="612" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="576" height="32" rx="8" fill="#eff6ff"/>
  <text x="330" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">1. Del Grafo Bipartito a LightGCN (He et al., SIGIR 2020 — Proyecto 10)</text>

  <!-- Bipartite Hop Explanation -->
  <rect x="44" y="172" width="572" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="194" fill="#0f172a" font-size="13" font-weight="800">¿Qué Captura Cada Salto (Hop k) en el Grafo Bipartito Usuario–Ítem?</text>
  <text x="62" y="218" fill="#2563eb" font-size="11.5" class="mono">k = 1: u_1 ──► i_A                        (Historial directo del usuario u_1)</text>
  <text x="62" y="238" fill="#7c3aed" font-size="11.5" class="mono">k = 2: u_1 ──► i_A ──► u_2                (Usuarios con gustos gemelos a u_1)</text>
  <text x="62" y="258" fill="#059669" font-size="11.5" font-weight="700" class="mono">k = 3: u_1 ──► i_A ──► u_2 ──► i_B ★     (Películas vistas por tus gemelos)</text>
  <text x="62" y="284" fill="#475569" font-size="11.5">En MF clásica (Módulo 05) solo existe k=1 en la arquitectura; en GNN propagamos explícitamente.</text>

  <!-- LightGCN Equations -->
  <rect x="44" y="314" width="572" height="196" rx="10" fill="#0f172a"/>
  <text x="64" y="338" fill="#38bdf8" font-size="13" font-weight="700">Las 2 Ecuaciones de LightGCN (Cero Matrices W_k, Cero ReLU):</text>
  <rect x="64" y="350" width="532" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="330" y="375" text-anchor="middle" fill="#34d399" font-size="12.5" class="mono">1. Paso de Mensajes:  E^{(k+1)} = ( D^{-1/2} A D^{-1/2} ) · E^{(k)}</text>
  <rect x="64" y="400" width="532" height="40" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="330" y="425" text-anchor="middle" fill="#a78bfa" font-size="12.5" class="mono">2. Readout Multicapa: E_{final} = Σ_{k=0..K} α_k · E^{(k)},   con α_k = 1/(K+1)</text>
  <text x="64" y="462" fill="#e2e8f0" font-size="11.5">• <tspan font-weight="700" fill="#fbbf24">¿Por qué quitar W_k y ReLU (vs NGCF)?</tspan> En CF puro la entrada es un one-hot ID; aplicar</text>
  <text x="64" y="480" fill="#cbd5e1" font-size="11.5">  transformaciones densas entorpece el entrenamiento y provoca sobreajuste severo.</text>
  <text x="64" y="498" fill="#cbd5e1" font-size="11.5">• Los únicos parámetros entrenables de todo LightGCN son la capa 0: <tspan class="mono" fill="#34d399">E^{(0)} ∈ R^{(|U|+|I|)×d}</tspan>.</text>

  <!-- Normalization note -->
  <rect x="44" y="522" width="572" height="108" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="62" y="544" fill="#065f46" font-size="13" font-weight="800">El Papel Crítico del Normalizador Simétrico 1 / √(deg(u) · deg(i)):</text>
  <text x="62" y="566" fill="#047857" font-size="11.5">• Si un blockbuster i tiene deg(i) = 10,000, sin dividir por √deg(i) actuaría como un</text>
  <text x="62" y="584" fill="#047857" font-size="11.5">  «agujero negro» mezclando los vectores de usuarios que no tienen nada en común.</text>
  <text x="62" y="606" fill="#065f46" font-size="11.5" font-weight="700">• Al servir en producción: pre-calculas E_{final} una vez y sirves con FAISS igual que MF.</text>

  <!-- Right Panel: Over-smoothing, PPR & PinSage -->
  <rect x="652" y="108" width="604" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="126" width="568" height="32" rx="8" fill="#fff7ed"/>
  <text x="954" y="147" text-anchor="middle" fill="#c2410c" font-size="14.5" font-weight="800">2. Over-Smoothing, Personalized PageRank (Pixie) y PinSage</text>

  <!-- Over-smoothing -->
  <rect x="670" y="172" width="568" height="148" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="688" y="196" fill="#991b1b" font-size="13.5" font-weight="800">A. ¿Por qué NUNCA apilar K = 8 capas en un Grafo de Recomendación?</text>
  <text x="688" y="218" fill="#475569" font-size="11.5">• Los grafos usuario–ítem son redes «mundo pequeño» (diámetro efectivo ≤ 4).</text>
  <text x="688" y="238" fill="#dc2626" font-size="11.5" font-weight="700">• Over-smoothing: Con K ≥ 4, el vecindario de k saltos abarca casi todo el grafo;</text>
  <text x="688" y="256" fill="#dc2626" font-size="11.5" font-weight="700">  todos los usuarios convergen al mismo vector promedio y el NDCG se desploma.</text>
  <text x="688" y="278" fill="#047857" font-size="11.5" font-weight="700">✓ Punto dulce universal: K = 2 o K = 3 capas combinadas con suma ponderada α_k.</text>
  <text x="688" y="298" fill="#475569" font-size="11">  (La conexión residual desde E^{(0)} en el readout evita que la capa 0 se diluya).</text>

  <!-- PPR / Pixie -->
  <rect x="670" y="334" width="568" height="138" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="688" y="358" fill="#1e40af" font-size="13.5" font-weight="800">B. Personalized PageRank (PPR) y Pixie (Pinterest En Tiempo Real)</text>
  <rect x="688" y="368" width="532" height="36" rx="6" fill="#0f172a"/>
  <text x="954" y="391" text-anchor="middle" fill="#38bdf8" font-size="12" class="mono">π_u = α · e_u + (1 - α) · P^T · π_u    (Equivalente a LightGCN con α_k = α(1-α)^k)</text>
  <text x="688" y="424" fill="#334155" font-size="11.5">• Caminata aleatoria con probabilidad de teletransporte α ≈ 0.15 de vuelta al usuario u.</text>
  <text x="688" y="444" fill="#1d4ed8" font-size="11.5" font-weight="700">• No requiere entrenamiento GPU: responde en milisegundos sobre el historial reciente.</text>

  <!-- PinSage Inductive -->
  <rect x="670" y="486" width="568" height="144" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="688" y="510" fill="#5b21b6" font-size="13.5" font-weight="800">C. Transductivo (LightGCN) vs Inductivo (PinSage — Ying et al., KDD 2018)</text>
  <text x="688" y="532" fill="#475569" font-size="11.5">• <tspan font-weight="700" fill="#dc2626">Limitación de LightGCN:</tspan> es transductivo (si entra una película nueva hoy, no tiene</text>
  <text x="688" y="550" fill="#475569" font-size="11.5">  fila en E^{(0)} hasta re-entrenar la tabla entera).</text>
  <text x="688" y="572" fill="#5b21b6" font-size="11.5" font-weight="700">• Solución PinSage:</text>
  <text x="688" y="590" fill="#334155" font-size="11.5">  Los nodos arrancan con <tspan font-weight="700">embeddings de contenido (texto + imagen)</tspan> y agregan vecinos</text>
  <text x="688" y="608" fill="#334155" font-size="11.5">  muestreados por importancia PPR → ¡opera a escala de 3,000 millones de nodos!</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">En el Proyecto 10 verás que LightGCN (K=3) mejora ~8-12% en Recall@20 sobre MF clásica con exactamente el mismo número de parámetros.</text>
</svg>
