<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 12 · LLMs &amp; AGENTES</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">LLMs Y AGENTES EN RECOMENDACIÓN: DÓNDE SÍ, DÓNDE NO Y AGENTE CINEMATCH</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">Por qué un LLM fracasa como Retriever directo sobre 10^6 ítems y triunfa como NLU, Aumentador Semántico y Re-Ranker</text>


  <!-- Left Panel: Where LLMs Win vs Fail in RecSys -->
  <rect x="24" y="108" width="596" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="560" height="32" rx="8" fill="#fef2f2"/>
  <text x="322" y="147" text-anchor="middle" fill="#b91c1c" font-size="14.5" font-weight="800">1. Auditoría Fría: Dónde Fracasa vs Dónde Brilla un LLM en RecSys</text>

  <!-- Where LLMs Fail -->
  <rect x="44" y="172" width="556" height="156" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="62" y="196" fill="#9f1239" font-size="13.5" font-weight="800">✗ Dónde NO Poner un LLM en Tiempo Real:</text>
  <text x="62" y="218" fill="#475569" font-size="11.5">1. <tspan font-weight="700" fill="#dc2626">Retrieval directo sobre el catálogo:</tspan> no cabe en ventana, inventa títulos inexistentes</text>
  <text x="76" y="236" fill="#475569" font-size="11.5">y desconoce por completo los IDs internos y el stock activo de tu plataforma.</text>
  <text x="62" y="256" fill="#475569" font-size="11.5">2. <tspan font-weight="700" fill="#dc2626">Sesgo de Posición en el Prompt (Lost-in-the-Middle):</tspan> si le pasas 30 candidatos</text>
  <text x="76" y="274" fill="#475569" font-size="11.5">para re-ordenar, prefiere sistemáticamente los primeros 3 de la lista de entrada.</text>
  <text x="62" y="294" fill="#475569" font-size="11.5">3. <tspan font-weight="700" fill="#dc2626">Latencia y Coste:</tspan> 600–1,500 ms vs presupuesto de 30 ms del ranker tabular/neuronal.</text>
  <text x="62" y="314" fill="#9f1239" font-size="11.5" font-weight="700">4. Ceguera Colaborativa Fina: sin fine-tuning no sabe qué co-consumen tus usuarios hoy.</text>

  <!-- Where LLMs Shine -->
  <rect x="44" y="342" width="556" height="288" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="62" y="366" fill="#065f46" font-size="13.5" font-weight="800">✓ Los 4 Roles de Alto Retorno de Inversión (ROI) en Producción:</text>

  <rect x="62" y="380" width="520" height="54" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="76" y="400" fill="#065f46" font-size="12" font-weight="800">① Aumentador Semántico Offline (KAR — Coste Serving = 0 ms)</text>
  <text x="76" y="418" fill="#475569" font-size="11.5">Enriquece cada película una sola vez con tropos, mood y público objetivo → BGE → Two-Tower.</text>

  <rect x="62" y="442" width="520" height="54" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="76" y="462" fill="#065f46" font-size="12" font-weight="800">② Traductor NLU de Intención Conversacional a Filtros Estructurados</text>
  <text x="76" y="480" fill="#475569" font-size="11.5">Convierte «algo corto de misterio de los 90 pero sin sangre» en JSON estricto de consulta.</text>

  <rect x="62" y="504" width="520" height="54" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="76" y="524" fill="#065f46" font-size="12" font-weight="800">③ Re-Ranker Contextual + Explicador Fiel sobre Top-15 Candidatos</text>
  <text x="76" y="542" fill="#475569" font-size="11.5">Re-ordena un conjunto pequeño ya filtrado por Two-Tower/EASE y redacta «Por qué verla».</text>

  <rect x="62" y="566" width="520" height="52" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="76" y="586" fill="#065f46" font-size="12" font-weight="800">④ Juez Sintético Calibrado para Evaluación Offline (LLM-as-a-Judge)</text>
  <text x="76" y="604" fill="#475569" font-size="11.5">Audita coherencia temática, spoilers y alucinaciones en las explicaciones generadas.</text>

  <!-- Right Panel: Agentic Architecture of "Pregúntale a CineMatch" -->
  <rect x="636" y="108" width="620" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="654" y="126" width="584" height="32" rx="8" fill="#eff6ff"/>
  <text x="946" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">2. Arquitectura de «Pregúntale a CineMatch» (Proyecto 12 — Cero Alucinación)</text>

  <!-- Step 1: User Query + Profile -->
  <rect x="664" y="174" width="564" height="72" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="684" y="198" fill="#0f172a" font-size="13" font-weight="800">Paso 1 · Entrada: Mensaje del Usuario + Historial Real (u_id)</text>
  <text x="684" y="218" fill="#2563eb" font-size="11.5" class="mono">"Quiero una de ciencia ficción cerebral como Arrival, pero posterior a 2010 y no vista"</text>
  <text x="684" y="236" fill="#475569" font-size="11">NLU extrae schema: <tspan class="mono">genres=['Sci-Fi'], anchor='Arrival', min_year=2010, exclude_seen=True</tspan></text>

  <line x1="946" y1="246" x2="946" y2="270" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Grounded Tool Retrieval -->
  <rect x="664" y="272" width="564" height="106" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="684" y="296" fill="#1e40af" font-size="13" font-weight="800">Paso 2 · Herramientas de Retrieval Híbrido sobre el Catálogo Real</text>
  <text x="684" y="318" fill="#334155" font-size="11.5">• <tspan font-weight="700">Filtro Duro (SQL/Pandas):</tspan> <tspan class="mono">year &gt;= 2010</tspan>, género compatible, excluye <tspan class="mono">seen_items(u)</tspan>.</text>
  <text x="684" y="338" fill="#334155" font-size="11.5">• <tspan font-weight="700">Score Combinado:</tspan> <tspan class="mono">α · TwoTower(u, i) + β · CosineBGE(query, i) + γ · ItemKNN(anchor, i)</tspan></text>
  <text x="684" y="360" fill="#1d4ed8" font-size="11.5" font-weight="700">Devuelve exactamente Top-15 candidatos reales con sus IDs y metadatos verificados.</text>

  <line x1="946" y1="378" x2="946" y2="402" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>

  <!-- Step 3: Debiasing & Verification Guardrail -->
  <rect x="664" y="404" width="564" height="106" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="684" y="428" fill="#5b21b6" font-size="13" font-weight="800">Paso 3 · Re-Ranker con Permutación Anti-Sesgo + Guardrail de Catálogo</text>
  <text x="684" y="450" fill="#334155" font-size="11.5">• <tspan font-weight="700">Mitigar Position Bias del LLM:</tspan> baraja o promedia 2 órdenes inversos de candidatos.</text>
  <text x="684" y="470" fill="#dc2626" font-size="11.5" font-weight="700">• Verificador Determinista (Zero-Hallucination Guard):</text>
  <text x="684" y="488" fill="#475569" font-size="11.5">  Comprueba que cada <tspan class="mono">item_id</tspan> devuelto pertenezca al conjunto candidato y cumpla los filtros.</text>

  <line x1="946" y1="510" x2="946" y2="534" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Step 4: Grounded Explanation & Critique Loop -->
  <rect x="664" y="536" width="564" height="94" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="684" y="560" fill="#065f46" font-size="13" font-weight="800">Paso 4 · Explicación Anclada (Grounded) + Bucle de Refinamiento Multi-Turno</text>
  <text x="684" y="582" fill="#047857" font-size="11.5">• Cita hechos reales («Porque viste Interstellar (5★) y buscas Sci-Fi cerebral post-2010»).</text>
  <text x="684" y="602" fill="#065f46" font-size="11.5" font-weight="700">• Si el validador detecta un filtro violado, re-ejecuta el nodo con crítica automática.</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">Regla de Oro del Módulo 12: El LLM NUNCA inventa IDs; las herramientas recuperan candidatos del catálogo y el LLM razona sobre ellos.</text>
</svg>
