<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 13 · RE-RANKING</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">MÁS ALLÁ DE LA PRECISIÓN: DIVERSIDAD (MMR / DPP), CALIBRACIÓN Y EQUIDAD</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">Cómo transformar 10 predicciones individualmente buenas en una página variada, calibrada, serendípica y justa</text>


  <!-- Left Panel: MMR vs Determinantal Point Processes (DPP) -->
  <rect x="24" y="108" width="612" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="576" height="32" rx="8" fill="#eff6ff"/>
  <text x="330" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">1. Diversificación Submodular: MMR vs Determinantal Point Processes (DPP)</text>

  <!-- Echo Chamber Problem -->
  <rect x="44" y="172" width="572" height="84" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="62" y="194" fill="#991b1b" font-size="13" font-weight="800">La Falacia de Ordenar por Score Individual: El Efecto «10 Clones de Marvel»</text>
  <text x="62" y="214" fill="#475569" font-size="11.5">Un ranker puntual evalúa cada película sin saber qué otras 9 acompañarán la misma fila.</text>
  <text x="62" y="234" fill="#dc2626" font-size="11.5" font-weight="700">Si la probabilidad de gustarle Marvel es 0.60, llenará el 100% de la pantalla de superhéroes.</text>

  <!-- MMR Box -->
  <rect x="44" y="268" width="572" height="162" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="62" y="292" fill="#1e40af" font-size="13.5" font-weight="800">A. MMR (Maximal Marginal Relevance — Carbonell &amp; Goldstein, 1998)</text>
  <rect x="62" y="302" width="536" height="40" rx="6" fill="#0f172a"/>
  <text x="330" y="327" text-anchor="middle" fill="#38bdf8" font-size="12.5" class="mono">i* = argmax_{i ∈ R \ S} [ λ · rel(u, i)  -  (1 - λ) · max_{j ∈ S} sim(e_i, e_j) ]</text>
  <text x="62" y="362" fill="#334155" font-size="11.5">• Selección voraz (greedy) ranura por ranura: penaliza el parecido con el ítem MÁS cercano</text>
  <text x="62" y="380" fill="#334155" font-size="11.5">  que ya haya sido elegido en la lista parcial S.</text>
  <text x="62" y="400" fill="#1d4ed8" font-size="11.5" font-weight="700">• Crítico: normalizar rel(u, i) y sim(e_i, e_j) al mismo rango [0, 1] antes de aplicar λ.</text>
  <text x="62" y="418" fill="#475569" font-size="11">• Complejidad: O(K² · |R|) — en |R|=100 y K=10 tarda &lt; 0.5 ms en CPU.</text>

  <!-- DPP Box -->
  <rect x="44" y="442" width="572" height="188" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="62" y="466" fill="#5b21b6" font-size="13.5" font-weight="800">B. DPP (Determinantal Point Processes — Chen et al., Hulu NeurIPS 2018)</text>
  <rect x="62" y="476" width="536" height="40" rx="6" fill="#0f172a"/>
  <text x="330" y="501" text-anchor="middle" fill="#a78bfa" font-size="12.5" class="mono">P(S) ∝ det(L_S),   donde  L = diag(r_u) · S_{sim} · diag(r_u)</text>
  <text x="62" y="536" fill="#334155" font-size="11.5">• Geométricamente, <tspan class="mono" font-weight="700">det(L_S)</tspan> es el <tspan font-weight="700">volumen al cuadrado del paralelepípedo</tspan> formado por</text>
  <text x="62" y="554" fill="#334155" font-size="11.5">  los vectores de los ítems seleccionados escalados por su calidad r_{ui}.</text>
  <text x="62" y="574" fill="#5b21b6" font-size="11.5" font-weight="700">• Ventaja sobre MMR:</text>
  <text x="62" y="592" fill="#475569" font-size="11.5">  Considera las correlaciones conjuntas de TODO el subconjunto S simultáneamente</text>
  <text x="62" y="610" fill="#475569" font-size="11.5">  (no solo el máximo par a par), resuelto rápido con <tspan font-weight="700">Fast Greedy MAP Cholesky</tspan>.</text>

  <!-- Right Panel: Steck Calibration, Serendipity & Multi-Objective Re-ranker -->
  <rect x="652" y="108" width="604" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="126" width="568" height="32" rx="8" fill="#ecfdf5"/>
  <text x="954" y="147" text-anchor="middle" fill="#047857" font-size="14.5" font-weight="800">2. Calibración de Géneros (Steck), Popularity Debias y Proyecto 13</text>

  <!-- Calibrated Recommendations -->
  <rect x="670" y="172" width="568" height="174" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="688" y="196" fill="#065f46" font-size="13.5" font-weight="800">A. Recomendaciones Calibradas en Distribución (Steck, Netflix RecSys 2018)</text>
  <text x="688" y="218" fill="#047857" font-size="11.5">Si un usuario vio <tspan font-weight="700">70% Drama y 30% Comedia</tspan>, una lista Top-10 con <tspan font-weight="700" fill="#dc2626">100% Drama</tspan> amplifica</text>
  <text x="688" y="236" fill="#047857" font-size="11.5">el género mayoritario y mata sus intereses secundarios.</text>
  <rect x="688" y="248" width="532" height="40" rx="6" fill="#0f172a"/>
  <text x="954" y="273" text-anchor="middle" fill="#34d399" font-size="12" class="mono">S* = argmax_{|S|=K} [ (1 - λ) Σ_{i∈S} s(u,i)  -  λ · KL( p(g | u)  ||  q̃(g | S) ) ]</text>
  <text x="688" y="308" fill="#065f46" font-size="11.5">• Suavizado obligatorio para evitar log(0): <tspan class="mono">q̃(g|S) = (1 - α)·q(g|S) + α·p(g|u)</tspan> con α ≈ 0.01.</text>
  <text x="688" y="328" fill="#059669" font-size="11.5" font-weight="700">• Por submodularidad, el algoritmo greedy garantiza (1 - 1/e) ≈ 63% del óptimo global.</text>

  <!-- Beyond-Accuracy Metrics Matrix -->
  <rect x="670" y="360" width="568" height="148" rx="10" fill="#0f172a"/>
  <text x="690" y="384" fill="#38bdf8" font-size="13" font-weight="700">B. Las 5 Métricas Beyond-Accuracy del Re-Ranker (Proyecto 13):</text>
  <text x="690" y="408" fill="#e2e8f0" font-size="11.5" class="mono">1. ILD (Intra-List Distance) : promedio de (1 - cos(e_i, e_j)) entre pares de la lista</text>
  <text x="690" y="428" fill="#34d399" font-size="11.5" class="mono">2. Novelty / Self-Info       : promedio de -log2 P(i)  (premia descubrir Long-Tail)</text>
  <text x="690" y="448" fill="#fbbf24" font-size="11.5" class="mono">3. Serendipity               : aciertos en Test que el baseline de Popularidad NO predijo</text>
  <text x="690" y="468" fill="#a78bfa" font-size="11.5" class="mono">4. Calibration Error (KL/JS) : divergencia entre géneros del historial p(g|u) y lista q(g|S)</text>
  <text x="690" y="488" fill="#f87171" font-size="11.5" class="mono">5. Catalog Coverage &amp; Gini   : % de películas expuestas y equidad entre estudios/directores</text>

  <!-- Pareto Trade-off -->
  <rect x="670" y="522" width="568" height="108" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="688" y="544" fill="#9a3412" font-size="13" font-weight="800">C. El Hallazgo Práctico en la Frontera de Pareto:</text>
  <text x="688" y="566" fill="#475569" font-size="11.5">• Con un peso moderado <tspan font-weight="700" fill="#c2410c">λ ≈ 0.15–0.25</tspan> en MMR o Calibración, puedes reducir la</text>
  <text x="688" y="584" fill="#475569" font-size="11.5">  descalibración KL en un <tspan font-weight="700" fill="#059669">-55%</tspan> y duplicar la cobertura de catálogo sacrificando</text>
  <text x="688" y="604" fill="#0f172a" font-size="11.5" font-weight="700">  menos de un 1.5% de NDCG@10 (¡el «almuerzo casi gratis» del re-ranking!).</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">Regla de Diseño de Home (Netflix): Diversifica DENTRO de cada fila con MMR/DPP y diversifica ENTRE filas asignando temas ortogonales.</text>
</svg>
