<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 15 · A/B &amp; ONLINE</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">EXPERIMENTACIÓN ONLINE: A/B TESTING, CUPED, INTERLEAVING Y GUARDRAILS</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">De la correlación offline a la causalidad online: poder estadístico, reducción de varianza CUPED y Team-Draft Interleaving</text>


  <!-- Left Panel: OEC, Guardrails, SRM & CUPED -->
  <rect x="24" y="108" width="612" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="576" height="32" rx="8" fill="#eff6ff"/>
  <text x="330" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">1. Anatomía de un A/B Test Industrial y Reducción de Varianza CUPED</text>

  <!-- Hierarchy of Metrics -->
  <rect x="44" y="172" width="572" height="122" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="62" y="194" fill="#0f172a" font-size="13" font-weight="800">Jerarquía de Métricas de Decisión (Netflix / Spotify):</text>
  <text x="62" y="216" fill="#059669" font-size="11.5">• <tspan font-weight="700">OEC / North Star:</tspan> Horas de streaming cualificadas por usuario (> 5 min vistos) y Retención.</text>
  <text x="62" y="236" fill="#2563eb" font-size="11.5">• <tspan font-weight="700">Métricas Diagnósticas (Proxy):</tspan> CTR de fila, tasa de abandono rápido (&lt; 30 s), diversidad ILD.</text>
  <text x="62" y="256" fill="#dc2626" font-size="11.5" font-weight="700">• Guardrails Intocables: Latencia p99 (+10 ms máx), tasa de crash/errores, coste de GPU.</text>
  <text x="62" y="278" fill="#991b1b" font-size="11.5" font-weight="700">• Chequeo #0 Obligatorio — SRM (Sample Ratio Mismatch): test χ² sobre (N_A, N_B).</text>

  <!-- Sample Size & CUPED -->
  <rect x="44" y="308" width="572" height="198" rx="10" fill="#0f172a"/>
  <text x="64" y="332" fill="#38bdf8" font-size="13" font-weight="700">CUPED (Deng et al., Microsoft WSDM 2013): Multiplicar tu Tráfico Gratis</text>
  <text x="64" y="354" fill="#cbd5e1" font-size="11.5">La actividad previa del usuario X_u (2 semanas antes del test) explica gran parte de la varianza de Y_u:</text>
  <rect x="64" y="366" width="532" height="44" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="330" y="393" text-anchor="middle" fill="#34d399" font-size="13" class="mono">Ỹ_u = Y_u - θ · (X_u - X̄_pooled),     con   θ* = Cov(Y, X) / Var(X)</text>
  <text x="64" y="432" fill="#e2e8f0" font-size="11.5">• <tspan font-weight="700" fill="#fbbf24">Insesgado por construcción:</tspan> como X_u es anterior a la asignación aleatoria, E[X_B - X_A] = 0</text>
  <text x="64" y="450" fill="#cbd5e1" font-size="11.5">  y por tanto <tspan class="mono" fill="#fff">E[Ỹ_B - Ỹ_A] = E[Y_B - Y_A]</tspan> exactamente.</text>
  <text x="64" y="472" fill="#34d399" font-size="12" font-weight="700">• Reducción de Varianza: Var(Ỹ) = Var(Y) · (1 - ρ²_{XY}).</text>
  <text x="64" y="492" fill="#a78bfa" font-size="11.5">  Si corr(X, Y) = 0.80 → Var cae un 64% (¡equivale a tener 2.8x más usuarios o durar 64% menos!).</text>

  <!-- Ratio Metrics Delta Method -->
  <rect x="44" y="518" width="572" height="112" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="62" y="540" fill="#1e40af" font-size="13" font-weight="800">Cuidado con Métricas de Ratio (CTR por Impresión vs Aleatorización por Usuario):</text>
  <text x="62" y="562" fill="#334155" font-size="11.5">• Si aleatorizas por <tspan font-weight="700">usuario</tspan>, las impresiones de un mismo usuario NO son independientes.</text>
  <text x="62" y="582" fill="#dc2626" font-size="11.5" font-weight="700">• Un test binomial ingenuo sobre el total de impresiones subestima la varianza (falsos +).</text>
  <text x="62" y="604" fill="#1d4ed8" font-size="11.5" font-weight="700">✓ Solución: Método Delta sobre (Clicks_u, Impr_u) o Cluster Bootstrap a nivel usuario.</text>

  <!-- Right Panel: Team-Draft Interleaving & 4 Deadly Traps -->
  <rect x="652" y="108" width="604" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="126" width="568" height="32" rx="8" fill="#ecfdf5"/>
  <text x="954" y="147" text-anchor="middle" fill="#047857" font-size="14.5" font-weight="800">2. Team-Draft Interleaving y las 4 Trampas de Experimentación (Proyecto 15)</text>

  <!-- Team-Draft Interleaving -->
  <rect x="670" y="172" width="568" height="194" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="688" y="196" fill="#065f46" font-size="13.5" font-weight="800">A. Team-Draft Interleaving (Chapelle et al. / Netflix — 50x Más Sensible)</text>
  <text x="688" y="218" fill="#047857" font-size="11.5">En vez de separar usuarios en grupo A y grupo B, cada usuario ve UNA lista entrelazada I:</text>
  <rect x="688" y="228" width="532" height="58" rx="6" fill="#0f172a"/>
  <text x="704" y="250" fill="#38bdf8" font-size="11.5" class="mono">Ranker A: [i_1, i_2, i_3, i_4]   \   Sorteo de capitanes por turno sin duplicados:</text>
  <text x="704" y="272" fill="#34d399" font-size="11.5" class="mono">Ranker B: [i_5, i_2, i_6, i_1]   /   Lista Mostrada: [ i_1(A), i_5(B), i_2(B), i_3(A) ]</text>
  <text x="688" y="306" fill="#065f46" font-size="11.5">• Atribuyes cada clic al equipo dueño del slot en esa impresión (neutraliza varianza entre usuarios).</text>
  <text x="688" y="326" fill="#065f46" font-size="11.5" font-weight="700">• Ideal como embudo previo: filtra 20 candidatos de algoritmos con 1/50 del tráfico,</text>
  <text x="688" y="344" fill="#065f46" font-size="11.5">  y pasa solo el ganador al A/B test largo para medir retención y horas totales.</text>

  <!-- 4 Classic Experimentation Traps -->
  <rect x="670" y="380" width="568" height="250" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="688" y="404" fill="#9a3412" font-size="13.5" font-weight="800">B. Las 4 Trampas Clásicas que Arruinan Decisiones Online:</text>

  <text x="688" y="430" fill="#b91c1c" font-size="12" font-weight="800">① Peeking (Mirar el p-valor cada mañana y parar cuando p &lt; 0.05):</text>
  <text x="702" y="448" fill="#475569" font-size="11.5">Infla los falsos positivos del 5% al &gt;25%. Usa horizonte fijo o <tspan font-weight="700">mSPRT (Always-Valid p-values)</tspan>.</text>

  <text x="688" y="474" fill="#b91c1c" font-size="12" font-weight="800">② Efecto Novedad vs Fatiga (Novelty &amp; Primacy Effect):</text>
  <text x="702" y="492" fill="#475569" font-size="11.5">Cualquier cambio visual sube el CTR los primeros 3 días por curiosidad; mide por cohorte de días.</text>

  <text x="688" y="518" fill="#b91c1c" font-size="12" font-weight="800">③ Interferencia / Efecto Canibalización (SUTVA Violation):</text>
  <text x="702" y="536" fill="#475569" font-size="11.5">Si A y B comparten un modelo re-entrenado juntos o compiten por inventario finito, se contaminan.</text>

  <text x="688" y="562" fill="#b91c1c" font-size="12" font-weight="800">④ Sesgo del Ganador (Winner's Curse) y Comparaciones Múltiples:</text>
  <text x="702" y="580" fill="#475569" font-size="11.5">Al probar 15 variantes o 20 métricas, corrige con <tspan font-weight="700">Benjamini-Hochberg (FDR)</tspan> para las secundarias</text>
  <text x="702" y="598" fill="#475569" font-size="11.5">y exige una única OEC pre-registrada antes de abrir el experimento.</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">Regla de Producción (Proyecto 15): Si el test χ² de SRM da p < 0.001, detén el análisis inmediatamente: hay un bug de telemetría o caché.</text>
</svg>
