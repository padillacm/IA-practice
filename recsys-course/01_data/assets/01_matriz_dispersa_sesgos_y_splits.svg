<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">

  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
    }
    .card {
      rx: 14px;
      ry: 14px;
    }
    .badge {
      rx: 8px;
      ry: 8px;
    }
    @keyframes flowPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glowNode {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
    @keyframes bprPull {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-22px, 14px); }
    }
    @keyframes bprPush {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(26px, 18px); }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: flowPulse 1.3s linear infinite;
    }
    .flow-fast {
      stroke-dasharray: 8 6;
      animation: flowPulse 0.85s linear infinite;
    }
    .pull-anim {
      animation: bprPull 2.4s ease-in-out infinite;
    }
    .push-anim {
      animation: bprPush 2.4s ease-in-out infinite;
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <!-- Header -->
  <rect x="24" y="18" width="1232" height="76" rx="14" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <rect x="44" y="34" width="168" height="26" rx="6" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="128" y="52" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">MÓDULO 01 · DATOS</text>
  <text x="230" y="50" fill="#ffffff" font-size="21" font-weight="800">DATOS DE INTERACCIÓN: MATRICES CSR, LOS 4 SESGOS Y SPLITS TEMPORALES</text>
  <text x="230" y="74" fill="#cbd5e1" font-size="13.5" font-weight="500">De logs crudos a scipy.sparse.csr_matrix (99%+ dispersión), feedback implícito vs explícito y prevención de Data Leakage</text>


  <!-- Panel 1: CSR Matrix & Implicit vs Explicit -->
  <rect x="24" y="108" width="396" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="42" y="126" width="360" height="32" rx="8" fill="#eff6ff"/>
  <text x="222" y="147" text-anchor="middle" fill="#1d4ed8" font-size="14.5" font-weight="800">1. De Logs a Matriz Dispersa CSR</text>

  <text x="44" y="180" fill="#0f172a" font-size="13" font-weight="700">Explícito vs Implícito (Confianza):</text>
  <rect x="44" y="190" width="356" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="210" fill="#334155" font-size="12">• <tspan font-weight="700" fill="#2563eb">Explícito (rating 1–5★):</tspan> Escaso (&lt;1% usuarios),</text>
  <text x="66" y="227" fill="#475569" font-size="11.5">sesgado a extremos (quien ama u odia vota).</text>
  <text x="56" y="246" fill="#334155" font-size="12">• <tspan font-weight="700" fill="#059669">Implícito (clics, % visto):</tspan> Abundante, pero</text>
  <text x="66" y="261" fill="#dc2626" font-size="11.5" font-weight="700">un 0 NO es «no le gusta», es «no expuesto aún».</text>

  <text x="44" y="288" fill="#0f172a" font-size="13" font-weight="700">Por qué NUNCA usar matriz densa (NumPy):</text>
  <rect x="44" y="298" width="356" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="56" y="318" fill="#991b1b" font-size="12" font-weight="700">10⁶ usuarios × 10⁵ ítems × 4 bytes = 400 GB RAM</text>
  <text x="56" y="338" fill="#7f1d1d" font-size="11.5">Con 99.8% de ceros, en formato CSR ocupa solo</text>
  <text x="56" y="354" fill="#047857" font-size="12" font-weight="700">~2.4 GB (guarda únicamente los nnz ≠ 0).</text>

  <text x="44" y="384" fill="#0f172a" font-size="13" font-weight="700">Anatomía de los 3 arrays de CSR:</text>
  <rect x="44" y="394" width="356" height="148" rx="8" fill="#0f172a"/>
  <text x="58" y="418" fill="#38bdf8" font-size="12" class="mono">data    = [ 5.0,  4.0,  3.5,  5.0 ] # valores</text>
  <text x="58" y="442" fill="#a78bfa" font-size="12" class="mono">indices = [   1,    3,    0,    2 ] # col ítem</text>
  <text x="58" y="466" fill="#34d399" font-size="12" class="mono">indptr  = [   0,    2,    3,    4 ] # inicio fila</text>
  <line x1="58" y1="480" x2="384" y2="480" stroke="#334155" stroke-width="1"/>
  <text x="58" y="500" fill="#e2e8f0" font-size="11.5">Fila u tiene columnas: <tspan class="mono" fill="#fbbf24">indices[indptr[u]:indptr[u+1]]</tspan></text>
  <text x="58" y="520" fill="#94a3b8" font-size="11.5">• Slicing por usuario (fila): O(1) instantáneo</text>
  <text x="58" y="536" fill="#94a3b8" font-size="11.5">• Slicing por ítem (columna): convierte a CSC</text>

  <rect x="44" y="554" width="356" height="74" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="56" y="574" fill="#065f46" font-size="12" font-weight="700">Poda k-core iterativa (Proyecto 01):</text>
  <text x="56" y="592" fill="#047857" font-size="11.5">Eliminar usuarios &lt; k_u puede dejar ítems &lt; k_i.</text>
  <text x="56" y="610" fill="#047857" font-size="11.5" font-weight="700">¡Debes iterar en bucle hasta el punto fijo!</text>

  <!-- Panel 2: Los 4 Sesgos Estructurales -->
  <rect x="436" y="108" width="400" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="454" y="126" width="364" height="32" rx="8" fill="#f5f3ff"/>
  <text x="636" y="147" text-anchor="middle" fill="#6d28d9" font-size="14.5" font-weight="800">2. Los 4 Sesgos Críticos del Log (MNAR)</text>

  <!-- Bias 1 -->
  <rect x="454" y="172" width="364" height="104" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="470" y="194" fill="#9a3412" font-size="13" font-weight="800">① Sesgo de Popularidad (Matthew Effect)</text>
  <text x="470" y="214" fill="#475569" font-size="11.5">Los ítems más populares reciben más impresiones →</text>
  <text x="470" y="232" fill="#475569" font-size="11.5">más clics → el modelo los recomienda aún más.</text>
  <text x="470" y="254" fill="#c2410c" font-size="11.5" font-weight="700">Mitigación: regularización log Q, IPS, RP³β.</text>

  <!-- Bias 2 -->
  <rect x="454" y="288" width="364" height="108" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="470" y="310" fill="#1e40af" font-size="13" font-weight="800">② Sesgo de Posición (Position Bias)</text>
  <text x="470" y="330" fill="#1e3a8a" font-size="11.5" class="mono">P(click=1 | u,i,k) = P(visto | k) · P(relevante | u,i)</text>
  <text x="470" y="350" fill="#475569" font-size="11.5">La posición k=1 recibe 3x–5x más clics que k=8</text>
  <text x="470" y="368" fill="#475569" font-size="11.5">aunque sea exactamente la misma película.</text>
  <text x="470" y="386" fill="#1d4ed8" font-size="11.5" font-weight="700">Mitigación: feature pos en train (pos=0 al servir).</text>

  <!-- Bias 3 -->
  <rect x="454" y="408" width="364" height="108" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="470" y="430" fill="#991b1b" font-size="13" font-weight="800">③ Sesgo de Exposición / Selección (MNAR)</text>
  <text x="470" y="450" fill="#475569" font-size="11.5">Los datos faltantes NO son aleatorios: el usuario</text>
  <text x="470" y="468" fill="#475569" font-size="11.5">solo interactúa con lo que la política previa π_0</text>
  <text x="470" y="486" fill="#475569" font-size="11.5">decidió mostrarle ( bucle de retroalimentación ).</text>
  <text x="470" y="504" fill="#dc2626" font-size="11.5" font-weight="700">Mitigación: exploración ε-greedy / Bandits + OPE.</text>

  <!-- Bias 4 -->
  <rect x="454" y="528" width="364" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470" y="550" fill="#0f172a" font-size="13" font-weight="800">④ Sesgo de Supervivencia y Positividad</text>
  <text x="470" y="570" fill="#475569" font-size="11.5">Los usuarios insatisfechos abandonan la plataforma</text>
  <text x="470" y="588" fill="#475569" font-size="11.5">y dejan de generar eventos; tus logs sobre-representan</text>
  <text x="470" y="606" fill="#334155" font-size="11.5" font-weight="700">a los heavy-users satisfechos con el sistema actual.</text>

  <!-- Panel 3: Splits & Data Leakage -->
  <rect x="852" y="108" width="404" height="538" class="card" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="870" y="126" width="368" height="32" rx="8" fill="#ecfdf5"/>
  <text x="1054" y="147" text-anchor="middle" fill="#047857" font-size="14.5" font-weight="800">3. Splits Honestos vs Data Leakage</text>

  <!-- Random Split (Bad) -->
  <rect x="870" y="172" width="368" height="128" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="886" y="194" fill="#b91c1c" font-size="13" font-weight="800">✗ Split Aleatorio (Fuga del Futuro / Leakage)</text>
  <rect x="886" y="206" width="70" height="22" rx="4" fill="#3b82f6"/><text x="921" y="221" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">Train t1</text>
  <rect x="962" y="206" width="70" height="22" rx="4" fill="#ef4444"/><text x="997" y="221" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">Test t2</text>
  <rect x="1038" y="206" width="70" height="22" rx="4" fill="#3b82f6"/><text x="1073" y="221" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">Train t3</text>
  <rect x="1114" y="206" width="70" height="22" rx="4" fill="#3b82f6"/><text x="1149" y="221" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">Train t4</text>
  <text x="886" y="250" fill="#7f1d1d" font-size="11.5">• Entrenas con El Señor de los Anillos III (t3) para</text>
  <text x="886" y="268" fill="#7f1d1d" font-size="11.5">  «predecir» que vio la parte II en el pasado (t2).</text>
  <text x="886" y="286" fill="#dc2626" font-size="11.5" font-weight="700">• Infla NDCG hasta +30% de forma ficticia.</text>

  <!-- Global Temporal Split (Good) -->
  <rect x="870" y="314" width="368" height="148" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="886" y="336" fill="#065f46" font-size="13" font-weight="800">✓ A. Corte Temporal Global (t &lt; T_cut)</text>
  <rect x="886" y="348" width="180" height="24" rx="4" fill="#2563eb"/><text x="976" y="364" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">TRAIN (&lt; T_val)</text>
  <rect x="1072" y="348" width="72" height="24" rx="4" fill="#f59e0b"/><text x="1108" y="364" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">VAL</text>
  <rect x="1150" y="348" width="72" height="24" rx="4" fill="#10b981"/><text x="1186" y="364" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">TEST</text>
  <text x="886" y="394" fill="#047857" font-size="11.5">• Simula exactamente la producción: entrenas hoy</text>
  <text x="886" y="412" fill="#047857" font-size="11.5">  a las 00:00 y sirves tráfico durante la semana.</text>
  <text x="886" y="430" fill="#065f46" font-size="11.5" font-weight="700">• Separa usuarios Warm vs Cold-Start honestamente.</text>
  <text x="886" y="448" fill="#065f46" font-size="11.5">• Vocabulario e IDs se ajustan SOLO sobre TRAIN.</text>

  <!-- Leave-Last-One-Out (Sequential) -->
  <rect x="870" y="476" width="368" height="152" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="886" y="498" fill="#1e40af" font-size="13" font-weight="800">✓ B. Leave-Last-One-Out por Usuario (Secuencial)</text>
  <text x="886" y="520" fill="#334155" font-size="11.5">Para cada usuario u con historial ordenado por t:</text>
  <text x="886" y="542" fill="#1d4ed8" font-size="12" class="mono">u_hist: [i_1, i_2, ..., i_{n-2}] → Train</text>
  <text x="886" y="562" fill="#d97706" font-size="12" class="mono">        [i_{n-1}]                → Validación</text>
  <text x="886" y="582" fill="#059669" font-size="12" class="mono">        [i_n]                    → Test</text>
  <text x="886" y="608" fill="#475569" font-size="11">Ideal para SASRec/BERT4Rec (ojo: puede filtrar</text>
  <text x="886" y="622" fill="#475569" font-size="11">tendencias globales entre usuarios de distinta época).</text>


  <!-- Footer Banner -->
  <rect x="24" y="662" width="1232" height="42" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <circle cx="48" cy="683" r="8" fill="#10b981"/>
  <text x="68" y="688" fill="#f8fafc" font-size="13.5" font-weight="600">Contrato del Pipeline (Proyecto 01): El StringIndexer de usuarios/ítems se ajusta EXCLUSIVAMENTE en Train; lo nuevo en Test va al bucket Cold-Start.</text>
</svg>
