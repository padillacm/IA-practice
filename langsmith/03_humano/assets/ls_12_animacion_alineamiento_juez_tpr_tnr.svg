<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <style>
    svg {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
    }
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 24px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #0f172a; }
    .card-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .body-text { font-size: 12px; font-weight: 500; fill: #334155; }
    .small-text { font-size: 11px; font-weight: 500; fill: #475569; }
    .badge-text { font-size: 11px; font-weight: 700; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .card-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
    .card-green { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.5; rx: 8; }
    .card-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
    .card-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
    .card-purple { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 8; }
    .card-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .footer-box { fill: #0f172a; rx: 10; }
    .footer-text { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .footer-hl { fill: #38bdf8; font-weight: 700; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -28; }
    }
    @keyframes pktMoveRight {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(220px); opacity: 0; }
    }
    .anim-dash {
      stroke-dasharray: 8 6;
      animation: flowDash 1.1s linear infinite;
    }
    .anim-pulse {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <!-- Header -->
  <rect x="28" y="18" width="1224" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="48" y="47" class="title">ALINEAMIENTO DEL JUEZ LLM: TPR, TNR Y LAS 3 PALANCAS DE POTENCIA (MÓDULO 12)</text>
  <text x="48" y="69" class="subtitle">Cómo medir dónde se equivoca tu juez frente al criterio humano y corregirlo sistemáticamente sin sobreajustar</text>

  <!-- Panel 1: TPR / TNR vs Accuracy -->
  <rect x="28" y="98" width="400" height="544" class="panel"/>
  <text x="46" y="126" class="panel-title">1. La Medida que Importa: TPR y TNR</text>
  <text x="46" y="146" class="small-text">No mires solo el % de acierto global del juez; desglosa la</text>
  <text x="46" y="162" class="small-text">matriz de confusión contra la etiqueta humana de referencia:</text>

  <!-- Confusion Matrix 2x2 -->
  <rect x="46" y="178" width="364" height="168" class="card-slate"/>
  <text x="228" y="198" text-anchor="middle" class="card-title">Matriz Humano (Verdad) vs Juez LLM</text>
  <rect x="64" y="212" width="160" height="56" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  <text x="144" y="234" text-anchor="middle" class="mono" font-size="11" fill="#047857" font-weight="700">TP (Humano=1, Juez=1)</text>
  <text x="144" y="254" text-anchor="middle" class="small-text">Acierto en casos buenos</text>

  <rect x="234" y="212" width="160" height="56" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="314" y="234" text-anchor="middle" class="mono" font-size="11" fill="#b45309" font-weight="700">FN (Humano=1, Juez=0)</text>
  <text x="314" y="254" text-anchor="middle" class="small-text">Juez demasiado severo</text>

  <rect x="64" y="276" width="160" height="56" rx="6" fill="#fef2f2" stroke="#ef4444" class="anim-pulse"/>
  <text x="144" y="298" text-anchor="middle" class="mono" font-size="11" fill="#b91c1c" font-weight="700">FP (Humano=0, Juez=1)</text>
  <text x="144" y="318" text-anchor="middle" class="small-text" fill="#b91c1c">¡Peligro! Juez complaciente</text>

  <rect x="234" y="276" width="160" height="56" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="314" y="298" text-anchor="middle" class="mono" font-size="11" fill="#1d4ed8" font-weight="700">TN (Humano=0, Juez=0)</text>
  <text x="314" y="318" text-anchor="middle" class="small-text">Caza el fallo de verdad</text>

  <rect x="46" y="360" width="364" height="142" class="card-red"/>
  <text x="62" y="382" class="card-title" fill="#b91c1c">El Defecto de Fábrica: TPR=98%, TNR=35%</text>
  <text x="62" y="404" class="small-text">Un Juez LLM genérico casi siempre aprueba respuestas</text>
  <text x="62" y="420" class="small-text">educadas aunque violen reglas sutiles de negocio:</text>
  <text x="62" y="442" class="mono" font-size="11" fill="#065f46">TPR = TP / (TP + FN)  → Sensibilidad al éxito</text>
  <text x="62" y="462" class="mono" font-size="11" fill="#b91c1c">TNR = TN / (TN + FP)  → Capacidad de cazar fallos</text>
  <text x="62" y="484" class="small-text">¡Un juez con <tspan class="mono">TNR &lt; 0.70</tspan> deja pasar la mitad de los errores!</text>

  <rect x="46" y="514" width="364" height="112" class="card-purple"/>
  <text x="62" y="536" class="card-title" fill="#5b21b6">Corrección de Rogan-Gladen (Prevalencia Real)</text>
  <text x="62" y="558" class="small-text">Conociendo <tspan class="mono">TPR</tspan> y <tspan class="mono">TNR</tspan> del juez en tu set calibrado,</text>
  <text x="62" y="574" class="small-text">puedes corregir el sesgo de la media observada <tspan class="mono">p_obs</tspan>:</text>
  <text x="62" y="598" class="mono" font-size="11.5" fill="#4c1d95">p_real = (p_obs + TNR - 1) / (TPR + TNR - 1)</text>

  <!-- Panel 2: Las 3 Palancas en Orden de Potencia -->
  <rect x="444" y="98" width="420" height="544" class="panel"/>
  <text x="462" y="126" class="panel-title">2. Las 3 Palancas de Alineamiento (Por Impacto/Coste)</text>

  <rect x="462" y="144" width="384" height="148" class="card-green"/>
  <text x="478" y="166" class="card-title" fill="#047857">Palanca 1 · Explicitar Reglas Implícitas en la Rúbrica</text>
  <text x="478" y="186" class="small-text">El 60% de los falsos positivos (<tspan class="mono">FP</tspan>) ocurren porque el</text>
  <text x="478" y="202" class="small-text">humano conoce una regla del negocio que el prompt del</text>
  <text x="478" y="218" class="small-text">juez no menciona (ej. «Pedidos en estado EN_REPARTO no</text>
  <text x="478" y="234" class="small-text">admiten cancelación directa»).</text>
  <text x="478" y="256" class="mono" font-size="10.5" fill="#065f46">Impacto en κ: +0.20 a +0.35 | Coste extra por evaluación: $0</text>

  <line x1="654" y1="292" x2="654" y2="314" stroke="#059669" stroke-width="2.5" class="anim-dash" marker-end="url(#arrow-green)"/>

  <rect x="462" y="318" width="384" height="156" class="card-blue"/>
  <text x="478" y="340" class="card-title" fill="#1d4ed8">Palanca 2 · Few-Shot Extraídos de Desacuerdos (train)</text>
  <text x="478" y="360" class="small-text">Selecciona <tspan font-weight="700">3 a 5 casos reales del split de entrenamiento</tspan></text>
  <text x="478" y="376" class="small-text">donde el Juez v1 se equivocó (<tspan class="mono">FP</tspan> y <tspan class="mono">FN</tspan>) e inyéctalos en</text>
  <text x="478" y="392" class="small-text">el prompt del juez con el veredicto humano y su porqué.</text>
  <text x="478" y="414" class="small-text" fill="#b91c1c" font-weight="700">¡Regla Anti-Trampa!: Sacar los ejemplos SOLO de</text>
  <text x="478" y="430" class="small-text" fill="#b91c1c">train/dev y medir la mejora en un test/holdout separado.</text>
  <text x="478" y="454" class="mono" font-size="10.5" fill="#1e40af">Impacto en κ: +0.15 a +0.25 | Coste extra: +300 input tokens</text>

  <line x1="654" y1="474" x2="654" y2="496" stroke="#2563eb" stroke-width="2.5" class="anim-dash" marker-end="url(#arrow-blue)"/>

  <rect x="462" y="500" width="384" height="126" class="card-amber"/>
  <text x="478" y="522" class="card-title" fill="#b45309">Palanca 3 · Subir de Modelo Juez (Último Recurso)</text>
  <text x="478" y="542" class="small-text">Pasar de un modelo <tspan class="mono">mini/flash</tspan> a un modelo <tspan class="mono">pro/sonnet</tspan></text>
  <text x="478" y="558" class="small-text">multiplica el coste entre <tspan font-weight="700">10× y 25×</tspan>. Solo hazlo si tras</text>
  <text x="478" y="574" class="small-text">aplicar las Palancas 1 y 2 el razonamiento sigue fallando.</text>
  <text x="478" y="598" class="mono" font-size="10.5" fill="#78350f">Un modelo mini con Palancas 1+2 bate al modelo grande crudo.</text>

  <!-- Panel 3: Align Evaluator en UI y Cuándo Rendirse -->
  <rect x="880" y="98" width="372" height="544" class="panel"/>
  <text x="898" y="126" class="panel-title">3. Align Evaluator y Cuándo Rendirse</text>

  <rect x="898" y="144" width="336" height="222" class="card-purple"/>
  <text x="914" y="166" class="card-title" fill="#5b21b6">El Flujo «Align Evaluator» en LangSmith</text>
  <text x="914" y="188" class="small-text">1. Creas el evaluador LLM en línea o en Playground.</text>
  <text x="914" y="208" class="small-text">2. Corres sobre una muestra de trazas y corriges</text>
  <text x="914" y="224" class="small-text">   a mano las puntuaciones donde el juez falló.</text>
  <text x="914" y="244" class="small-text">3. Esas correcciones se guardan como un dataset</text>
  <text x="914" y="260" class="small-text">   de alineamiento (<tspan class="mono">inputs + outputs → score_humano</tspan>).</text>
  <text x="914" y="280" class="small-text">4. Al editar el prompt del juez, LangSmith muestra</text>
  <text x="914" y="296" class="small-text">   en vivo cuántos desacuerdos se corrigen y si</text>
  <text x="914" y="312" class="small-text">   rompiste algún caso que antes acertaba.</text>
  <text x="914" y="340" class="mono" font-size="10.5" fill="#4c1d95">Equivalente en SDK: evaluate(juez, data=set_alinear)</text>

  <rect x="898" y="380" width="336" height="246" class="card-red"/>
  <text x="914" y="402" class="card-title" fill="#b91c1c">Cuándo Rendirse y Partir el Evaluador</text>
  <text x="914" y="424" class="small-text">Si tras 3 iteraciones tu juez sigue estancado en</text>
  <text x="914" y="440" class="small-text"><tspan class="mono">κ &lt; 0.55</tspan>, casi siempre estás pidiendo <tspan font-weight="700">demasiadas</tspan></text>
  <text x="914" y="456" class="small-text"><tspan font-weight="700">cosas a la vez</tspan> en un solo prompt:</text>
  <text x="914" y="482" class="small-text">• <tspan font-weight="700">Síntoma:</tspan> El juez mezcla si el dato era exacto</text>
  <text x="914" y="498" class="small-text">  con si el tono fue amable y si citó la fuente.</text>
  <text x="914" y="520" class="small-text" fill="#047857" font-weight="700">• Solución de Ingeniería:</text>
  <text x="914" y="538" class="small-text">  Extrae las reglas objetivas a un evaluador de</text>
  <text x="914" y="554" class="small-text">  código Python y divide el resto en 2 jueces</text>
  <text x="914" y="570" class="small-text">  binarios especializados.</text>

  <!-- Footer -->
  <rect x="28" y="656" width="1224" height="46" class="footer-box"/>
  <text x="48" y="684" class="footer-text"><tspan class="footer-hl">Regla de Ingeniería:</tspan> Separa siempre train (donde eliges los few-shot de desacuerdo) de test (donde mides TPR, TNR y κ de Cohen finales).</text>
  <text x="1232" y="684" text-anchor="end" class="footer-text">Módulo 03 · Notebook 12</text>
</svg>
