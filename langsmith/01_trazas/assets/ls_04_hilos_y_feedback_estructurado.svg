<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <style>
    svg {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
    }
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 24px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #0f172a; }
    .card-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .body-text { font-size: 12px; font-weight: 500; fill: #334155; }
    .small-text { font-size: 11px; font-weight: 500; fill: #475569; }
    .badge-text { font-size: 11px; font-weight: 700; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .card-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
    .card-green { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.5; rx: 8; }
    .card-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
    .card-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
    .card-purple { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 8; }
    .card-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .footer-box { fill: #0f172a; rx: 10; }
    .footer-text { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .footer-hl { fill: #38bdf8; font-weight: 700; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -28; }
    }
    @keyframes pktMoveRight {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(220px); opacity: 0; }
    }
    .anim-dash {
      stroke-dasharray: 8 6;
      animation: flowDash 1.1s linear infinite;
    }
    .anim-pulse {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <!-- Header -->
  <rect x="28" y="18" width="1224" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="48" y="47" class="title">HILOS DE CONVERSACIÓN (THREADS) Y REALIMENTACIÓN ESTRUCTURADA (MÓDULO 04)</text>
  <text x="48" y="69" class="subtitle">Cómo agrupar turnos multi-traza en una conversación y transformar señales de usuario/humano/código en métricas</text>

  <!-- Left Panel: Threads -->
  <rect x="28" y="98" width="590" height="544" class="panel"/>
  <text x="46" y="126" class="panel-title">1. Cómo Agrupa LangSmith una Conversación (Thread)</text>
  <text x="46" y="146" class="small-text">Una conversación de 4 turnos son 4 trazas separadas unidas por una clave</text>
  <text x="46" y="162" class="small-text">exacta en el diccionario <tspan class="mono">metadata</tspan> del run raíz de cada turno:</text>

  <rect x="46" y="178" width="554" height="86" class="card-purple"/>
  <text x="62" y="200" class="card-title" fill="#5b21b6">Las 3 Claves Reconocidas Oficialmente por la Pestaña «Threads»</text>
  <text x="62" y="222" class="mono" font-size="12" fill="#4c1d95">metadata = {"session_id": "..."}  |  {"thread_id": "..."}  |  {"conversation_id": "..."}</text>
  <text x="62" y="246" class="small-text">• En <tspan font-weight="700">LangGraph</tspan> con checkpointer: <tspan class="mono">config={"configurable": {"thread_id": "t-1"}}</tspan> lo inyecta solo.</text>

  <!-- Visual Multi-turn Timeline -->
  <rect x="46" y="278" width="554" height="176" class="card-slate"/>
  <text x="62" y="300" class="card-title">Línea Temporal del Hilo: thread_id = "soporte-904"</text>

  <rect x="64" y="316" width="160" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="76" y="336" class="mono" font-size="10.5" fill="#1d4ed8" font-weight="700">Turno 1 (Trace A)</text>
  <text x="76" y="354" class="small-text">User: «No llega mi pedido»</text>
  <text x="76" y="372" class="small-text">Bot: «¿Me das el nº?»</text>
  <text x="76" y="392" class="mono" font-size="10" fill="#475569">420 tok · $0.0006</text>

  <line x1="224" y1="360" x2="244" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="244" y="316" width="160" height="90" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="256" y="336" class="mono" font-size="10.5" fill="#1d4ed8" font-weight="700">Turno 2 (Trace B)</text>
  <text x="256" y="354" class="small-text">User: «Es el #A-492»</text>
  <text x="256" y="372" class="small-text">Bot: «Está en reparto»</text>
  <text x="256" y="392" class="mono" font-size="10" fill="#475569">1,180 tok · $0.0018</text>

  <line x1="404" y1="360" x2="424" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="424" y="316" width="160" height="90" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="436" y="336" class="mono" font-size="10.5" fill="#b91c1c" font-weight="700">Turno 3 (Trace C)</text>
  <text x="436" y="354" class="small-text">User: «¡Eso dijiste ayer!»</text>
  <text x="436" y="372" class="small-text">Bot: «Disculpa, escalo...»</text>
  <text x="436" y="392" class="mono" font-size="10" fill="#b91c1c">2,310 tok · 👎 score=0</text>

  <text x="64" y="434" class="small-text" fill="#334155">Reconstruir un hilo desde el SDK: <tspan class="mono">client.list_runs(project_name=..., filter='and(eq(is_root, true), eq(metadata_key, "thread_id"), eq(metadata_value, "soporte-904"))')</tspan></text>

  <rect x="46" y="468" width="554" height="158" class="card-amber"/>
  <text x="62" y="490" class="card-title" fill="#b45309">Trampa Clásica: Por Qué un Hilo No Aparece Agrupado</text>
  <text x="62" y="512" class="body-text">1. Pusiste el identificador como <tspan class="mono">tags=["thread:123"]</tspan> en vez de <tspan class="mono">metadata</tspan>.</text>
  <text x="62" y="532" class="body-text">2. Usaste una clave inventada (<tspan class="mono">id_conversacion</tspan>) en vez de <tspan class="mono">thread_id</tspan>.</text>
  <text x="62" y="552" class="body-text">3. Lo inyectaste solo en un span hijo (<tspan class="mono">llm</tspan>) y NO en el <tspan class="mono">root_run</tspan> de la traza.</text>
  <text x="62" y="578" class="small-text" fill="#b45309" font-weight="700">Señal Implícita de Frustración:</text>
  <text x="62" y="596" class="small-text">Aunque el usuario no pulse 👎, un hilo con &gt;4 turnos cortos o reformulaciones</text>
  <text x="62" y="612" class="small-text">repetidas es un fallo implícito detectable con un evaluador de hilo.</text>

  <!-- Right Panel: Feedback Architecture -->
  <rect x="634" y="98" width="618" height="544" class="panel"/>
  <text x="652" y="126" class="panel-title">2. Anatomía del Objeto Feedback y su Puente a Datasets</text>

  <rect x="652" y="144" width="582" height="148" class="card-green"/>
  <text x="668" y="166" class="card-title" fill="#047857">client.create_feedback(run_id, key, score, value, comment, correction)</text>
  <text x="668" y="190" class="small-text">• <tspan class="mono" font-weight="700">key</tspan>: Nombre de la métrica (<tspan class="mono">"pulgar_usuario"</tspan>, <tspan class="mono">"fidelidad"</tspan>, <tspan class="mono">"escalado"</tspan>)</text>
  <text x="668" y="210" class="small-text">• <tspan class="mono" font-weight="700">score</tspan>: Numérico o booleano (<tspan class="mono">0 / 1</tspan> o <tspan class="mono">0.0–1.0</tspan>) → alimenta gráficas y agregados</text>
  <text x="668" y="230" class="small-text">• <tspan class="mono" font-weight="700">value</tspan>: Categoría discreta (<tspan class="mono">"tono_frio"</tspan>, <tspan class="mono">"inventa_politica"</tspan>) → agrupa causas</text>
  <text x="668" y="250" class="small-text" fill="#047857" font-weight="700">• <tspan class="mono">correction</tspan> (¡El Campo de Oro!): <tspan class="mono">{"respuesta": "Lo correcto era..."}</tspan></text>
  <text x="668" y="270" class="small-text">  Al pulsar «Add to Dataset», LangSmith usa <tspan class="mono">correction</tspan> como Ground Truth (<tspan class="mono">outputs</tspan>) en vez</text>
  <text x="668" y="284" class="small-text">  de copiar la salida errónea del modelo.</text>

  <!-- 3 Feedback Sources -->
  <rect x="652" y="306" width="186" height="122" class="card-blue"/>
  <text x="664" y="328" class="card-title" fill="#1d4ed8">source_type = "app"</text>
  <text x="664" y="348" class="small-text">Del usuario final o</text>
  <text x="664" y="364" class="small-text">telemetría de producto</text>
  <text x="664" y="380" class="small-text">(👍/👎, copió respuesta,</text>
  <text x="664" y="396" class="small-text">abrió ticket humano).</text>
  <text x="664" y="416" class="mono" font-size="10" fill="#1e40af">Ruidoso pero real</text>

  <rect x="850" y="306" width="186" height="122" class="card-purple"/>
  <text x="862" y="328" class="card-title" fill="#5b21b6">source_type = "model"</text>
  <text x="862" y="348" class="small-text">Generado por un</text>
  <text x="862" y="364" class="small-text">evaluador automático</text>
  <text x="862" y="380" class="small-text">o Juez LLM en línea</text>
  <text x="862" y="396" class="small-text">sobre una muestra.</text>
  <text x="862" y="416" class="mono" font-size="10" fill="#4c1d95">Escalable y uniforme</text>

  <rect x="1048" y="306" width="186" height="122" class="card-amber"/>
  <text x="1060" y="328" class="card-title" fill="#b45309">source_type = "api"/UI</text>
  <text x="1060" y="348" class="small-text">Anotador experto en</text>
  <text x="1060" y="364" class="small-text">Cola de Anotación</text>
  <text x="1060" y="380" class="small-text">con rúbrica escrita y</text>
  <text x="1060" y="396" class="small-text">campo <tspan class="mono">correction</tspan>.</text>
  <text x="1060" y="416" class="mono" font-size="10" fill="#b45309">Verdad de referencia</text>

  <!-- Presigned Feedback Tokens -->
  <rect x="652" y="442" width="582" height="184" class="card-red"/>
  <text x="668" y="464" class="card-title" fill="#b91c1c">3. Seguridad en el Navegador: Tokens Pre-firmados de Feedback</text>
  <text x="668" y="486" class="body-text">¡NUNCA envíes <tspan class="mono">LANGSMITH_API_KEY</tspan> al frontend React/ móvil para registrar un 👍!</text>
  <text x="668" y="510" class="mono" font-size="11" fill="#0f172a">1. Backend: token = client.create_presigned_feedback_token(run_id, "pulgar")</text>
  <text x="668" y="530" class="mono" font-size="11" fill="#0f172a">2. Backend devuelve al cliente: {"respuesta": "...", "feedback_url": token.url}</text>
  <text x="668" y="550" class="mono" font-size="11" fill="#047857">3. Frontend envía directo: fetch(feedback_url, {score: 1}) # Sin API Key</text>
  <text x="668" y="576" class="small-text">El token pre-firmado solo autoriza escribir ESA clave de feedback sobre ESE <tspan class="mono">run_id</tspan></text>
  <text x="668" y="594" class="small-text">y caduca automáticamente: cero acceso de lectura a tus trazas ni proyectos.</text>

  <!-- Footer -->
  <rect x="28" y="656" width="1224" height="46" class="footer-box"/>
  <text x="48" y="684" class="footer-text"><tspan class="footer-hl">Regla de Ingeniería:</tspan> Inyecta siempre thread_id en el metadata del run raíz y usa correction al anotar fallos para poblar datasets limpios.</text>
  <text x="1232" y="684" text-anchor="end" class="footer-text">Módulo 01 · Notebook 04</text>
</svg>
