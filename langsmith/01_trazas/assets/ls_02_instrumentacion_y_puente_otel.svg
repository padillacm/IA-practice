<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <style>
    svg {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
    }
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 24px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #0f172a; }
    .card-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .body-text { font-size: 12px; font-weight: 500; fill: #334155; }
    .small-text { font-size: 11px; font-weight: 500; fill: #475569; }
    .badge-text { font-size: 11px; font-weight: 700; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .card-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
    .card-green { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.5; rx: 8; }
    .card-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
    .card-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
    .card-purple { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 8; }
    .card-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .footer-box { fill: #0f172a; rx: 10; }
    .footer-text { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .footer-hl { fill: #38bdf8; font-weight: 700; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -28; }
    }
    @keyframes pktMoveRight {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(220px); opacity: 0; }
    }
    .anim-dash {
      stroke-dasharray: 8 6;
      animation: flowDash 1.1s linear infinite;
    }
    .anim-pulse {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <!-- Header -->
  <rect x="28" y="18" width="1224" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="48" y="47" class="title">INSTRUMENTACIÓN REAL: FRONTERAS AUTOMÁTICAS, TRAMPAS ENV Y PUENTE OTEL</text>
  <text x="48" y="69" class="subtitle">Qué traza LangChain solo, cómo envolver SDKs nativos, propagación entre microservicios e interoperabilidad OpenTelemetry</text>

  <!-- Panel 1: Qué sale gratis vs qué se pierde -->
  <rect x="28" y="98" width="400" height="544" class="panel"/>
  <text x="46" y="126" class="panel-title">1. La Frontera de la Auto-Instrumentación</text>

  <rect x="46" y="142" width="364" height="118" class="card-red"/>
  <text x="62" y="164" class="card-title" fill="#b91c1c">Agujero Clásico: Python Puro + SDK Nativo</text>
  <text x="62" y="184" class="small-text">• <tspan class="mono">ChatOpenAI / LangGraph</tspan> → Trazado automático ✅</text>
  <text x="62" y="202" class="small-text">• Función Python normal (<tspan class="mono">def validar_reglas()</tspan>) → Invisible ❌</text>
  <text x="62" y="220" class="small-text">• Cliente directo <tspan class="mono">openai.OpenAI()</tspan> → Invisible ❌</text>
  <text x="62" y="240" class="small-text" fill="#b91c1c">Resultado: trazas huérfanas sin padre y 800 ms «desaparecidos».</text>

  <rect x="46" y="272" width="364" height="136" class="card-green"/>
  <text x="62" y="294" class="card-title" fill="#047857">La Receta Completa (Cero Agujeros)</text>
  <text x="62" y="315" class="mono" font-size="11" fill="#065f46">client = wrap_openai(openai.OpenAI())</text>
  <text x="62" y="335" class="mono" font-size="11" fill="#065f46">@traceable(run_type="chain", name="atender_ticket")</text>
  <text x="62" y="355" class="body-text">1. <tspan class="mono">@traceable</tspan> en la función raíz crea el árbol único.</text>
  <text x="62" y="373" class="body-text">2. <tspan class="mono">wrap_openai / wrap_anthropic</tspan> captura tokens,</text>
  <text x="62" y="391" class="body-text">   latencia, TTFT y modelo como hijo <tspan class="mono">run_type="llm"</tspan>.</text>

  <rect x="46" y="420" width="364" height="206" class="card-amber"/>
  <text x="62" y="442" class="card-title" fill="#b45309">2. Las Dos Trampas de Variables de Entorno</text>
  <text x="62" y="464" class="body-text" font-weight="700">Trampa 1 · Colisión de Prefijos:</text>
  <text x="62" y="482" class="small-text"><tspan class="mono">LANGSMITH_*</tspan> SIEMPRE gana sobre <tspan class="mono">LANGCHAIN_*</tspan>.</text>
  <text x="62" y="499" class="small-text">Si <tspan class="mono">LANGSMITH_TRACING=false</tspan> está en el entorno, poner</text>
  <text x="62" y="515" class="small-text"><tspan class="mono">LANGCHAIN_TRACING_V2=true</tspan> es ignorado en silencio.</text>
  <text x="62" y="540" class="body-text" font-weight="700">Trampa 2 · Caché de Configuración (<tspan class="mono">@lru_cache</tspan>):</text>
  <text x="62" y="558" class="small-text">El SDK cachea <tspan class="mono">get_tracer_project()</tspan> en la primera llamada.</text>
  <text x="62" y="575" class="small-text">Cambiar <tspan class="mono">os.environ["LANGSMITH_PROJECT"]</tspan> a mitad del</text>
  <text x="62" y="592" class="small-text">programa NO surte efecto. Usa <tspan class="mono">tracing_context(project_name=...)</tspan></text>
  <text x="62" y="609" class="small-text">o llama a <tspan class="mono">ls.utils.get_env_var.cache_clear()</tspan>.</text>

  <!-- Panel 2: Trazas distribuidas entre servicios -->
  <rect x="444" y="98" width="400" height="544" class="panel"/>
  <text x="462" y="126" class="panel-title">3. Trazas Distribuidas Entre Microservicios</text>
  <text x="462" y="146" class="small-text">Unir Servicio A (Python) y Servicio B (Node.js / Go / FastAPI)</text>
  <text x="462" y="162" class="small-text">en un único árbol mediante cabeceras HTTP:</text>

  <rect x="462" y="178" width="364" height="92" class="card-blue"/>
  <text x="478" y="200" class="card-title" fill="#1d4ed8">Servicio A (Emisor) — Exporta Contexto</text>
  <text x="478" y="220" class="mono" font-size="11" fill="#1e40af">headers = get_current_run_tree().to_headers()</text>
  <text x="478" y="240" class="small-text">Inyecta dos cabeceras sincronizadas en el <tspan class="mono">requests.post()</tspan>:</text>
  <text x="478" y="257" class="mono" font-size="10.5" fill="#334155">langsmith-trace: &lt;dotted_order&gt; | baggage: ...</text>

  <line x1="644" y1="270" x2="644" y2="306" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="656" y="293" class="mono" font-size="11" fill="#1d4ed8">HTTP POST + headers</text>

  <rect x="462" y="310" width="364" height="104" class="card-purple"/>
  <text x="478" y="332" class="card-title" fill="#5b21b6">Servicio B (Receptor) — Continúa el Árbol</text>
  <text x="478" y="352" class="mono" font-size="11" fill="#4c1d95">with tracing_context(parent=request.headers):</text>
  <text x="478" y="370" class="mono" font-size="11" fill="#4c1d95">    ejecutar_microservicio()</text>
  <text x="478" y="392" class="small-text">Reconstruye <tspan class="mono">trace_id</tspan>, <tspan class="mono">parent_run_id</tspan> y extiende el</text>
  <text x="478" y="407" class="small-text">prefijo <tspan class="mono">dotted_order</tspan> manteniendo un solo árbol global.</text>

  <rect x="462" y="428" width="364" height="198" class="card-slate"/>
  <text x="478" y="450" class="card-title">Etiquetas y Metadatos: Dónde Ponerlos</text>
  <text x="478" y="472" class="small-text">• <tspan font-weight="700">Estáticos (en definición):</tspan> <tspan class="mono">@traceable(tags=["v2"])</tspan></text>
  <text x="478" y="492" class="small-text">• <tspan font-weight="700">Dinámicos por llamada:</tspan> <tspan class="mono">get_current_run_tree().add_tags()</tspan></text>
  <text x="478" y="512" class="small-text">• <tspan font-weight="700">En bloque (heredable):</tspan> <tspan class="mono">with tracing_context(metadata=...):</tspan></text>
  <text x="478" y="538" class="small-text" fill="#0f172a" font-weight="700">Ruteo Dinámico por Entorno / Cliente:</text>
  <text x="478" y="556" class="small-text">Separa <tspan class="mono">prod</tspan>, <tspan class="mono">staging</tspan> y <tspan class="mono">experimentos</tspan> en proyectos</text>
  <text x="478" y="573" class="small-text">distintos; usa <tspan class="mono">metadata={"tenant_id": ...}</tspan> dentro del</text>
  <text x="478" y="590" class="small-text">mismo proyecto para filtrar clientes sin multiplicar proyectos.</text>

  <!-- Panel 3: OpenTelemetry Bidireccional -->
  <rect x="860" y="98" width="392" height="544" class="panel"/>
  <text x="878" y="126" class="panel-title">4. Puente OpenTelemetry en Ambos Sentidos</text>

  <rect x="878" y="146" width="356" height="156" class="card-green"/>
  <text x="894" y="168" class="card-title" fill="#047857">Dirección A: SDK de LangSmith → Stack OTel</text>
  <text x="894" y="188" class="mono" font-size="11" fill="#065f46">LANGSMITH_OTEL_ENABLED = "true"</text>
  <text x="894" y="206" class="mono" font-size="11" fill="#065f46">LANGSMITH_OTEL_ONLY = "true" # sin nube LS</text>
  <text x="894" y="228" class="small-text">Convierte cada <tspan class="mono">@traceable</tspan> en spans OpenTelemetry con</text>
  <text x="894" y="245" class="small-text">convenciones <tspan class="mono">gen_ai.*</tspan> hacia Grafana Tempo / Datadog /</text>
  <text x="894" y="262" class="small-text">Arize Phoenix mediante el <tspan class="mono">TracerProvider</tspan> global.</text>
  <text x="894" y="284" class="small-text" fill="#b91c1c" font-weight="700">¡Regla de Orden!: Registra tu TracerProvider ANTES</text>
  <text x="894" y="298" class="small-text" fill="#b91c1c">de importar o invocar el primer @traceable.</text>

  <rect x="878" y="316" width="356" height="162" class="card-blue"/>
  <text x="894" y="338" class="card-title" fill="#1d4ed8">Dirección B: OTel Genérico → Ingesta OTLP LangSmith</text>
  <text x="894" y="358" class="mono" font-size="10.5" fill="#1e40af">POST /otel/v1/traces (x-api-key + Langsmith-Project)</text>
  <text x="894" y="380" class="small-text">Permite enviar spans desde FastAPI, PostgreSQL o Go hacia</text>
  <text x="894" y="397" class="small-text">LangSmith usando <tspan class="mono">OTLPSpanExporter</tspan> estándar.</text>
  <text x="894" y="420" class="small-text" fill="#b91c1c" font-weight="700">Trampa de Serialización OTLP:</text>
  <text x="894" y="437" class="small-text">Los atributos OTel NO aceptan <tspan class="mono">dict</tspan> anidados arbitrarios;</text>
  <text x="894" y="454" class="small-text">serializa payloads JSON a string o usa claves planas</text>
  <text x="894" y="470" class="mono" font-size="10.5" fill="#334155">gen_ai.prompt.0.content / gen_ai.completion.0.content</text>

  <rect x="878" y="492" width="356" height="134" class="card-purple"/>
  <text x="894" y="514" class="card-title" fill="#5b21b6">Auditoría Automática de Instrumentación</text>
  <text x="894" y="534" class="small-text">Señales de que faltan decoradores en tu árbol:</text>
  <text x="894" y="553" class="small-text">1. <tspan class="mono">gap_ms = root.latency - sum(children.latency) &gt; 200ms</tspan></text>
  <text x="894" y="572" class="small-text">2. Nodos <tspan class="mono">run_type="llm"</tspan> con <tspan class="mono">total_tokens == 0</tspan></text>
  <text x="894" y="591" class="small-text">3. Más de 1 raíz por petición de usuario (trazas partidas).</text>

  <!-- Footer -->
  <rect x="28" y="656" width="1224" height="46" class="footer-box"/>
  <text x="48" y="684" class="footer-text"><tspan class="footer-hl">Regla de Ingeniería:</tspan> Usa tracing_context() para cambios en caliente, envuelve clientes nativos con wrap_openai() y propaga headers entre servicios.</text>
  <text x="1232" y="684" text-anchor="end" class="footer-text">Módulo 01 · Notebook 02</text>
</svg>
