<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="500">
  <style>
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .card-chain { animation: pulseChain 9s infinite; }
    .card-ret   { animation: pulseRet 9s infinite; }
    .card-llm   { animation: pulseLlm 9s infinite; }
    .card-tool  { animation: pulseTool 9s infinite; }
    .card-eval  { animation: pulseEval 9s infinite; }

    .dot-ret  { animation: moveRet 9s infinite; }
    .dot-llm  { animation: moveLlm 9s infinite; }
    .dot-tool { animation: moveTool 9s infinite; }

    @keyframes pulseChain {
      0%, 4%   { opacity: 0.35; }
      8%, 92%  { opacity: 1; }
      96%, 100%{ opacity: 0.35; }
    }
    @keyframes pulseRet {
      0%, 18%  { opacity: 0.3; }
      24%, 92% { opacity: 1; }
      96%, 100%{ opacity: 0.3; }
    }
    @keyframes pulseLlm {
      0%, 38%  { opacity: 0.3; }
      44%, 92% { opacity: 1; }
      96%, 100%{ opacity: 0.3; }
    }
    @keyframes pulseTool {
      0%, 58%  { opacity: 0.3; }
      64%, 92% { opacity: 1; }
      96%, 100%{ opacity: 0.3; }
    }
    @keyframes pulseEval {
      0%, 74%  { opacity: 0.25; }
      80%, 94% { opacity: 1; }
      98%, 100%{ opacity: 0.25; }
    }

    @keyframes moveRet {
      0%, 14%  { opacity: 0; transform: translate(500px, 168px); }
      18%      { opacity: 1; }
      24%      { opacity: 1; transform: translate(185px, 248px); }
      26%, 100%{ opacity: 0; transform: translate(185px, 248px); }
    }
    @keyframes moveLlm {
      0%, 34%  { opacity: 0; transform: translate(500px, 168px); }
      38%      { opacity: 1; }
      44%      { opacity: 1; transform: translate(500px, 248px); }
      46%, 100%{ opacity: 0; transform: translate(500px, 248px); }
    }
    @keyframes moveTool {
      0%, 54%  { opacity: 0; transform: translate(500px, 168px); }
      58%      { opacity: 1; }
      64%      { opacity: 1; transform: translate(815px, 248px); }
      66%, 100%{ opacity: 0; transform: translate(815px, 248px); }
    }
  </style>

  <!-- Clean Light Background matching the course diagrams -->
  <rect width="1000" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Top Header Banner -->
  <rect x="0" y="0" width="1000" height="72" rx="16" fill="#0f172a" />
  <rect x="0" y="50" width="1000" height="22" fill="#0f172a" />
  <text x="36" y="34" font-size="21" font-weight="700" fill="#ffffff">ANIMACIÓN PEDAGÓGICA: CONSTRUCCIÓN DEL RUNTREE Y PRESUPUESTO</text>
  <text x="36" y="57" font-size="14" font-weight="400" fill="#cbd5e1">Paso a paso: cómo tracing_context(enabled="local") arma el árbol y cómo los Jueces LLM multiplican tu cuota</text>

  <!-- Connector Lines -->
  <path d="M 500 168 C 500 208, 185 208, 185 248" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 5" />
  <path d="M 500 168 L 500 248" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 5" />
  <path d="M 500 168 C 500 208, 815 208, 815 248" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 5" />

  <!-- Animated flow dots -->
  <circle r="8" fill="#2563eb" class="dot-ret" />
  <circle r="8" fill="#16a34a" class="dot-llm" />
  <circle r="8" fill="#d97706" class="dot-tool" />

  <!-- ROOT NODE: responder_ticket -->
  <g class="card-chain">
    <rect x="280" y="92" width="440" height="76" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="3" />
    <rect x="300" y="106" width="78" height="26" rx="6" fill="#7c3aed" />
    <text x="339" y="124" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CHAIN</text>
    <text x="392" y="125" font-size="17" font-weight="700" fill="#0f172a" class="mono">responder_ticket(pregunta)</text>
    <text x="300" y="152" font-size="14" font-weight="600" fill="#475569">Profundidad 0  ·  Nodo raíz  ·  Tiempo total: 420 ms</text>
  </g>

  <!-- CHILD 1: recuperar -->
  <g class="card-ret">
    <rect x="30" y="248" width="310" height="92" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
    <rect x="48" y="264" width="100" height="26" rx="6" fill="#2563eb" />
    <text x="98" y="282" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">RETRIEVER</text>
    <text x="160" y="283" font-size="16" font-weight="700" fill="#0f172a" class="mono">1. recuperar()</text>
    <text x="48" y="310" font-size="14" font-weight="600" fill="#334155">Profundidad 1  ·  Latencia: 110 ms</text>
    <text x="48" y="329" font-size="13" font-weight="500" fill="#64748b">Busca contexto en base vectorial</text>
  </g>

  <!-- CHILD 2: redactar -->
  <g class="card-llm">
    <rect x="355" y="248" width="290" height="92" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="3" />
    <rect x="373" y="264" width="64" height="26" rx="6" fill="#16a34a" />
    <text x="405" y="282" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">LLM</text>
    <text x="450" y="283" font-size="16" font-weight="700" fill="#0f172a" class="mono">2. redactar()</text>
    <text x="373" y="310" font-size="14" font-weight="600" fill="#334155">Profundidad 1  ·  Latencia: 280 ms</text>
    <text x="373" y="329" font-size="13" font-weight="500" fill="#64748b">Genera respuesta (1,240 tokens)</text>
  </g>

  <!-- CHILD 3: comprobar_longitud -->
  <g class="card-tool">
    <rect x="660" y="248" width="310" height="92" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="3" />
    <rect x="678" y="264" width="68" height="26" rx="6" fill="#d97706" />
    <text x="712" y="282" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TOOL</text>
    <text x="758" y="283" font-size="15" font-weight="700" fill="#0f172a" class="mono">3. comprobar_long()</text>
    <text x="678" y="310" font-size="14" font-weight="600" fill="#334155">Profundidad 1  ·  Latencia: 30 ms</text>
    <text x="678" y="329" font-size="13" font-weight="500" fill="#64748b">Valida regla (&lt; 500 caracteres)</text>
  </g>

  <!-- STEP 5: BUDGET MULTIPLIER BANNER -->
  <g class="card-eval">
    <rect x="30" y="366" width="940" height="106" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3" />
    <rect x="52" y="384" width="176" height="28" rx="6" fill="#dc2626" />
    <text x="140" y="403" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TRAMPA DE PRESUPUESTO</text>
    <text x="244" y="404" font-size="18" font-weight="700" fill="#7f1d1d" class="mono">50 ejemplos × 3 repeticiones × (1 run + 2 Jueces LLM) = 450 trazas</text>
    <text x="52" y="434" font-size="15" font-weight="600" fill="#991b1b">¡Cuidado! Cada Juez LLM cuenta como OTRA traza raíz separada, no va gratis dentro de la primera.</text>
    <text x="52" y="456" font-size="14" font-weight="500" fill="#b91c1c">Un solo experimento consume el 9 % de las 5.000 trazas/mes del plan gratuito. Usa siempre presupuesto_de_trazas().</text>
  </g>
</svg>
