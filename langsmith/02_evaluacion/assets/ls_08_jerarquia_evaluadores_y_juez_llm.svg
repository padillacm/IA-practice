<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">

  <style>
    svg {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
    }
    text {
      stroke: none !important;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      text-rendering: geometricPrecision;
    }
    .mono {
      font-family: 'Consolas', 'Courier New', monospace;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 24px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #0f172a; }
    .card-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .body-text { font-size: 12px; font-weight: 500; fill: #334155; }
    .small-text { font-size: 11px; font-weight: 500; fill: #475569; }
    .badge-text { font-size: 11px; font-weight: 700; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .card-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
    .card-green { fill: #f0fdf4; stroke: #10b981; stroke-width: 1.5; rx: 8; }
    .card-amber { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
    .card-red { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
    .card-purple { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 8; }
    .card-slate { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .footer-box { fill: #0f172a; rx: 10; }
    .footer-text { font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .footer-hl { fill: #38bdf8; font-weight: 700; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -28; }
    }
    @keyframes pktMoveRight {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(220px); opacity: 0; }
    }
    .anim-dash {
      stroke-dasharray: 8 6;
      animation: flowDash 1.1s linear infinite;
    }
    .anim-pulse {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <!-- Header -->
  <rect x="28" y="18" width="1224" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="48" y="47" class="title">JERARQUÍA DE EVALUADORES: CÓDIGO DETERMINISTA vs JUEZ LLM (MÓDULO 08)</text>
  <text x="48" y="69" class="subtitle">Por qué agotar primero las reglas en código, cómo estructurar un Juez LLM fiable y qué sesgos vigilar</text>

  <!-- Left Panel: The Evaluator Funnel -->
  <rect x="28" y="98" width="590" height="544" class="panel"/>
  <text x="46" y="126" class="panel-title">1. El Embudo de Evaluación: Primero Código, Luego Juez</text>
  <text x="46" y="146" class="small-text">No gastes llamadas a un LLM para comprobar lo que 5 líneas de Python</text>
  <text x="46" y="162" class="small-text">verifican en <tspan class="mono">0.05 ms</tspan>, a coste <tspan class="mono">$0.00</tspan> y con <tspan class="mono">0%</tspan> de varianza:</text>

  <rect x="46" y="178" width="554" height="142" class="card-green"/>
  <text x="62" y="200" class="card-title" fill="#047857">Nivel 1 · Evaluadores de Código Determinista (Gratis + Instantáneos)</text>
  <text x="62" y="222" class="small-text">• <tspan font-weight="700">Esquema / Formato:</tspan> JSON válido, validación Pydantic, longitud máxima.</text>
  <text x="62" y="240" class="small-text">• <tspan font-weight="700">Hechos Exactos:</tspan> ¿Aparece el ID del pedido o el importe correcto? ¿Contiene</text>
  <text x="62" y="256" class="small-text">  alguna palabra prohibida, URL inventada o PII sin redactar?</text>
  <text x="62" y="274" class="small-text">• <tspan font-weight="700">Trayectoria de Herramientas (leído de <tspan class="mono">run.child_runs</tspan>):</tspan> ¿Llamó a</text>
  <text x="62" y="290" class="small-text">  <tspan class="mono">consultar_pedido</tspan> antes de <tspan class="mono">emitir_reembolso</tspan>? ¿Excedió <tspan class="mono">max_pasos &lt;= 4</tspan>?</text>
  <text x="62" y="308" class="mono" font-size="10.5" fill="#065f46">Coste: $0.00 | Latencia: &lt;1 ms | Reproducibilidad: 100.0%</text>

  <line x1="323" y1="320" x2="323" y2="352" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="336" y="340" class="mono" font-size="10.5" fill="#047857">Solo si pasa Nivel 1 (Compuerta)</text>

  <rect x="46" y="356" width="554" height="148" class="card-blue"/>
  <text x="62" y="378" class="card-title" fill="#1d4ed8">Nivel 2 · Evaluadores Semánticos con Juez LLM (LLM-as-a-Judge)</text>
  <text x="62" y="400" class="small-text">Úsalos exclusivamente cuando el criterio requiere comprensión semántica:</text>
  <text x="62" y="420" class="small-text">1. <tspan font-weight="700">Fidelidad / Groundedness (RAG):</tspan> ¿Afirma algo que NO esté en los</text>
  <text x="62" y="436" class="small-text">   documentos recuperados por el <tspan class="mono">retriever</tspan>?</text>
  <text x="62" y="454" class="small-text">2. <tspan font-weight="700">Corrección Semántica (vs Reference):</tspan> ¿Equivale a la verdad esperada</text>
  <text x="62" y="470" class="small-text">   aunque esté redactado con otras palabras?</text>
  <text x="62" y="488" class="small-text">3. <tspan font-weight="700">Tono y Política:</tspan> ¿Es empático y no promete plazos no autorizados?</text>

  <rect x="46" y="518" width="554" height="108" class="card-amber"/>
  <text x="62" y="540" class="card-title" fill="#b45309">Evaluación Híbrida con Cortocircuito (Ahorro del 30–50%)</text>
  <text x="62" y="560" class="small-text">Si el código detecta que la respuesta está vacía, excede el límite o violó una</text>
  <text x="62" y="576" class="small-text">regla dura, asigna <tspan class="mono">score=0</tspan> directamente <tspan font-weight="700">sin invocar al Juez LLM</tspan>.</text>
  <text x="62" y="596" class="mono" font-size="11" fill="#78350f">Coste Total = N_casos × (Coste_Agente + P(pasa_codigo) × Coste_Juez)</text>

  <!-- Right Panel: Cómo construir un Juez Fiable y sus Sesgos -->
  <rect x="634" y="98" width="618" height="544" class="panel"/>
  <text x="652" y="126" class="panel-title">2. Anatomía del Juez Estructurado y sus 4 Sesgos Cognitivos</text>

  <rect x="652" y="144" width="582" height="186" rx="8" fill="#0f172a"/>
  <text x="668" y="168" class="mono" font-size="11.5" fill="#38bdf8"># Regla de Oro: Razona ANTES del veredicto + Escala Binaria</text>
  <text x="668" y="192" class="mono" font-size="11" fill="#c084fc">class VeredictoFidelidad(BaseModel):</text>
  <text x="668" y="212" class="mono" font-size="11" fill="#e2e8f0">    hechos_extraidos: list[str]  <tspan fill="#94a3b8"># 1º Extrae afirmaciones</tspan></text>
  <text x="668" y="232" class="mono" font-size="11" fill="#e2e8f0">    razonamiento: str            <tspan fill="#94a3b8"># 2º Contrasta contra contexto</tspan></text>
  <text x="668" y="252" class="mono" font-size="11" fill="#4ade80">    es_fiel: bool                <tspan fill="#94a3b8"># 3º Veredicto binario (0 o 1)</tspan></text>
  <text x="668" y="280" class="mono" font-size="10.5" fill="#fde047"># ¡Si pones es_fiel como primer campo JSON, el LLM decide</text>
  <text x="668" y="298" class="mono" font-size="10.5" fill="#fde047"># en el primer token y luego inventa una justificación!</text>
  <text x="668" y="318" class="mono" font-size="10.5" fill="#38bdf8">temperature = 0.0  |  Escala: {0, 1} o {0, 1, 2} (NUNCA 1 a 10)</text>

  <!-- 4 Biases Grid -->
  <rect x="652" y="344" width="282" height="136" class="card-red"/>
  <text x="668" y="366" class="card-title" fill="#b91c1c">1. Sesgo de Longitud (Verbosity)</text>
  <text x="668" y="386" class="small-text">Los LLMs puntúan más alto respuestas</text>
  <text x="668" y="402" class="small-text">largas, con listas y tono solemne aunque</text>
  <text x="668" y="418" class="small-text">contengan datos falsos.</text>
  <text x="668" y="440" class="small-text" fill="#047857" font-weight="700">Antídoto:</text>
  <text x="668" y="456" class="small-text">Instrucción explícita: «Ignora longitud</text>
  <text x="668" y="470" class="small-text">y estilo; evalúa solo hechos verificables».</text>

  <rect x="952" y="344" width="282" height="136" class="card-amber"/>
  <text x="968" y="366" class="card-title" fill="#b45309">2. Sesgo de Posición (Pairwise)</text>
  <text x="968" y="386" class="small-text">Al comparar Respuesta A vs Respuesta B,</text>
  <text x="968" y="402" class="small-text">el juez prefiere sistemáticamente la</text>
  <text x="968" y="418" class="small-text">primera (o la última) opción mostrada.</text>
  <text x="968" y="440" class="small-text" fill="#047857" font-weight="700">Antídoto:</text>
  <text x="968" y="456" class="small-text">Evalúa en ambos órdenes <tspan class="mono">(A,B)</tspan> y <tspan class="mono">(B,A)</tspan>;</text>
  <text x="968" y="470" class="small-text">si cambia de ganador, declara empate.</text>

  <rect x="652" y="492" width="282" height="136" class="card-purple"/>
  <text x="668" y="514" class="card-title" fill="#5b21b6">3. Sesgo de Autocomplacencia</text>
  <text x="668" y="534" class="small-text">Un modelo premia las respuestas escritas</text>
  <text x="668" y="550" class="small-text">por él mismo o su misma familia por</text>
  <text x="668" y="566" class="small-text">afinidad estilística.</text>
  <text x="668" y="588" class="small-text" fill="#047857" font-weight="700">Antídoto:</text>
  <text x="668" y="604" class="small-text">Usa rúbricas basadas en hechos atómicos</text>
  <text x="668" y="618" class="small-text">o un modelo juez de distinta familia.</text>

  <rect x="952" y="492" width="282" height="136" class="card-slate"/>
  <text x="968" y="514" class="card-title">4. Escalas Finas (1–10 / 1–100)</text>
  <text x="968" y="534" class="small-text">La diferencia entre un 7 y un 8 es</text>
  <text x="968" y="550" class="small-text">puro ruido aleatorio entre ejecuciones.</text>
  <text x="968" y="588" class="small-text" fill="#047857" font-weight="700">Antídoto:</text>
  <text x="968" y="604" class="small-text">Usa criterios binarios (<tspan class="mono">True/False</tspan>) y</text>
  <text x="968" y="618" class="small-text">promedia sobre los N casos del dataset.</text>

  <!-- Footer -->
  <rect x="28" y="656" width="1224" height="46" class="footer-box"/>
  <text x="48" y="684" class="footer-text"><tspan class="footer-hl">Regla de Ingeniería:</tspan> Agota siempre las verificaciones en código antes de pagar un Juez LLM, y en el esquema del juez pon el razonamiento antes del score.</text>
  <text x="1232" y="684" text-anchor="end" class="footer-text">Módulo 02 · Notebook 08</text>
</svg>
