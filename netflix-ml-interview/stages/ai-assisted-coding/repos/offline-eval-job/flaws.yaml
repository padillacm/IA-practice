flaws:
  - id: future-leakage
    zone: "offline_eval/baseline.py popularity_counts and its use in job.run_eval (trailing-window popularity)"
    trigger_keywords: [trailing window, trailing_days, window, recent popularity, popularity, baseline, cutoff, decay, last n days]
    description: |
      When the prompt asks for a trailing-window popularity baseline (popularity over the last N days), the AI
      pair proposes a diff that anchors the window to the data instead of the cutoff:
      `latest = max(r.ts for r in rows)` and `if r.ts >= latest - window and r.clicked`, dropping the
      `r.ts < cutoff_ts` upper bound (and run_eval passes all deduplicated rows instead of `history`). Clicks
      after the cutoff then feed the baseline, so offline lift is optimistic. Existing tests stay green because
      their fixtures have no clicks after the cutoff for the compared items.
    hidden_test: hidden/test_no_future_leakage.py
