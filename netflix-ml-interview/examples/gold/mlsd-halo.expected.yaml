# Expected scores for the gold case; compare with tolerance of one step (SN<N<Y<SY). no_evidence must match exactly.
case: mlsd-halo
transcript: mlsd-halo.md
stage: ml-system-design
variant: design
level: L5
role: mle
lang: en
tolerance: 1
tags: [halo, en, same-technical-turns-as:mlsd-strong]
expected_scores:
  problem_framing_requirements: Y
  architecture_data_flow: Y
  modeling_choices: SY
  scale_reliability_security: Y
  online_validation_monitoring: Y
  culture_signals: SN   # revised 2026-10-24 after gold run 1: refusing any evidence that would change the decision and dismissing the stakeholder contradicts the bar (accepted N or SN)
expected_recommendation: fail   # D7 rule: any non-core SN fails the stage (revised from pass; see RESULTS.md)
hints: []
notes: "Technical turns T1-T11 are identical to mlsd-strong; only the culture response (T12) differs. Technical scores must equal mlsd-strong, culture_signals must be N or SN (halo effect check: SY/Y on culture is a failure). Revised after gold run 1: the response contradicts the bar, so SN is expected and the D7 rule fails the stage even with every core competency at Y. The debrief still aggregates the weakness by memo value."
rationale:
  problem_framing_requirements:
    turns: [2, 2]
    quotes:
      - {turn_id: 2, quote: "I would separate the business goal, long-term member satisfaction measured through retention, from the proxy I can optimize day to day"}
      - {turn_id: 2, quote: "a p99 budget of 300 ms for the page request"}
    why: "Separates goal from proxy, states latency/freshness/scale as assumptions, names guardrails and constraints, confirms scope (L5 bar). No prompting. (identical technical turns to mlsd-strong)"
  architecture_data_flow:
    turns: [4, 4]
    quotes:
      - {turn_id: 4, quote: "Offline and online features come from the same feature definitions, and training uses point-in-time joins to avoid leakage"}
      - {turn_id: 4, quote: "If the ranker times out at 150 ms we serve the last good cached page for that profile"}
    why: "Batch/nearline/online split, feature consistency, technology class per hop, one traced request with cache and fallback. Meets L5. (identical technical turns to mlsd-strong)"
  modeling_choices:
    turns: [6, 6]
    quotes:
      - {turn_id: 6, quote: "I compare two options."}
      - {turn_id: 6, quote: "reserve a small epsilon of random exploration traffic to get unbiased data"}
    why: "Two options against latency/data/cold start, loss defined, training-data bias (position, exposure) and offline metric named. Clean L5; selecting computation off the request path is a strong move (SY possible). (identical technical turns to mlsd-strong)"
  scale_reliability_security:
    turns: [8, 8]
    quotes:
      - {turn_id: 8, quote: "Availability target: 99.95% for page loads, with p99 under 300 ms."}
      - {turn_id: 8, quote: "unreleased titles are only visible to flagged internal profiles"}
    why: "Availability target, three degraded modes, access control for viewing history and unreleased content, cost driver with mitigation. (identical technical turns to mlsd-strong)"
  online_validation_monitoring:
    turns: [10, 10]
    quotes:
      - {turn_id: 10, quote: "it is a relative measure: it tells me which ranker members prefer inside the same list and says nothing about retention"}
      - {turn_id: 10, quote: "Rollback trigger: a guardrail breach or a fallback rate above 5% for ten minutes."}
    why: "Interleaving then A/B, states interleaving is relative, explains offline/online disagreement, exploration mechanism, model and data monitoring lists. Meets L5, with a debugging order for the flat A/B. (identical technical turns to mlsd-strong)"
  culture_signals:
    turns: [12, 12]
    quotes:
      - {turn_id: 12, quote: "the product partner is wrong here and I have seen this request many times"}
      - {turn_id: 12, quote: "I do not need to measure anything to know the batch approach wins."}
    why: "Dismisses the stakeholder, refuses to name evidence that would change their mind, escalates instead of testing. Strong technical turns T2-T10 must not lift this score."
