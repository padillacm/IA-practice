[project]
name = "mi-agente"
version = "0.1.0"
description = "Agente de soporte desplegable — la aplicación que construye el notebook 18"
requires-python = ">=3.11,<3.14"

dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1.3,<2",
    "langchain-openai>=1.6,<2",
    "langgraph-sdk>=0.4",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mi_agente"]
