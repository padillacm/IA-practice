<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
    <marker id="arr07" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">CREATE_AGENT Y ARQUITECTURA DE MIDDLEWARE EN CEBOLLA (07)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Los 6 puntos de enganche (`before/after_agent`, `before/after_model`, `wrap_model_call`, `wrap_tool_call`) y por qué el orden importa</text>

  <!-- Top Section: The 6 Hook Points & Onion Wrapping Order -->
  <rect x="20" y="90" width="1080" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="116" class="panel-title">1. Los 6 Puntos de Enganche de `AgentMiddleware` (Modelo en Capas de Cebolla)</text>

  <!-- Outer Layer: before_agent / after_agent -->
  <rect x="38" y="130" width="1044" height="214" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="154" class="mono" style="fill:#1e40af;font-weight:700;">Capa Externa (1 vez por invocación):  ① before_agent(state, runtime)  ──────►  ⑥ after_agent(state, runtime)</text>

  <!-- Middle Layer: before_model / after_model (Each ReAct Iteration) -->
  <rect x="68" y="168" width="984" height="162" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="86" y="192" class="mono" style="fill:#5b21b6;font-weight:700;">Bucle por Turno ReAct:  ② before_model(state) [Recorta/Inyecta]  ──────►  ⑤ after_model(state) [Guardarraíl/Valida]</text>

  <!-- Inner Core: wrap_model_call & wrap_tool_call -->
  <rect x="98" y="206" width="445" height="108" rx="8" fill="#0f172a"/>
  <text x="320" y="230" text-anchor="middle" class="card-title" style="fill:#38bdf8;">③ `wrap_model_call(request, handler)`</text>
  <text x="114" y="254" class="mono" style="fill:#4ade80;font-size:11.5px;">• Cambia modelo, prompt o tools al vuelo</text>
  <text x="114" y="274" class="mono" style="fill:#fbbf24;font-size:11.5px;">• Puede reintentar o cachear sin llamar al LLM</text>
  <text x="114" y="294" class="mono" style="fill:#f8fafc;font-size:11.5px;">• Primero de la lista = capa MÁS EXTERNA</text>

  <rect x="576" y="206" width="456" height="108" rx="8" fill="#0f172a"/>
  <text x="804" y="230" text-anchor="middle" class="card-title" style="fill:#4ade80;">④ `wrap_tool_call(request, handler)`</text>
  <text x="592" y="254" class="mono" style="fill:#38bdf8;font-size:11.5px;">• Audita argumentos, mide latencia por tool</text>
  <text x="592" y="274" class="mono" style="fill:#fbbf24;font-size:11.5px;">• Bloquea o pide aprobación humana (HITL)</text>
  <text x="592" y="294" class="mono" style="fill:#f8fafc;font-size:11.5px;">• Redacta PII en la respuesta de la herramienta</text>

  <!-- Bottom Left: Built-in Production Middlewares -->
  <rect x="20" y="375" width="535" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="375" width="535" height="36" rx="12" fill="#dcfce7"/>
  <text x="36" y="398" class="panel-title" style="fill:#166534;">2. Middlewares de Fábrica Listos para Producción</text>

  <text x="36" y="428" class="body">• <tspan class="mono" style="fill:#15803d;">SummarizationMiddleware:</tspan> resume automáticamente el historial al superar N tokens.</text>
  <text x="36" y="456" class="body">• <tspan class="mono" style="fill:#1d4ed8;">ModelFallbackMiddleware:</tspan> conmuta al modelo secundario ante errores 429/5xx.</text>
  <text x="36" y="484" class="body">• <tspan class="mono" style="fill:#6d28d9;">ModelCallLimitMiddleware / ToolCallLimitMiddleware:</tspan> topes duros de gasto.</text>
  <text x="36" y="512" class="body">• <tspan class="mono" style="fill:#b45309;">PIIMiddleware:</tspan> detecta y enmascara datos personales en entradas y salidas.</text>
  <text x="36" y="540" class="body">• <tspan class="mono" style="fill:#dc2626;">HumanInTheLoopMiddleware:</tspan> pausa herramientas críticas con `interrupt()`.</text>
  <text x="36" y="568" class="body">• <tspan class="mono" style="fill:#0f172a;">TodoListMiddleware:</tspan> dota al agente de gestión de plan de tareas estructurado.</text>

  <!-- Bottom Right: Execution Order & response_format -->
  <rect x="570" y="375" width="530" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="375" width="530" height="36" rx="12" fill="#fef3c7"/>
  <text x="586" y="398" class="panel-title" style="fill:#92400e;">3. Regla de Orden (`middleware=[M1, M2, M3]`) y `response_format`</text>

  <rect x="586" y="422" width="498" height="86" rx="8" fill="#0f172a"/>
  <text x="602" y="444" class="mono" style="fill:#38bdf8;"># Si pasas middleware=[Auth, RateLimit, Summarize]:</text>
  <text x="602" y="468" class="mono" style="fill:#4ade80;">Ida (before / wrap entrada):  Auth  →  RateLimit  →  Summarize  →  LLM</text>
  <text x="602" y="490" class="mono" style="fill:#fbbf24;">Vuelta (wrap salida):         LLM   →  Summarize  →  RateLimit  →  Auth</text>

  <text x="586" y="532" class="card-title" style="fill:#0f172a;">Salida Estructurada al Final del Bucle (`response_format=Esquema`):</text>
  <text x="586" y="554" class="body" style="font-size:12px;">El agente razona y llama a todas las herramientas que necesite libremente, y al</text>
  <text x="586" y="574" class="body" style="font-size:12px;">terminar deposita el objeto validado en <tspan class="mono" style="fill:#5b21b6;">result["structured_response"]</tspan>.</text>
</svg>