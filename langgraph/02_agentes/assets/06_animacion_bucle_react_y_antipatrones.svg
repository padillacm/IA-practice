<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="100%">
  <defs>
    <style>
      
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }

      @keyframes reactOrbit {
        0% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes activeGlow {
        0%, 100% { filter: drop-shadow(0 0 2px #2563eb); }
        50% { filter: drop-shadow(0 0 10px #2563eb); }
      }
      .react-flow {
        stroke-dasharray: 10 6;
        animation: reactOrbit 1.6s linear infinite;
      }
      .node-pulse {
        animation: activeGlow 2.4s ease-in-out infinite;
      }
    </style>
    <marker id="arr06" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr06p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr06g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1120" height="580" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">EL BUCLE ReAct CONSTRUIDO A MANO Y LOS 3 ANTI-PATRONES (06 · ANIMACIÓN)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Razonar → Actuar → Observar con presupuesto de pasos (`RemainingSteps`) y por qué ReAct moderno usa `tool_calls` nativos</text>

  <!-- Left Panel: Animated ReAct Loop State Machine -->
  <rect x="20" y="90" width="550" height="415" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="90" width="550" height="38" rx="12" fill="#dbeafe"/>
  <text x="36" y="114" class="panel-title" style="fill:#1e40af;">1. Máquina de Estados del Agente ReAct en Producción</text>

  <!-- START -->
  <rect x="40" y="218" width="76" height="42" rx="21" fill="#0f172a"/>
  <text x="78" y="244" text-anchor="middle" class="badge">START</text>
  <line x1="116" y1="239" x2="152" y2="239" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr06)"/>

  <!-- Node: llamar_modelo -->
  <rect x="156" y="185" width="185" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" class="node-pulse"/>
  <text x="248" y="212" text-anchor="middle" class="card-title" style="fill:#1d4ed8;">Nodo: `llamar_modelo`</text>
  <text x="248" y="234" text-anchor="middle" class="mono" style="font-size:11px;fill:#1e40af;">1. Inyecta SystemPrompt</text>
  <text x="248" y="252" text-anchor="middle" class="mono" style="font-size:11px;fill:#1e40af;">2. Revisa RemainingSteps</text>
  <text x="248" y="270" text-anchor="middle" class="mono" style="font-size:11px;fill:#1e40af;">3. llm_with_tools.invoke</text>

  <!-- Forward edge to tools -->
  <path d="M 341 215 L 405 215" fill="none" stroke="#7c3aed" stroke-width="3" class="react-flow" marker-end="url(#arr06p)"/>
  <text x="373" y="205" text-anchor="middle" class="mono" style="font-size:10.5px;fill:#6d28d9;">tool_calls</text>

  <!-- Node: ToolNode -->
  <rect x="410" y="185" width="142" height="108" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="481" y="215" text-anchor="middle" class="card-title" style="fill:#5b21b6;">Nodo: `tools`</text>
  <text x="481" y="238" text-anchor="middle" class="mono" style="font-size:11px;fill:#6d28d9;">ToolNode(tools)</text>
  <text x="481" y="258" text-anchor="middle" class="body" style="font-size:11px;">Devuelve</text>
  <text x="481" y="274" text-anchor="middle" class="mono" style="font-size:11px;fill:#6d28d9;">ToolMessage</text>

  <!-- Observation feedback loop -->
  <path d="M 481 185 L 481 145 L 248 145 L 248 183" fill="none" stroke="#7c3aed" stroke-width="3" class="react-flow" marker-end="url(#arr06p)"/>
  <text x="365" y="138" text-anchor="middle" class="mono" style="font-size:11px;fill:#5b21b6;">Observación añadida por add_messages (Siguiente giro)</text>

  <!-- Exit to END -->
  <path d="M 248 293 L 248 352 L 405 352" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr06g)"/>
  <text x="320" y="344" text-anchor="middle" class="mono" style="font-size:11px;fill:#15803d;">Sin tool_calls (Respuesta final)</text>

  <rect x="410" y="330" width="142" height="44" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="481" y="357" text-anchor="middle" class="card-title" style="fill:#15803d;">END</text>

  <!-- Guard Box inside Left Panel -->
  <rect x="36" y="395" width="518" height="94" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="52" y="418" class="card-title" style="fill:#92400e;">¿Qué le falta al bucle mínimo de 15 líneas para ir a Producción?</text>
  <text x="52" y="440" class="body" style="font-size:12px;">1. <tspan style="font-weight:700;">Freno suave con `RemainingSteps`:</tspan> si `restantes &lt;= 2`, invoca el LLM <tspan style="font-weight:700;">sin herramientas</tspan></text>
  <text x="52" y="458" class="body" style="font-size:12px;">   para forzar que redacte una respuesta con lo que ya averiguó en vez de explotar.</text>
  <text x="52" y="476" class="body" style="font-size:12px;">2. <tspan style="font-weight:700;">`handle_tool_errors=True`:</tspan> convierte excepciones en `ToolMessage` recuperables.</text>

  <!-- Right Panel: The 3 ReAct Anti-Patterns -->
  <rect x="590" y="90" width="510" height="415" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="590" y="90" width="510" height="38" rx="12" fill="#fee2e2"/>
  <text x="606" y="114" class="panel-title" style="fill:#991b1b;">2. Los 3 Anti-Patrones que Destruyen un Agente ReAct</text>

  <rect x="606" y="142" width="478" height="106" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="622" y="164" class="card-title" style="fill:#991b1b;">❌ Anti-Patrón 1: Parsear "Thought: / Action:" con Regex (2022)</text>
  <text x="622" y="186" class="body" style="font-size:12px;">El paper original de ReAct usaba texto plano porque no existía *tool calling*.</text>
  <text x="622" y="206" class="body" style="font-size:12px;">Hoy es frágil y lento: usa siempre <tspan class="mono" style="fill:#15803d;">model.bind_tools(tools)</tspan> nativo del proveedor.</text>
  <text x="622" y="228" class="mono" style="font-size:11px;fill:#b91c1c;">El modelo devuelve JSON tipado en message.tool_calls sin errores de regex.</text>

  <rect x="606" y="260" width="478" height="106" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="622" y="282" class="card-title" style="fill:#92400e;">❌ Anti-Patrón 2: Darle 40 Herramientas Solapadas al Mismo Agente</text>
  <text x="622" y="304" class="body" style="font-size:12px;">Por encima de ~15 herramientas, la precisión de selección cae y los esquemas</text>
  <text x="622" y="324" class="body" style="font-size:12px;">consumen miles de tokens en cada paso. <tspan style="font-weight:700;fill:#15803d;">Solución:</tspan> agrupa herramientas o</text>
  <text x="622" y="344" class="body" style="font-size:12px;">filtra dinámicamente las herramientas activas en el middleware (<tspan class="mono">wrap_model_call</tspan>).</text>

  <rect x="606" y="378" width="478" height="110" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="622" y="400" class="card-title" style="fill:#5b21b6;">❌ Anti-Patrón 3: Usar un Agente ReAct para un Flujo Fijo de 3 Pasos</text>
  <text x="622" y="422" class="body" style="font-size:12px;">Si siempre debes hacer <tspan class="mono">Extraer → Validar → Guardar</tspan>, un bucle ReAct paga</text>
  <text x="622" y="442" class="body" style="font-size:12px;">el triple de latencia para que el LLM «decida» lo obvio. <tspan style="font-weight:700;fill:#5b21b6;">Solución:</tspan> usa nodos</text>
  <text x="622" y="462" class="body" style="font-size:12px;">unidos por aristas fijas y deja ReAct solo para el subgrafo de investigación.</text>

  <!-- Footer -->
  <rect x="20" y="520" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="547" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">create_agent (LangChain 1.x) compila exactamente este mismo StateGraph bajo el capó, añadiendo los 6 puntos de enganche de Middleware.</text>
</svg>