<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
    <marker id="arr13m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr13p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr13b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">ARQUITECTURAS MULTI-AGENTE EN LANGGRAPH: LOS 4 PATRONES (13)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Subagentes como Herramientas vs. Supervisor vs. Enjambre (Swarm Handoffs) vs. Pipeline/Grafo Fijo, y qué contexto compartir</text>

  <!-- 2x2 Grid of the 4 Multi-Agent Patterns -->
  <!-- Card 1: Subagents as Tools -->
  <rect x="20" y="90" width="535" height="225" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="20" y="90" width="535" height="36" rx="12" fill="#2563eb"/>
  <text x="36" y="113" class="badge" style="font-size:13.5px;">1. Subagentes como Herramientas (Tool-Calling Supervisor)</text>
  <text x="36" y="144" class="body">El agente principal llama a `@tool def consultar_experto_sql(pregunta: str)`:</text>
  <rect x="36" y="156" width="503" height="84" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="50" y="178" class="mono" style="fill:#1e40af;">Agente Principal ──► ToolCall("experto_sql", q) ──► Subgrafo Aislado</text>
  <text x="50" y="200" class="mono" style="fill:#15803d;">                 ◄── ToolMessage(resumen_limpio) ◄──</text>
  <text x="50" y="224" class="body" style="font-size:11.5px;">✅ <tspan style="font-weight:700;">Ventaja:</tspan> El subagente corre con contexto limpio y solo devuelve la respuesta final.</text>
  <text x="36" y="264" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Cuándo usarlo:</tspan> Cuando un coordinador sigue al mando de toda la conversación</text>
  <text x="36" y="282" class="body" style="font-size:12px;">  y delega subtareas autocontenidas (pueden incluso correr en paralelo).</text>

  <!-- Card 2: Supervisor Router Node -->
  <rect x="570" y="90" width="530" height="225" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="570" y="90" width="530" height="36" rx="12" fill="#7c3aed"/>
  <text x="586" y="113" class="badge" style="font-size:13.5px;">2. Patrón Supervisor en el Grafo (`Command(goto=agente)`)</text>
  <text x="586" y="144" class="body">Un nodo `supervisor` decide con salida estructurada qué especialista toma el turno:</text>
  <rect x="586" y="156" width="498" height="84" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="600" y="178" class="mono" style="fill:#5b21b6;">Supervisor ──► Command(goto="investigador" | "redactor" | END)</text>
  <text x="600" y="200" class="mono" style="fill:#6d28d9;">Cada especialista termina su turno y vuelve siempre al Supervisor.</text>
  <text x="600" y="224" class="body" style="font-size:11.5px;">✅ <tspan style="font-weight:700;">Ventaja:</tspan> Control centralizado de la secuencia y fácil inspección de estado.</text>
  <text x="586" y="264" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Coste oculto:</tspan> Cada salto pasa por el LLM del supervisor (+1 llamada LLM por transición).</text>

  <!-- Card 3: Swarm / Direct Handoffs -->
  <rect x="20" y="330" width="535" height="225" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="20" y="330" width="535" height="36" rx="12" fill="#059669"/>
  <text x="36" y="353" class="badge" style="font-size:13.5px;">3. Patrón Enjambre (Swarm / Handoffs Directos entre Pares)</text>
  <text x="36" y="384" class="body">No hay jefe central: el agente activo transfiere la sesión con una herramienta de handoff:</text>
  <rect x="36" y="396" width="503" height="92" rx="6" fill="#0f172a"/>
  <text x="50" y="418" class="mono" style="fill:#4ade80;">@tool def transferir_a_reembolsos(motivo: str, rt: ToolRuntime) -&gt; Command:</text>
  <text x="50" y="438" class="mono" style="fill:#fbbf24;">    return Command(graph=Command.PARENT, goto="agente_reembolsos",</text>
  <text x="50" y="458" class="mono" style="fill:#38bdf8;">                   update={"agente_activo": "agente_reembolsos", ...})</text>
  <text x="36" y="512" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Cuándo usarlo:</tspan> Atención al cliente multi-departamento donde el especialista</text>
  <text x="36" y="530" class="body" style="font-size:12px;">  habla directamente con el usuario durante varios turnos seguidos.</text>

  <!-- Card 4: Context Sharing Decision -->
  <rect x="570" y="330" width="530" height="225" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="570" y="330" width="530" height="36" rx="12" fill="#d97706"/>
  <text x="586" y="353" class="badge" style="font-size:13.5px;">4. La Decisión Crítica: ¿Cuánto Contexto Compartir entre Agentes?</text>

  <rect x="586" y="380" width="498" height="74" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="600" y="402" class="card-title" style="fill:#991b1b;font-size:13px;">Opción A · Compartir toda la lista `messages` (Pizarra Única)</text>
  <text x="600" y="422" class="body" style="font-size:11.5px;">Todos ven todos los `ToolMessage` de los demás → <tspan style="font-weight:700;fill:#dc2626;">explosión de tokens y distracción</tspan>.</text>
  <text x="600" y="440" class="body" style="font-size:11.5px;">Solo viable en equipos pequeños de 2 agentes con pocas herramientas.</text>

  <rect x="586" y="464" width="498" height="76" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="600" y="486" class="card-title" style="fill:#166534;font-size:13px;">Opción B · Pasar Solo el Briefing y Devolver Solo el Entregable (Recomendado)</text>
  <text x="600" y="506" class="body" style="font-size:11.5px;">Cada especialista trabaja en su canal privado y deposita un objeto estructurado</text>
  <text x="600" y="524" class="body" style="font-size:11.5px;">(`hallazgos_sql`, `borrador`) en el estado del grafo padre.</text>

  <!-- Bottom Banner -->
  <rect x="20" y="568" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="595" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Divide en múltiples agentes SOLO cuando los prompts o las herramientas (>15) se estorban en un solo agente.</text>
</svg>