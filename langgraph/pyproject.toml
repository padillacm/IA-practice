[project]
name = "curso-langgraph"
version = "1.0.0"
description = "Curso de LangGraph en español, de cero al p99: 34 notebooks verificados contra LangGraph 1.2 / LangChain 1.3"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# --------------------------------------------------------------------------------------
# Lo imprescindible para seguir el curso. Todo lo que se importa desde un notebook sin
# guardas está aquí: si `uv sync` termina, los 34 notebooks se ejecutan.
# --------------------------------------------------------------------------------------
dependencies = [
    # --- núcleo ---------------------------------------------------------------
    "langgraph>=1.2,<2",
    "langchain>=1.3,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",

    # --- persistencia ---------------------------------------------------------
    "langgraph-checkpoint>=4.2",        # interfaz base + InMemorySaver
    "langgraph-checkpoint-sqlite>=3.1", # SqliteSaver (módulo 3)

    # --- RAG (módulo 5) -------------------------------------------------------
    "langchain-text-splitters>=1.0",
    "rank-bm25>=0.2",                   # recuperación léxica del híbrido del módulo 5

    # --- servidor propio (notebook 24) ---------------------------------------
    "starlette>=0.41",                  # FastAPI lleva esto por dentro
    "httpx>=0.27",                      # TestClient de Starlette
    "uvicorn>=0.30",

    # --- integración con el ecosistema (notebooks 20 y 26) --------------------
    "langchain-mcp-adapters>=0.3",
    "langgraph-sdk>=0.4",               # cliente y `Auth` (notebooks 18 y 25)

    # --- evaluación y observabilidad -----------------------------------------
    "langsmith>=0.11",

    # --- utilidades de notebook ----------------------------------------------
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "python-dotenv>=1.0",
    "requests>=2.32",                   # cliente HTTP del ejercicio 18.2
    "pandas>=2.2",
    "matplotlib>=3.9",
    "grandalf>=0.8",                    # dibujo ASCII de grafos sin salir a internet
]

[project.urls]
Repositorio = "https://github.com/padillacm/IA-practice"

# --------------------------------------------------------------------------------------
# Grupos opcionales. `uv sync` instala `dev` por defecto; los demás van con `--group`.
# --------------------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

# Servidor de desarrollo y LangGraph Studio (notebooks 18, 25 y 26).
#   uv sync --group despliegue
despliegue = [
    "langgraph-cli[inmem]>=0.4",
]

# Checkpointer y store sobre Postgres (notebook 23).
#   uv sync --group postgres
postgres = [
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
]

# NOTA deliberada: NO usamos `langchain-community`. Está en proceso de retirada y sus
# integraciones se están moviendo a paquetes propios; el curso implementa el recuperador
# léxico directamente sobre `rank-bm25`, que además se entiende mejor.

[tool.uv]
# Los grupos son excluyentes entre sí solo si hay conflictos; aquí conviven sin problema.
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # las tablas y los comentarios largos de los notebooks
