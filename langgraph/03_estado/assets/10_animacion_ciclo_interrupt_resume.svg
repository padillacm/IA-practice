<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="100%">
  <defs>
    <style>
      
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }

      @keyframes pausePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #f59e0b); }
        50% { transform: scale(1.03); filter: drop-shadow(0 0 10px #f59e0b); }
      }
      @keyframes resumeFlow {
        0% { stroke-dashoffset: 140; }
        100% { stroke-dashoffset: 0; }
      }
      .pause-badge {
        transform-box: fill-box;
        transform-origin: center;
        animation: pausePulse 2.2s ease-in-out infinite;
      }
      .resume-line {
        stroke-dasharray: 9 5;
        animation: resumeFlow 1.8s linear infinite;
      }
    </style>
    <marker id="arr10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr10g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1120" height="580" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">HUMAN-IN-THE-LOOP: CICLO DE INTERRUPT(), REANUDACIÓN Y RE-EJECUCIÓN (10 · ANIMACIÓN)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Cómo pausar el grafo sin bloquear hilos, reanudar horas después con `Command(resume=...)` y evitar efectos secundarios duplicados</text>

  <!-- Top Section: Animated Interrupt -> Persist -> Human -> Command(resume) Lifecycle -->
  <rect x="20" y="90" width="1080" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="116" class="panel-title">1. Ciclo de Vida de `interrupt(payload)` y `Command(resume=valor)`</text>

  <!-- Step 1: Node calls interrupt -->
  <rect x="38" y="132" width="235" height="148" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="156" text-anchor="middle" class="card-title" style="fill:#1e40af;">1. Primera Ejecución</text>
  <text x="52" y="180" class="mono" style="font-size:11px;fill:#1d4ed8;">decision = interrupt({</text>
  <text x="52" y="198" class="mono" style="font-size:11px;fill:#1d4ed8;">  "accion": "reembolsar",</text>
  <text x="52" y="216" text-anchor="middle" class="mono" style="font-size:11px;fill:#1d4ed8;">  "importe": 250</text>
  <text x="52" y="232" class="mono" style="font-size:11px;fill:#1d4ed8;">})</text>
  <text x="52" y="256" class="body" style="font-size:11px;">Lanza `GraphInterrupt` interna y congela el hilo en el Checkpointer.</text>

  <line x1="273" y1="206" x2="305" y2="206" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr10)"/>

  <!-- Step 2: Paused in DB (0 CPU used) -->
  <rect x="310" y="132" width="235" height="148" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5" class="pause-badge"/>
  <text x="427" y="156" text-anchor="middle" class="card-title" style="fill:#b45309;">⏸️ 2. Hilo en Pausa (BD)</text>
  <text x="324" y="180" class="mono" style="font-size:11px;fill:#92400e;">result["__interrupt__"]</text>
  <text x="324" y="202" class="body" style="font-size:11.5px;">• <tspan style="font-weight:700;">0% CPU / 0 RAM:</tspan> el servidor</text>
  <text x="324" y="220" class="body" style="font-size:11.5px;">  puede reiniciarse.</text>
  <text x="324" y="242" class="body" style="font-size:11.5px;">• El humano revisa en la UI</text>
  <text x="324" y="260" class="body" style="font-size:11.5px;">  minutos o días después.</text>

  <line x1="545" y1="206" x2="577" y2="206" stroke="#16a34a" stroke-width="3" class="resume-line" marker-end="url(#arr10g)"/>

  <!-- Step 3: Resume with Command(resume=...) -->
  <rect x="582" y="132" width="245" height="148" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="704" y="156" text-anchor="middle" class="card-title" style="fill:#065f46;">▶️ 3. Reanudación</text>
  <text x="596" y="180" class="mono" style="font-size:11px;fill:#047857;">graph.invoke(</text>
  <text x="596" y="198" class="mono" style="font-size:11px;fill:#047857;">  Command(resume="aprobado"),</text>
  <text x="596" y="216" class="mono" style="fill:#047857;font-size:11px;">  config=thread_cfg</text>
  <text x="596" y="232" class="mono" style="font-size:11px;fill:#047857;">)</text>
  <text x="596" y="256" class="body" style="font-size:11px;">El valor `"aprobado"` se convierte en el retorno de `interrupt(...)`.</text>

  <line x1="827" y1="206" x2="859" y2="206" stroke="#16a34a" stroke-width="3" class="resume-line" marker-end="url(#arr10g)"/>

  <!-- Step 4: The 4 Canonical HITL Patterns -->
  <rect x="864" y="132" width="218" height="148" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="973" y="156" text-anchor="middle" class="card-title" style="fill:#5b21b6;">4. Los 4 Patrones HITL</text>
  <text x="878" y="180" class="body" style="font-size:11.5px;">1. <tspan style="font-weight:700;">Aprobar / Rechazar</tspan></text>
  <text x="878" y="202" class="body" style="font-size:11.5px;">2. <tspan style="font-weight:700;">Editar argumentos</tspan></text>
  <text x="878" y="224" class="body" style="font-size:11.5px;">3. <tspan style="font-weight:700;">Pedir dato faltante</tspan></text>
  <text x="878" y="246" class="body" style="font-size:11.5px;">4. <tspan style="font-weight:700;">Revisar borrador</tspan></text>

  <!-- Bottom Section: The Critical Trap — The Node Re-Executes From Line 1! -->
  <rect x="20" y="314" width="1080" height="192" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="340" class="panel-title" style="fill:#991b1b;">2. ¡La Trampa #1 de `interrupt()`! Al Reanudar, el Nodo se Re-Ejecuta desde su Primera Línea</text>

  <!-- Wrong Code -->
  <rect x="38" y="354" width="510" height="136" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="54" y="376" class="card-title" style="fill:#991b1b;">❌ INCORRECTO: Efecto secundario ANTES de `interrupt()`</text>
  <text x="54" y="400" class="mono" style="font-size:11.5px;fill:#b91c1c;">def nodo_pago(state: State):</text>
  <text x="54" y="420" class="mono" style="font-size:11.5px;fill:#b91c1c;">    enviar_email_aviso()          # ¡Se ejecuta al pausar Y OTRA VEZ al reanudar!</text>
  <text x="54" y="440" class="mono" style="font-size:11.5px;fill:#b91c1c;">    ok = interrupt("¿Cobrar?")</text>
  <text x="54" y="460" class="mono" style="font-size:11.5px;fill:#b91c1c;">    if ok: cobrar_tarjeta()</text>
  <text x="54" y="480" class="body" style="font-size:11.5px;fill:#7f1d1d;">Python no congela el stack frame; vuelve a llamar a `nodo_pago(state)` desde arriba.</text>

  <!-- Right Code -->
  <rect x="568" y="354" width="514" height="136" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="584" y="376" class="card-title" style="fill:#166534;">✅ CORRECTO: Pon `interrupt()` al principio o separa en dos nodos</text>
  <text x="584" y="400" class="mono" style="font-size:11.5px;fill:#15803d;">def nodo_aprobacion(state: State):</text>
  <text x="584" y="420" class="mono" style="font-size:11.5px;fill:#15803d;">    ok = interrupt("¿Cobrar?")    # 1º Pausa sin efectos secundarios previos</text>
  <text x="584" y="440" class="mono" style="font-size:11.5px;fill:#15803d;">    if ok:</text>
  <text x="584" y="460" class="mono" style="font-size:11.5px;fill:#15803d;">        enviar_email_aviso()      # 2º Solo corre UNA vez tras aprobarse</text>
  <text x="584" y="480" class="mono" style="font-size:11.5px;fill:#15803d;">        cobrar_tarjeta()</text>

  <!-- Footer -->
  <rect x="20" y="520" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="547" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Si hay varios interrupt() en el mismo nodo, su orden debe ser 100% determinista porque LangGraph los empareja por índice posicional.</text>
</svg>