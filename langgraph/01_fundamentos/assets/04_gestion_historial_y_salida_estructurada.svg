<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">GESTIÓN DEL HISTORIAL DE MENSAJES Y SALIDA ESTRUCTURADA (04)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Las 3 estrategias contra la inflación cuadrática de tokens (`trim_messages`, `RemoveMessage`, resumen) y `with_structured_output`</text>

  <!-- Left Panel: 3 Strategies for Message History Management -->
  <rect x="20" y="90" width="535" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="90" width="535" height="38" rx="12" fill="#dbeafe"/>
  <text x="36" y="114" class="panel-title" style="fill:#1e40af;">1. Tres Estrategias para Acotar el Historial de Mensajes</text>

  <!-- Strategy A: trim_messages -->
  <rect x="36" y="140" width="503" height="126" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="50" y="150" width="225" height="24" rx="5" fill="#2563eb"/>
  <text x="162" y="166" text-anchor="middle" class="badge">A. Ventana al Vuelo (trim_messages)</text>
  <text x="50" y="190" class="body">• <tspan style="font-weight:700;">NO borra del checkpoint:</tspan> recorta solo la vista que se envía al LLM en este turno.</text>
  <text x="50" y="212" class="mono" style="font-size:11.5px;fill:#1d4ed8;">trim_messages(msgs, max_tokens=2000, strategy="last",</text>
  <text x="50" y="230" class="mono" style="font-size:11.5px;fill:#1d4ed8;">              include_system=True, start_on="human")</text>
  <text x="50" y="252" class="body" style="font-size:11.5px;fill:#1e3a8a;">⚠️ <tspan class="mono">start_on="human"</tspan> es vital: los proveedores rechazan historiales que empiezan con un <tspan class="mono">ToolMessage</tspan> huérfano.</text>

  <!-- Strategy B: RemoveMessage -->
  <rect x="36" y="278" width="503" height="118" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="50" y="288" width="235" height="24" rx="5" fill="#dc2626"/>
  <text x="167" y="304" text-anchor="middle" class="badge">B. Poda Permanente (RemoveMessage)</text>
  <text x="50" y="328" class="body">• <tspan style="font-weight:700;">SÍ borra del estado persistido:</tspan> reduce el tamaño del checkpoint en base de datos.</text>
  <text x="50" y="350" class="mono" style="font-size:11.5px;fill:#b91c1c;">return {"messages": [RemoveMessage(id=m.id) for m in antiguos]}</text>
  <text x="50" y="374" class="body" style="font-size:11.5px;fill:#7f1d1d;">Útil para eliminar <tspan class="mono">ToolMessage</tspan> gigantes (JSONs crudos) una vez que el agente ya extrajo el dato.</text>

  <!-- Strategy C: Rolling Summary -->
  <rect x="36" y="408" width="503" height="132" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="50" y="418" width="245" height="24" rx="5" fill="#059669"/>
  <text x="172" y="434" text-anchor="middle" class="badge">C. Resumen Acumulativo + Poda (Híbrido)</text>
  <text x="50" y="458" class="body">• Cuando <tspan class="mono">len(messages) &gt; N</tspan>, un nodo sintetiza los turnos antiguos en <tspan class="mono">state["resumen"]</tspan></text>
  <text x="50" y="478" class="body">  y emite <tspan class="mono">RemoveMessage</tspan> sobre los mensajes ya resumidos.</text>
  <text x="50" y="502" class="mono" style="font-size:11.5px;fill:#047857;">Coste por turno = O(1) constante en conversaciones de 100+ mensajes.</text>
  <text x="50" y="522" class="body" style="font-size:11.5px;">Conserva la memoria semántica de la sesión sin pagar todos los tokens históricos.</text>

  <!-- Right Panel: Structured Output & Dynamic Model Routing -->
  <rect x="570" y="90" width="530" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="90" width="530" height="38" rx="12" fill="#ede9fe"/>
  <text x="586" y="114" class="panel-title" style="fill:#5b21b6;">2. Salida Estructurada (`with_structured_output`) y Enrutamiento</text>

  <rect x="586" y="140" width="498" height="205" rx="8" fill="#0f172a"/>
  <text x="602" y="164" class="card-title" style="fill:#38bdf8;">Patrón `include_raw=True` para no perder Tokens ni Metadatos:</text>
  <text x="602" y="190" class="mono" style="fill:#f8fafc;">llm_struct = llm.with_structured_output(Clasificacion, include_raw=True)</text>
  <text x="602" y="212" class="mono" style="fill:#4ade80;">res = llm_struct.invoke(messages)</text>
  <text x="602" y="236" class="mono" style="fill:#fbbf24;"># res["parsed"]        → Instancia validada de Clasificacion (o None)</text>
  <text x="602" y="256" class="mono" style="fill:#38bdf8;"># res["raw"]           → AIMessage original con usage_metadata (tokens)</text>
  <text x="602" y="276" class="mono" style="fill:#f87171;"># res["parsing_error"] → Excepción exacta si el modelo rompió el esquema</text>
  <rect x="602" y="290" width="466" height="42" rx="6" fill="#1e293b"/>
  <text x="614" y="315" class="body" style="fill:#e2e8f0;font-size:12px;">💡 Si <tspan class="mono" style="fill:#f87171;">parsing_error</tspan> no es None, una arista condicional reintenta enviando el error al LLM.</text>

  <!-- Dynamic Model Routing -->
  <rect x="586" y="358" width="498" height="182" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="602" y="382" class="card-title">Enrutamiento de Modelos por Complejidad (Ahorro del 70% en Coste):</text>
  <rect x="602" y="396" width="225" height="78" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="714" y="418" text-anchor="middle" class="card-title" style="fill:#047857;font-size:13px;">Nodos de Triaje / Extracción</text>
  <text x="714" y="438" text-anchor="middle" class="mono" style="font-size:11.5px;fill:#065f46;">Modelo Rápido / Mini</text>
  <text x="714" y="458" text-anchor="middle" class="body" style="font-size:11px;">Latencia ~300 ms · Coste 0.1×</text>

  <rect x="843" y="396" width="225" height="78" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="955" y="418" text-anchor="middle" class="card-title" style="fill:#5b21b6;font-size:13px;">Nodos de Síntesis / Código</text>
  <text x="955" y="438" text-anchor="middle" class="mono" style="font-size:11.5px;fill:#6d28d9;">Modelo Frontera / Pro</text>
  <text x="955" y="458" text-anchor="middle" class="body" style="font-size:11px;">Solo cuando el ticket lo exige</text>

  <text x="602" y="498" class="body" style="font-size:12px;">• Selecciona el modelo en tiempo de ejecución leyendo <tspan class="mono">runtime.context.modelo</tspan> o</text>
  <text x="602" y="518" class="body" style="font-size:12px;">  la dificultad clasificada en el primer nodo del grafo.</text>

  <!-- Bottom Banner -->
  <rect x="20" y="568" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="595" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Regla de Mensajes: Nunca cortes un par (AIMessage con tool_calls, ToolMessage); si los separas, la API del LLM dará error 400.</text>
</svg>