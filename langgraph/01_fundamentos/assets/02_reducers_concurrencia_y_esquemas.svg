<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">REDUCERS, CONCURRENCIA Y ESQUEMAS EN LANGGRAPH (02)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Cómo fusionar escrituras paralelas sin perder datos (`Annotated[T, reducer]`), `add_messages` y esquemas Input / Output / Private</text>

  <!-- Left Panel: LastValue vs BinaryOperatorAggregate + add_messages -->
  <rect x="20" y="90" width="535" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="90" width="535" height="38" rx="12" fill="#fee2e2"/>
  <text x="36" y="114" class="panel-title" style="fill:#991b1b;">1. Concurrencia de Canales y el Reducer `add_messages`</text>

  <!-- Collision vs Reducer -->
  <rect x="36" y="140" width="503" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="164" class="card-title">¿Qué ocurre cuando Nodo A y Nodo B corren en el mismo Super-Paso?</text>

  <rect x="52" y="176" width="471" height="58" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="64" y="196" class="mono" style="fill:#b91c1c;">hallazgos: list[str]  # Canal por defecto = LastValue</text>
  <text x="64" y="216" class="body" style="font-size:12px;fill:#7f1d1d;">❌ Lanza <tspan class="mono">InvalidUpdateError</tspan>: dos nodos no pueden sobrescribir un <tspan class="mono">LastValue</tspan> a la vez.</text>

  <rect x="52" y="242" width="471" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="64" y="262" class="mono" style="fill:#15803d;">hallazgos: Annotated[list[str], operator.add]  # BinaryOperatorAggregate</text>
  <text x="64" y="282" class="body" style="font-size:12px;fill:#14532d;">✅ Fusiona <tspan class="mono">reducer(estado_actual, nuevo_valor)</tspan> en orden determinista.</text>

  <!-- add_messages Deep Dive -->
  <rect x="36" y="328" width="503" height="212" rx="8" fill="#0f172a"/>
  <text x="52" y="352" class="card-title" style="fill:#38bdf8;">Por qué `add_messages` es mucho más listo que `operator.add`:</text>
  <text x="52" y="380" class="mono" style="fill:#4ade80;">1. Si el mensaje trae un ID nuevo       → Lo añade al final (Append)</text>
  <text x="52" y="404" class="mono" style="fill:#fbbf24;">2. Si trae el MISMO id que uno existente → Lo REEMPLAZA in-place (Upsert)</text>
  <text x="52" y="428" class="mono" style="fill:#f87171;">3. Si envías RemoveMessage(id=msg.id)    → Lo BORRA del historial</text>
  <text x="52" y="452" class="mono" style="fill:#c084fc;">4. Si envías RemoveMessage(REMOVE_ALL)   → Vacía toda la lista</text>

  <rect x="52" y="468" width="471" height="58" rx="6" fill="#1e293b"/>
  <text x="64" y="488" class="body" style="fill:#e2e8f0;font-size:12px;">⚠️ <tspan style="font-weight:700;fill:#fbbf24;">Trampa con `operator.add`:</tspan> si reintentas o haces *time-travel*, `operator.add`</text>
  <text x="64" y="508" class="body" style="fill:#e2e8f0;font-size:12px;">duplica elementos; para listas de objetos en producción usa un reducer deduplicador por ID.</text>

  <!-- Right Panel: Multi-Schema Architecture (Input / Internal / Private / Output) -->
  <rect x="570" y="90" width="530" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="90" width="530" height="38" rx="12" fill="#ede9fe"/>
  <text x="586" y="114" class="panel-title" style="fill:#5b21b6;">2. Encapsulación: Esquemas Input, Output, Interno y Privado</text>

  <text x="586" y="146" class="body">No expongas tu pizarra interna como API pública del grafo:</text>
  <rect x="586" y="158" width="498" height="34" rx="6" fill="#0f172a"/>
  <text x="835" y="180" text-anchor="middle" class="mono" style="fill:#38bdf8;font-size:11.5px;">StateGraph(OverallState, input_schema=InputState, output_schema=OutputState)</text>

  <!-- 4 Schema Cards -->
  <rect x="586" y="206" width="242" height="145" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="707" y="230" text-anchor="middle" class="card-title" style="fill:#1e40af;">1. `InputState` (Entrada)</text>
  <text x="600" y="254" class="mono" style="font-size:11.5px;fill:#1d4ed8;"> pregunta: str</text>
  <text x="600" y="280" class="body" style="font-size:11.5px;">• Filtra qué campos acepta</text>
  <text x="600" y="298" class="body" style="font-size:11.5px;">  `graph.invoke(...)`.</text>
  <text x="600" y="318" class="body" style="font-size:11.5px;">• Impide que el cliente inyecte</text>
  <text x="600" y="334" class="body" style="font-size:11.5px;">  banderas internas (`aprobado=True`).</text>

  <rect x="842" y="206" width="242" height="145" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="963" y="230" text-anchor="middle" class="card-title" style="fill:#065f46;">2. `OutputState` (Salida)</text>
  <text x="856" y="254" class="mono" style="font-size:11.5px;fill:#047857;"> respuesta: str</text>
  <text x="856" y="280" class="body" style="font-size:11.5px;">• Proyecta solo las claves</text>
  <text x="856" y="298" class="body" style="font-size:11.5px;">  públicas al terminar en `END`.</text>
  <text x="856" y="318" class="body" style="font-size:11.5px;">• Oculta borradores, prompts</text>
  <text x="856" y="334" class="body" style="font-size:11.5px;">  intermedios y trazas internas.</text>

  <rect x="586" y="366" width="498" height="174" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="602" y="390" class="card-title" style="fill:#5b21b6;">3. `OverallState` vs. `PrivateState` (Comunicación Privada entre 2 Nodos)</text>
  <text x="602" y="414" class="body">• Un nodo A puede devolver un canal declarado en <tspan class="mono" style="fill:#6d28d9;">PrivateState</tspan> y el nodo B recibirlo</text>
  <text x="602" y="434" class="body">  anotando su firma como <tspan class="mono">def nodo_b(state: PrivateState)</tspan>, sin ensuciar <tspan class="mono">OverallState</tspan>.</text>
  <rect x="602" y="450" width="466" height="74" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="616" y="472" class="card-title" style="fill:#991b1b;font-size:12.5px;">⚠️ Advertencia de Seguridad Importante (Módulos 02 y 26):</text>
  <text x="616" y="492" class="body" style="font-size:11.5px;">`OutputState` filtra lo que devuelve `invoke()`, pero los canales internos <tspan style="font-weight:700;">siguen en el checkpoint</tspan></text>
  <text x="616" y="510" class="body" style="font-size:11.5px;">y pueden verse en `get_state()` o `stream(stream_mode="values")`. Nunca guardes secretos ahí.</text>

  <!-- Bottom Banner -->
  <rect x="20" y="568" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="595" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Regla de Canales: Si dos ramas paralelas escriben en la misma clave del estado, esa clave NECESITA un Reducer explícito.</text>
</svg>