<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">FIABILIDAD Y RENDIMIENTO POR NODO: RETRYPOLICY, CACHEPOLICY Y FAN-OUT (15)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Cómo aislar reintentos en el nodo que falla sin re-ejecutar todo el grafo y qué ocurre cuando cae 1 rama de un fan-out</text>

  <!-- Left Panel: Per-Node Policies (RetryPolicy + CachePolicy + Fallbacks) -->
  <rect x="20" y="90" width="535" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="90" width="535" height="38" rx="12" fill="#dbeafe"/>
  <text x="36" y="114" class="panel-title" style="fill:#1e40af;">1. Políticas Declarativas por Nodo (`add_node(..., retry_policy, cache_policy)`)</text>

  <rect x="36" y="140" width="503" height="162" rx="8" fill="#0f172a"/>
  <text x="52" y="164" class="mono" style="fill:#38bdf8;">from langgraph.types import RetryPolicy, CachePolicy</text>
  <text x="52" y="190" class="mono" style="fill:#4ade80;">builder.add_node(</text>
  <text x="52" y="210" class="mono" style="fill:#f8fafc;">    "consultar_api", llamar_api,</text>
  <text x="52" y="230" class="mono" style="fill:#fbbf24;">    retry_policy=RetryPolicy(max_attempts=3, initial_interval=0.5,</text>
  <text x="52" y="250" class="mono" style="fill:#fbbf24;">                             jitter=True, retry_on=es_transitorio),</text>
  <text x="52" y="270" class="mono" style="fill:#c084fc;">    cache_policy=CachePolicy(ttl=300),  # Requiere compile(cache=InMemoryCache())</text>
  <text x="52" y="288" class="mono" style="fill:#4ade80;">)</text>

  <!-- Taxonomy of Failures -->
  <rect x="36" y="314" width="503" height="226" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="338" class="card-title">Taxonomía de los 4 Fallos y su Remedio Exacto:</text>
  <text x="52" y="364" class="body">1. <tspan style="font-weight:700;fill:#1d4ed8;">Transitorio de Red/Rate-Limit (429, 503):</tspan> `RetryPolicy` con backoff + jitter.</text>
  <text x="52" y="392" class="body">2. <tspan style="font-weight:700;fill:#7c3aed;">Fallo reparable por el LLM (Args inválidos / JSON roto):</tspan> devuelve `ToolMessage`</text>
  <text x="52" y="410" class="body">   de error al estado (`handle_tool_errors`) para que el modelo corrija su llamada.</text>
  <text x="52" y="438" class="body">3. <tspan style="font-weight:700;fill:#d97706;">Caída total de un proveedor LLM:</tspan> `llm_primario.with_fallbacks([llm_respaldo])`.</text>
  <text x="52" y="466" class="body">4. <tspan style="font-weight:700;fill:#dc2626;">Error de lógica o permiso (401, 404, ValueError):</tspan> <tspan style="font-weight:700;">NUNCA reintentes</tspan>;</text>
  <text x="52" y="484" class="body">   captura y degrada con elegancia o escala a un humano (`interrupt`).</text>
  <text x="52" y="514" class="mono" style="font-size:11.5px;fill:#047857;">💡 Timeouts por nodo: asyncio.wait_for(coro, timeout=5.0) dentro del nodo.</text>

  <!-- Right Panel: What happens when 1 branch of a Fan-Out fails? -->
  <rect x="570" y="90" width="530" height="465" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="90" width="530" height="38" rx="12" fill="#fee2e2"/>
  <text x="586" y="114" class="panel-title" style="fill:#991b1b;">2. ¿Qué pasa cuando falla UNA sola rama de un Fan-Out Paralelo?</text>

  <text x="586" y="146" class="body">En el modelo Pregel, el super-paso es <tspan style="font-weight:700;fill:#dc2626;">atómico (todo o nada)</tspan>:</text>

  <rect x="586" y="160" width="498" height="175" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="602" y="184" class="card-title" style="fill:#991b1b;">Escenario: 3 ramas corren en paralelo (`Rama A`, `Rama B`, `Rama C`)</text>
  <rect x="602" y="198" width="145" height="46" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="674" y="218" text-anchor="middle" class="mono" style="fill:#166534;">Rama A: ✅ OK</text>
  <text x="674" y="234" text-anchor="middle" class="body" style="font-size:10.5px;">Guardada en pending writes</text>

  <rect x="760" y="198" width="145" height="46" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="832" y="218" text-anchor="middle" class="mono" style="fill:#991b1b;">Rama B: 💥 BOOM</text>
  <text x="832" y="234" text-anchor="middle" class="body" style="font-size:10.5px;">Agota sus retries</text>

  <rect x="918" y="198" width="148" height="46" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="992" y="218" text-anchor="middle" class="mono" style="fill:#166534;">Rama C: ✅ OK</text>
  <text x="992" y="234" text-anchor="middle" class="body" style="font-size:10.5px;">Guardada en pending writes</text>

  <text x="602" y="268" class="body" style="font-size:12px;">1. Si `Rama B` tiene `RetryPolicy`, <tspan style="font-weight:700;">solo se reintenta `Rama B`</tspan> en ese super-paso.</text>
  <text x="602" y="290" class="body" style="font-size:12px;">2. Si `Rama B` sigue fallando y lanza excepción, el super-paso no avanza, pero</text>
  <text x="602" y="310" class="body" style="font-size:12px;">   el checkpointer <tspan style="font-weight:700;fill:#166534;">recuerda las escrituras exitosas de A y C</tspan>: al reanudar con</text>
  <text x="602" y="328" class="body" style="font-size:12px;">   `invoke(None, cfg)`, ¡solo vuelve a ejecutar `Rama B`!</text>

  <!-- Graceful Degradation Box -->
  <rect x="586" y="350" width="498" height="190" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="602" y="374" class="card-title" style="fill:#166534;">3. Si una Rama es Opcional: Degrada dentro del Nodo (No Lances Excepción)</text>
  <text x="602" y="398" class="body" style="font-size:12px;">Si prefieres un informe con 2 de 3 fuentes antes que fallar toda la petición,</text>
  <text x="602" y="418" class="body" style="font-size:12px;">captura la excepción dentro del worker y devuelve un objeto con `estado="degradado"`:</text>
  <rect x="602" y="432" width="466" height="92" rx="6" fill="#0f172a"/>
  <text x="616" y="454" class="mono" style="fill:#38bdf8;">try:</text>
  <text x="616" y="474" class="mono" style="fill:#4ade80;">    return {"fuentes": [{"origen": nombre, "ok": True, "datos": ...}]}</text>
  <text x="616" y="494" class="mono" style="fill:#fbbf24;">except TimeoutError:</text>
  <text x="616" y="514" class="mono" style="fill:#f87171;">    return {"fuentes": [{"origen": nombre, "ok": False, "error": "timeout"}]}</text>

  <!-- Bottom Banner -->
  <rect x="20" y="568" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="595" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Regla de Rendimiento: El tiempo total de un super-paso es max(t_ramas), no la suma; paraleliza todo lo que no tenga dependencia de datos.</text>
</svg>