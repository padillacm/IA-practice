<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">AGENTES DE HORIZONTE LARGO (DEEP AGENTS): LOS 5 PILARES (21)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Cómo sostener tareas de 30 a 200 pasos sin que el contexto colapse ni el agente olvide su objetivo inicial</text>

  <!-- Top 3 Pillars Row -->
  <!-- Pillar 1: Explicit Living Plan -->
  <rect x="20" y="90" width="350" height="225" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="20" y="90" width="350" height="36" rx="12" fill="#2563eb"/>
  <text x="36" y="113" class="badge" style="font-size:13px;">Pilar 1 · El Plan Explícito (`todos`)</text>
  <text x="36" y="142" class="body" style="font-size:12px;">En lugar de confiar en que el LLM recuerde</text>
  <text x="36" y="160" class="body" style="font-size:12px;">su plan 40 mensajes atrás, el estado tiene</text>
  <text x="36" y="178" class="body" style="font-size:12px;">una lista estructurada `plan: list[Todo]`</text>
  <text x="36" y="196" class="body" style="font-size:12px;">inyectada siempre al final del System Prompt:</text>
  <rect x="36" y="210" width="318" height="90" rx="6" fill="#0f172a"/>
  <text x="48" y="232" class="mono" style="fill:#4ade80;font-size:11px;">[x] 1. Auditar esquema de tablas</text>
  <text x="48" y="252" class="mono" style="fill:#fbbf24;font-size:11px;">[~] 2. Cruzar anomalías de julio (EN CURSO)</text>
  <text x="48" y="272" class="mono" style="fill:#94a3b8;font-size:11px;">[ ] 3. Generar informe ejecutivo</text>
  <text x="48" y="290" class="mono" style="fill:#38bdf8;font-size:10.5px;">Tool: actualizar_plan(paso_id, estado)</text>

  <!-- Pillar 2: External Workspace / Scratchpad -->
  <rect x="385" y="90" width="350" height="225" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="385" y="90" width="350" height="36" rx="12" fill="#7c3aed"/>
  <text x="401" y="113" class="badge" style="font-size:13px;">Pilar 2 · Memoria de Trabajo Externa</text>
  <text x="401" y="142" class="body" style="font-size:12px;">La ventana de mensajes es RAM cara y volátil;</text>
  <text x="401" y="160" class="body" style="font-size:12px;">el sistema de ficheros virtual (`archivos`)</text>
  <text x="401" y="178" class="body" style="font-size:12px;">es el disco duro del agente:</text>
  <rect x="401" y="194" width="318" height="106" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="415" y="216" class="mono" style="fill:#5b21b6;font-size:11.5px;">• leer_archivo(ruta, offset, limit)</text>
  <text x="415" y="238" class="mono" style="fill:#5b21b6;font-size:11.5px;">• escribir_archivo(ruta, contenido)</text>
  <text x="415" y="260" class="mono" style="fill:#5b21b6;font-size:11.5px;">• editar_archivo(ruta, viejo, nuevo)</text>
  <text x="415" y="284" class="body" style="font-size:11px;">Guarda hallazgos intermedios en `notas.md`</text>

  <!-- Pillar 3: Progressive Disclosure (Skills) -->
  <rect x="750" y="90" width="350" height="225" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="750" y="90" width="350" height="36" rx="12" fill="#059669"/>
  <text x="766" y="113" class="badge" style="font-size:13px;">Pilar 3 · Divulgación Progresiva (Skills)</text>
  <text x="766" y="142" class="body" style="font-size:12px;">No metas 15 manuales de 2,000 palabras en</text>
  <text x="766" y="160" class="body" style="font-size:12px;">el System Prompt inicial:</text>
  <rect x="766" y="176" width="318" height="124" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="780" y="198" class="body" style="font-size:11.5px;">1. En el System Prompt va solo el <tspan style="font-weight:700;">índice</tspan></text>
  <text x="780" y="216" class="body" style="font-size:11.5px;">   de 1 línea por habilidad (`SKILL.md`).</text>
  <text x="780" y="240" class="body" style="font-size:11.5px;">2. Cuando la tarea lo requiere, el agente</text>
  <text x="780" y="258" class="body" style="font-size:11.5px;">   llama a `cargar_skill("auditoria_sql")`</text>
  <text x="780" y="276" class="body" style="font-size:11.5px;">   para leer las instrucciones detalladas.</text>

  <!-- Bottom 2 Pillars + Sandbox Warning -->
  <rect x="20" y="330" width="535" height="225" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="20" y="330" width="535" height="36" rx="12" fill="#d97706"/>
  <text x="36" y="353" class="badge" style="font-size:13.5px;">Pilar 4 · Delegación a Subagentes con Contexto Aislado (`task`)</text>
  <text x="36" y="384" class="body">Si explorar una hipótesis requiere leer 12 ficheros, NO lo hagas en el hilo</text>
  <text x="36" y="404" class="body">principal: lanza un subagente efímero que haga las 12 lecturas en su propia</text>
  <text x="36" y="424" class="body">ventana de mensajes y devuelva al padre <tspan style="font-weight:700;fill:#92400e;">solo un resumen de 300 tokens</tspan>.</text>
  <rect x="36" y="440" width="503" height="98" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="50" y="464" class="mono" style="fill:#b45309;">Contexto Padre (Limpio): [Objetivo] → [ToolCall: delegar] → [Resumen 300 tok]</text>
  <text x="50" y="488" class="mono" style="fill:#78350f;">Contexto Subagente (Se descarta al terminar): 18,000 tokens de búsqueda cruda</text>
  <text x="50" y="516" class="body" style="font-size:11.5px;">Así un agente principal puede coordinar 10 investigaciones sin agotar su ventana.</text>

  <rect x="570" y="330" width="530" height="225" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="570" y="330" width="530" height="36" rx="12" fill="#dc2626"/>
  <text x="586" y="353" class="badge" style="font-size:13.5px;">Pilar 5 · Compactación Automática + Ejecución en Sandbox</text>
  <text x="586" y="384" class="body">• <tspan style="font-weight:700;">Compactación al 80% de ventana:</tspan> cuando los tokens superan el umbral, un</text>
  <text x="586" y="404" class="body">  nodo/middleware vuelca el historial antiguo a `historial_archivo.md`, genera</text>
  <text x="586" y="424" class="body">  un resumen ejecutivo estructurado y poda los mensajes con `RemoveMessage`.</text>
  <rect x="586" y="440" width="498" height="98" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="600" y="464" class="card-title" style="fill:#991b1b;font-size:13px;">🔒 Regla Innegociable para Ejecución de Código / Shell:</text>
  <text x="600" y="486" class="body" style="font-size:11.5px;">Nunca ejecutes `subprocess.run` en el mismo contenedor donde vive el servidor</text>
  <text x="600" y="504" class="body" style="font-size:11.5px;">de LangGraph (tendría acceso a variables de entorno y BD). Usa un sandbox efímero</text>
  <text x="600" y="522" class="body" style="font-size:11.5px;">aislado sin red saliente y con límites de CPU/RAM/tiempo.</text>

  <!-- Bottom Banner -->
  <rect x="20" y="568" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="595" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Un agente de horizonte largo no necesita un modelo con 10 millones de tokens; necesita higiene de estado, disco externo y subagentes.</text>
</svg>