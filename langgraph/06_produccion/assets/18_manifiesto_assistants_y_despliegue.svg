<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
    <marker id="arr18d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">DE UN NOTEBOOK A UN SERVICIO: LANGGRAPH.JSON, ASSISTANTS Y RUNS (18)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">El modelo de recursos del servidor de agentes (Graphs → Assistants → Threads → Runs → Crons) y opciones de despliegue</text>

  <!-- Top Section: Entity Relationship of LangGraph Server -->
  <rect x="20" y="90" width="1080" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="116" class="panel-title">1. Los 5 Objetos del Servidor de LangGraph (API Estándar del SDK Cliente)</text>

  <rect x="38" y="136" width="185" height="165" rx="8" fill="#0f172a"/>
  <text x="130" y="160" text-anchor="middle" class="card-title" style="fill:#38bdf8;">1. `langgraph.json`</text>
  <text x="50" y="184" class="mono" style="fill:#4ade80;font-size:11px;">"graphs": {</text>
  <text x="50" y="202" class="mono" style="fill:#f8fafc;font-size:11px;">  "soporte":</text>
  <text x="50" y="220" class="mono" style="fill:#fbbf24;font-size:10.5px;">  "./app/graph.py:graph"</text>
  <text x="50" y="238" class="mono" style="fill:#4ade80;font-size:11px;">}</text>
  <text x="50" y="264" class="body" style="fill:#cbd5e1;font-size:11px;">Código compilado</text>
  <text x="50" y="282" class="body" style="fill:#cbd5e1;font-size:11px;">en la imagen Docker.</text>

  <line x1="223" y1="218" x2="255" y2="218" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr18d)"/>

  <rect x="260" y="136" width="235" height="165" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="377" y="160" text-anchor="middle" class="card-title" style="fill:#1e40af;">2. `Assistant` (Versionado)</text>
  <text x="274" y="184" class="body" style="font-size:11.5px;">Un grafo + un `context` fijo</text>
  <text x="274" y="202" class="body" style="font-size:11.5px;">(modelo, prompt, temperatura).</text>
  <text x="274" y="228" class="mono" style="font-size:11px;fill:#1d4ed8;">• "soporte-vip" (modelo Pro)</text>
  <text x="274" y="248" class="mono" style="font-size:11px;fill:#1d4ed8;">• "soporte-free" (modelo Mini)</text>
  <text x="274" y="274" class="body" style="font-size:11px;fill:#1e3a8a;font-weight:700;">Cambia prompts sin redesplegar</text>
  <text x="274" y="290" class="body" style="font-size:11px;fill:#1e3a8a;">y haz rollback de versión en 1 clic.</text>

  <line x1="495" y1="218" x2="527" y2="218" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr18d)"/>

  <rect x="532" y="136" width="235" height="165" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="649" y="160" text-anchor="middle" class="card-title" style="fill:#5b21b6;">3. `Thread` (Estado)</text>
  <text x="546" y="184" class="body" style="font-size:11.5px;">Sesión persistida en Postgres</text>
  <text x="546" y="202" class="body" style="font-size:11.5px;">con metadatos (`user_id`, `tier`).</text>
  <text x="546" y="228" class="mono" style="font-size:11px;fill:#6d28d9;">status: "idle" | "busy" |</text>
  <text x="546" y="246" class="mono" style="font-size:11px;fill:#6d28d9;">        "interrupted" | "error"</text>
  <text x="546" y="274" class="body" style="font-size:11px;">Permite buscar todos los hilos</text>
  <text x="546" y="290" class="body" style="font-size:11px;">que esperan aprobación humana.</text>

  <line x1="767" y1="218" x2="799" y2="218" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr18d)"/>

  <rect x="804" y="136" width="278" height="165" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="943" y="160" text-anchor="middle" class="card-title" style="fill:#065f46;">4. `Run` y 5. `Cron`</text>
  <text x="818" y="184" class="body" style="font-size:11.5px;">Una ejecución concreta (`Assistant`</text>
  <text x="818" y="202" class="body" style="font-size:11.5px;">sobre un `Thread` o *stateless*):</text>
  <text x="818" y="226" class="mono" style="font-size:11px;fill:#047857;">• client.runs.stream(...)</text>
  <text x="818" y="246" class="mono" style="font-size:11px;fill:#047857;">• client.runs.create(..., webhook)</text>
  <text x="818" y="266" class="mono" style="font-size:11px;fill:#047857;">• client.crons.create("0 8 * * *")</text>
  <text x="818" y="288" class="body" style="font-size:11px;">Cola persistente con reintentos.</text>

  <!-- Bottom Section: The 3 Deployment Architectures -->
  <rect x="20" y="340" width="1080" height="215" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="366" class="panel-title">2. Las Tres Opciones de Despliegue según Control, Coste e Infraestructura</text>

  <rect x="38" y="382" width="330" height="155" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="203" y="406" text-anchor="middle" class="card-title" style="fill:#1e40af;">Opción 1 · Cloud Gestionado</text>
  <text x="52" y="430" class="body" style="font-size:12px;">• Conecta tu repo Git con `langgraph.json`.</text>
  <text x="52" y="452" class="body" style="font-size:12px;">• Postgres, Redis, colas de workers, Studio</text>
  <text x="52" y="470" class="body" style="font-size:12px;">  y crons provistos automáticamente.</text>
  <text x="52" y="494" class="body" style="font-size:12px;fill:#15803d;font-weight:700;">✅ Tiempo a producción: minutos.</text>
  <text x="52" y="514" class="body" style="font-size:11.5px;">Ideal cuando los datos pueden salir a la nube.</text>

  <rect x="395" y="382" width="330" height="155" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="560" y="406" text-anchor="middle" class="card-title" style="fill:#5b21b6;">Opción 2 · Contenedor Oficial (`langgraph build`)</text>
  <text x="409" y="430" class="body" style="font-size:12px;">• Genera imagen Docker lista para tu K8s/ECS.</text>
  <text x="409" y="452" class="body" style="font-size:12px;">• Tú operas tu propio Postgres y Redis dentro</text>
  <text x="409" y="470" class="body" style="font-size:12px;">  de tu VPC privada (soberanía de datos).</text>
  <text x="409" y="494" class="body" style="font-size:12px;fill:#5b21b6;font-weight:700;">✅ Conserva toda la API de Assistants/Runs.</text>
  <text x="409" y="514" class="body" style="font-size:11.5px;">Ideal para empresas reguladas con K8s propio.</text>

  <rect x="752" y="382" width="330" height="155" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="917" y="406" text-anchor="middle" class="card-title" style="fill:#065f46;">Opción 3 · Servidor Propio (FastAPI / Starlette)</text>
  <text x="766" y="430" class="body" style="font-size:12px;">• Importas el grafo como librería Python normal</text>
  <text x="766" y="450" class="body" style="font-size:12px;">  con `AsyncPostgresSaver`.</text>
  <text x="766" y="472" class="body" style="font-size:12px;">• <tspan style="font-weight:700;fill:#dc2626;">Tú eres responsable</tspan> de cerrojos por `thread_id`,</text>
  <text x="766" y="490" class="body" style="font-size:12px;">  SSE streaming, desconexiones y colas (Mód 24).</text>
  <text x="766" y="514" class="body" style="font-size:11.5px;">✅ Cero licencias adicionales; control total.</text>

  <!-- Bottom Banner -->
  <rect x="20" y="568" width="1080" height="44" rx="10" fill="#0f172a"/>
  <text x="560" y="595" text-anchor="middle" class="body" style="fill:#f8fafc;font-weight:600;">Regla de Importación: El módulo referenciado en langgraph.json NO debe ejecutar llamadas a red ni cargar modelos pesados al importarse.</text>
</svg>