<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">LÍMITES, COLAS E INCIDENTES: BACKPRESSURE Y DEGRADACIÓN (29)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Los 4 escudos de capacidad (`RateLimiter`, Jitter, Semáforo con Timeout y Circuit Breaker) para que un pico no tumbe el servicio</text>

  <!-- Top Section: The 4 Capacity Shields -->
  <rect x="20" y="90" width="1080" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="116" class="panel-title">1. Los 4 Límites que Protegen tu Servidor de Agentes en Hora Punta</text>

  <rect x="38" y="136" width="248" height="168" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="162" y="160" text-anchor="middle" class="card-title" style="fill:#1e40af;">1. Cuota Saliente (LLM)</text>
  <text x="52" y="184" class="mono" style="font-size:11px;fill:#1d4ed8;">InMemoryRateLimiter(</text>
  <text x="52" y="202" class="mono" style="font-size:11px;fill:#1d4ed8;">  requests_per_second=10,</text>
  <text x="52" y="220" class="mono" style="font-size:11px;fill:#1d4ed8;">  max_bucket_size=20)</text>
  <text x="52" y="244" class="body" style="font-size:11.5px;">Suaviza las ráfagas antes de</text>
  <text x="52" y="262" class="body" style="font-size:11.5px;">chocar contra el HTTP 429</text>
  <text x="52" y="280" class="body" style="font-size:11.5px;">del proveedor (Token Bucket).</text>

  <rect x="302" y="136" width="248" height="168" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="426" y="160" text-anchor="middle" class="card-title" style="fill:#5b21b6;">2. Backoff + Full Jitter</text>
  <text x="316" y="184" class="body" style="font-size:11.5px;">Sin jitter, 50 corutinas que</text>
  <text x="316" y="202" class="body" style="font-size:11.5px;">reciben 429 en `t=0` vuelven a</text>
  <text x="316" y="220" class="body" style="font-size:11.5px;">golpear juntas en `t=1s, 2s, 4s`</text>
  <text x="316" y="238" class="body" style="font-size:11.5px;">(*Thundering Herd*).</text>
  <text x="316" y="264" class="mono" style="font-size:11px;fill:#6d28d9;">sleep = uniform(0, base * 2**n)</text>
  <text x="316" y="284" class="body" style="font-size:11px;">Desincroniza la estampida.</text>

  <rect x="566" y="136" width="248" height="168" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="690" y="160" text-anchor="middle" class="card-title" style="fill:#92400e;">3. Admisión (Backpressure)</text>
  <text x="580" y="184" class="body" style="font-size:11.5px;">Semáforo de runs en vuelo</text>
  <text x="580" y="202" class="body" style="font-size:11.5px;">+ cola máxima con timeout:</text>
  <text x="580" y="226" class="mono" style="font-size:11px;fill:#b45309;">wait_for(sem.acquire(), 2.0)</text>
  <text x="580" y="250" class="body" style="font-size:11.5px;">Si se supera, devuelve rápido</text>
  <text x="580" y="268" class="mono" style="font-size:11px;fill:#dc2626;">HTTP 429 + Retry-After: 5</text>
  <text x="580" y="286" class="body" style="font-size:11px;">Evita el OOM del servidor.</text>

  <rect x="830" y="136" width="252" height="168" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="956" y="160" text-anchor="middle" class="card-title" style="fill:#065f46;">4. Degradación Elegante</text>
  <text x="844" y="184" class="body" style="font-size:11.5px;">Cuando la carga o el error</text>
  <text x="844" y="202" class="body" style="font-size:11.5px;">superan el umbral:</text>
  <text x="844" y="226" class="mono" style="font-size:11px;fill:#047857;">• Modelo Pro → Modelo Mini</text>
  <text x="844" y="246" class="mono" style="font-size:11px;fill:#047857;">• Desactiva tools lentas</text>
  <text x="844" y="266" class="mono" style="font-size:11px;fill:#047857;">• Respuesta desde caché/FAQ</text>
  <text x="844" y="286" class="body" style="font-size:11px;">Mejor modesto que caído.</text>

  <!-- Bottom Section: Executable Runbook & Little's Law -->
  <rect x="20" y="340" width="535" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="340" width="535" height="36" rx="12" fill="#dbeafe"/>
  <text x="36" y="363" class="panel-title" style="fill:#1e40af;">2. Dimensionamiento con la Ley de Little ($L = \lambda \cdot W$)</text>

  <rect x="36" y="388" width="503" height="106" rx="8" fill="#0f172a"/>
  <text x="52" y="412" class="mono" style="fill:#38bdf8;">Concurrencia en vuelo (L) = Tasa de llegada (λ) × Latencia media (W)</text>
  <text x="52" y="438" class="mono" style="fill:#4ade80;">• En situación normal:  λ = 10 req/s × W =  2.5 s  →  L =  25 runs activos</text>
  <text x="52" y="462" class="mono" style="fill:#f87171;">• Si el LLM se degrada: λ = 10 req/s × W = 20.0 s  →  L = 200 runs activos (×8)</text>
  <text x="52" y="484" class="body" style="fill:#cbd5e1;font-size:11.5px;">Por eso un aumento de latencia agota el pool de conexiones de Postgres si no hay semáforo.</text>

  <text x="36" y="522" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Regla de Pool:</tspan> `max_concurrent_runs_per_pod ≤ db_pool_max_size × 0.8`.</text>
  <text x="36" y="544" class="body" style="font-size:12px;">• Nunca permitas una cola en memoria de longitud infinita: solo añade latencia</text>
  <text x="36" y="564" class="body" style="font-size:12px;">  a clientes que ya habrán cerrado el navegador cuando les toque el turno.</text>

  <!-- Right Panel: Executable Incident Runbook -->
  <rect x="570" y="340" width="530" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="340" width="530" height="36" rx="12" fill="#fee2e2"/>
  <text x="586" y="363" class="panel-title" style="fill:#991b1b;">3. El Runbook Ejecutable ante un Incidente en Producción</text>

  <rect x="586" y="388" width="498" height="202" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="602" y="412" class="card-title" style="fill:#991b1b;">Árbol de Decisión Automático del Diagnóstico:</text>
  <text x="602" y="438" class="mono" style="font-size:11.5px;fill:#7f1d1d;">1. ¿Tasa de 429 del proveedor LLM &gt; 10%?</text>
  <text x="602" y="458" class="body" style="font-size:12px;">   → Conmuta el Assistant al modelo de respaldo en otra región/proveedor.</text>
  <text x="602" y="484" class="mono" style="font-size:11.5px;fill:#7f1d1d;">2. ¿Saturación del pool de Postgres o latencia de checkpoint &gt; 200 ms?</text>
  <text x="602" y="504" class="body" style="font-size:12px;">   → Cambia `durability="exit"` temporalmente y baja el semáforo de admisión.</text>
  <text x="602" y="530" class="mono" style="font-size:11.5px;fill:#7f1d1d;">3. ¿Media de super-pasos por run &gt; 12 tras un cambio de prompt?</text>
  <text x="602" y="550" class="body" style="font-size:12px;">   → Rollback inmediato de la versión del Assistant y baja `recursion_limit`.</text>
  <text x="602" y="576" class="body" style="font-size:11.5px;fill:#15803d;font-weight:700;">💡 Prueba tus interruptores de degradación en frío antes de necesitarlos a las 3 AM.</text>
</svg>