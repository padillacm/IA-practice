<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
    <marker id="arr25" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">AUTENTICACIÓN (`@AUTH.AUTHENTICATE`) Y MULTITENENCIA (`@AUTH.ON`) (25)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Cómo aislar hilos y memoria entre clientes en el servidor de LangGraph y la regla de precedencia de manejadores</text>

  <!-- Top Section: 2-Stage Security Pipeline -->
  <rect x="20" y="90" width="1080" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="116" class="panel-title">1. Las Dos Etapas que No Hay que Mezclar: Identidad vs. Filtros de Autorización</text>

  <!-- Stage 1: Authenticate -->
  <rect x="38" y="134" width="465" height="172" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="38" y="134" width="465" height="32" rx="10" fill="#2563eb"/>
  <text x="270" y="155" text-anchor="middle" class="badge" style="font-size:13px;">ETAPA 1 · `@auth.authenticate` (¿Quién eres?)</text>
  <text x="54" y="184" class="mono" style="font-size:11.5px;fill:#1e40af;">@auth.authenticate</text>
  <text x="54" y="204" class="mono" style="font-size:11.5px;fill:#1e40af;">async def verificar_token(headers: dict) -&gt; Auth.types.MinimalUserDict:</text>
  <text x="54" y="224" class="body" style="font-size:12px;">• Valida firma JWT / API Key en cada petición HTTP.</text>
  <text x="54" y="246" class="body" style="font-size:12px;">• Devuelve <tspan class="mono" style="fill:#1d4ed8;">{"identity": "user_42", "org_id": "acme", "permissions": [...]}</tspan>.</text>
  <text x="54" y="268" class="body" style="font-size:12px;">• Queda disponible en `ctx.user` (y dentro del grafo como `config["configurable"]["langgraph_auth_user"]`).</text>

  <line x1="503" y1="220" x2="555" y2="220" stroke="#2563eb" stroke-width="3" marker-end="url(#arr25)"/>

  <!-- Stage 2: Authorize (@auth.on) -->
  <rect x="560" y="134" width="522" height="172" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="560" y="134" width="522" height="32" rx="10" fill="#059669"/>
  <text x="821" y="155" text-anchor="middle" class="badge" style="font-size:13px;">ETAPA 2 · `@auth.on.*` (¿Qué puedes ver y tocar?)</text>
  <text x="576" y="184" class="mono" style="font-size:11.5px;fill:#065f46;">@auth.on.threads.create  /  @auth.on.threads.read</text>
  <text x="576" y="206" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Al crear:</tspan> inyecta `value["metadata"]["owner"] = ctx.user.identity`.</text>
  <text x="576" y="228" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Al leer/buscar/borrar:</tspan> devuelve el filtro <tspan class="mono" style="fill:#047857;">{"owner": ctx.user.identity}</tspan>.</text>
  <text x="576" y="250" class="body" style="font-size:12px;">• La base de datos aplica `WHERE metadata @&gt; '{"owner": "user_42"}'`:</text>
  <text x="576" y="270" class="body" style="font-size:12px;fill:#14532d;font-weight:700;">  un usuario jamás puede leer ni listar el `thread_id` de otro cliente.</text>

  <!-- Bottom Left: Handler Precedence Rule (ONLY ONE RUNS!) -->
  <rect x="20" y="340" width="535" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="340" width="535" height="36" rx="12" fill="#fef3c7"/>
  <text x="36" y="363" class="panel-title" style="fill:#92400e;">2. ¡Cuidado! El Servidor Ejecuta SOLO EL MANEJADOR MÁS ESPECÍFICO</text>

  <text x="36" y="392" class="body">A diferencia del middleware, los manejadores `@auth.on` <tspan style="font-weight:700;fill:#dc2626;">NO se encadenan</tspan>:</text>
  <rect x="36" y="406" width="503" height="118" rx="8" fill="#0f172a"/>
  <text x="52" y="430" class="mono" style="fill:#4ade80;">Prioridad 1 (Más específico): @auth.on.threads.create  ← GANA en POST /threads</text>
  <text x="52" y="454" class="mono" style="fill:#fbbf24;">Prioridad 2 (Recurso):        @auth.on.threads         ← Corre en read/search/delete</text>
  <text x="52" y="478" class="mono" style="fill:#94a3b8;">Prioridad 3 (Global):         @auth.on                 ← Respaldo por defecto</text>
  <text x="52" y="506" class="body" style="fill:#f87171;font-size:11.5px;">⚠️ Si defines `@auth.on.threads.create` y olvidas devolver el filtro allí, `@auth.on` NO correrá.</text>

  <text x="36" y="548" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Política Deny-by-Default:</tspan> pon un `@auth.on` global que rechace o filtre todo</text>
  <text x="36" y="568" class="body" style="font-size:12px;">  recurso nuevo (`crons`, `assistants`) que no tenga manejador específico.</text>

  <!-- Bottom Right: Store Namespace Rewriting & What Auth Does NOT Protect -->
  <rect x="570" y="340" width="530" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="340" width="530" height="36" rx="12" fill="#fee2e2"/>
  <text x="586" y="363" class="panel-title" style="fill:#991b1b;">3. La Trampa del `Store` y lo que `@auth` NO Protege</text>

  <rect x="586" y="388" width="498" height="98" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="602" y="410" class="card-title" style="fill:#991b1b;">Trampa #1 · `@auth.on.store` solo protege llamadas HTTP a `/store`</text>
  <text x="602" y="432" class="body" style="font-size:12px;">1. En `@auth.on.store`, los ítems no se filtran por metadata: debes forzar o</text>
  <text x="602" y="450" class="body" style="font-size:12px;">   validar que `value["namespace"][0] == ctx.user.identity`.</text>
  <text x="602" y="470" class="body" style="font-size:12px;">2. Las llamadas internas `runtime.store.search(...)` <tspan style="font-weight:700;fill:#dc2626;">desde un nodo Python</tspan></text>
  <text x="602" y="486" class="body" style="font-size:12px;">   no pasan por HTTP: el nodo DEBE construir el namespace con `user_id`.</text>

  <rect x="586" y="498" width="498" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="602" y="520" class="card-title" style="fill:#0f172a;">Trampa #2 · Las Rutas Propia (`http.app` en `langgraph.json`):</text>
  <text x="602" y="542" class="body" style="font-size:12px;">Si montas rutas FastAPI/Starlette personalizadas (`http.app`), verifica</text>
  <text x="602" y="562" class="body" style="font-size:12px;">explícitamente `request.scope["user"]` o aplica el mismo middleware de Auth.</text>
</svg>