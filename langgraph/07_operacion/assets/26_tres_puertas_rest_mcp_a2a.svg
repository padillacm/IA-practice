<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="100%">
  <defs>
    <style>
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      stroke: none !important;
      text-rendering: geometricPrecision;
    }
    .title { font-size: 21px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
    .panel-title { font-size: 15.5px; font-weight: 700; fill: #1e293b; }
    .card-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .body { font-size: 12.5px; font-weight: 500; fill: #334155; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 600; stroke: none !important; }
    .badge { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
</style>
  </defs>
  <rect width="1120" height="630" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="20" y="18" width="1080" height="58" rx="10" fill="#0f172a"/>
  <text x="40" y="44" class="title" style="fill:#ffffff;">EXPONER EL AGENTE: LAS 3 PUERTAS (REST/SSE, `/MCP` Y `/A2A`) (26)</text>
  <text x="40" y="64" class="subtitle" style="fill:#94a3b8;">Un solo grafo sirve simultáneamente a Frontends Web, Clientes MCP (Claude/IDEs) y Otros Agentes (Protocolo A2A)</text>

  <!-- Top Section: The 3 Doors Architecture -->
  <rect x="20" y="90" width="1080" height="235" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="38" y="116" class="panel-title">1. Tres Puertas de Entrada para Tres Tipos de Clientes en el Servidor de LangGraph</text>

  <!-- Door 1: Agent Protocol REST + SSE -->
  <rect x="38" y="136" width="330" height="168" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="38" y="136" width="330" height="32" rx="10" fill="#2563eb"/>
  <text x="203" y="157" text-anchor="middle" class="badge" style="font-size:13px;">PUERTA 1 · `/threads` y `/runs` (Frontend)</text>
  <text x="52" y="186" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Cliente:</tspan> Tu app web/móvil (`langgraph-sdk`).</text>
  <text x="52" y="208" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Capacidades completas:</tspan> streaming token</text>
  <text x="52" y="226" class="body" style="font-size:12px;">  a token, `interrupt()` HITL, *time-travel*,</text>
  <text x="52" y="244" class="body" style="font-size:12px;">  estado compartido y crons.</text>
  <text x="52" y="270" class="mono" style="font-size:11px;fill:#1d4ed8;">Protocolo: REST + Server-Sent Events (SSE)</text>

  <!-- Door 2: /mcp Endpoint -->
  <rect x="395" y="136" width="330" height="168" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="395" y="136" width="330" height="32" rx="10" fill="#7c3aed"/>
  <text x="560" y="157" text-anchor="middle" class="badge" style="font-size:13px;">PUERTA 2 · `/mcp` (El Agente como Tool)</text>
  <text x="409" y="186" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Cliente:</tspan> IDEs, Claude Desktop, otros LLMs.</text>
  <text x="409" y="208" class="body" style="font-size:12px;">• Expone cada Assistant como herramienta</text>
  <text x="409" y="226" class="body" style="font-size:12px;">  MCP (`tools/list`, `tools/call`).</text>
  <text x="409" y="248" class="body" style="font-size:12px;fill:#5b21b6;font-weight:700;">• El esquema JSON de la tool se genera</text>
  <text x="409" y="266" class="body" style="font-size:12px;fill:#5b21b6;font-weight:700;">  automáticamente desde tu `InputState`.</text>
  <text x="409" y="288" class="mono" style="font-size:11px;fill:#6d28d9;">Protocolo: MCP Streamable HTTP (Stateless)</text>

  <!-- Door 3: /a2a Endpoint -->
  <rect x="752" y="136" width="330" height="168" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="752" y="136" width="330" height="32" rx="10" fill="#059669"/>
  <text x="917" y="157" text-anchor="middle" class="badge" style="font-size:13px;">PUERTA 3 · `/a2a/{id}` (Agent-to-Agent)</text>
  <text x="766" y="186" class="body" style="font-size:12px;">• <tspan style="font-weight:700;">Cliente:</tspan> Otro agente autónomo remoto.</text>
  <text x="766" y="208" class="body" style="font-size:12px;">• Soporta conversación multi-turno con</text>
  <text x="766" y="226" class="body" style="font-size:12px;">  `contextId` (mapeado a `thread_id`).</text>
  <text x="766" y="248" class="body" style="font-size:12px;">• Requiere que el estado acepte clave</text>
  <text x="766" y="266" class="mono" style="font-size:11px;fill:#047857;">  messages: list[AnyMessage]</text>
  <text x="766" y="288" class="mono" style="font-size:11px;fill:#065f46;">Protocolo: JSON-RPC A2A + Agent Card</text>

  <!-- Bottom Section: Why InputState/OutputState + description is Mandatory -->
  <rect x="20" y="340" width="535" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="340" width="535" height="36" rx="12" fill="#fef2f2"/>
  <text x="36" y="363" class="panel-title" style="fill:#991b1b;">2. Tu Esquema es tu API (y tu Superficie de Ataque)</text>

  <text x="36" y="392" class="body">Si compilas `StateGraph(OverallState)` sin `input_schema` ni `output_schema`:</text>
  <rect x="36" y="406" width="503" height="84" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="50" y="428" class="mono" style="fill:#b91c1c;font-size:11.5px;">❌ En /mcp, el cliente externo ve TODOS tus canales internos como parámetros:</text>
  <text x="50" y="448" class="mono" style="fill:#b91c1c;font-size:11.5px;">   {"pregunta": "...", "es_admin": true, "coste_acumulado": 0, "sql_crudo": "..."}</text>
  <text x="50" y="472" class="body" style="font-size:11.5px;fill:#7f1d1d;">¡Un llamador externo puede inyectar `es_admin=True` al invocar la herramienta MCP!</text>

  <rect x="36" y="500" width="503" height="94" rx="6" fill="#0f172a"/>
  <text x="50" y="522" class="mono" style="fill:#4ade80;">✅ Separa siempre InputState / OutputState y documenta en langgraph.json:</text>
  <text x="50" y="544" class="mono" style="fill:#38bdf8;font-size:11px;">"graphs": {"analista": {"path": "./g.py:g", "description": "Consulta ventas..."}}</text>
  <text x="50" y="566" class="body" style="fill:#cbd5e1;font-size:11px;">Esa `description` es lo que leen los clientes MCP y la Agent Card de A2A.</text>

  <!-- Right Panel: Custom Routes (http.app) & Disabling Endpoints -->
  <rect x="570" y="340" width="530" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="570" y="340" width="530" height="36" rx="12" fill="#dcfce7"/>
  <text x="586" y="363" class="panel-title" style="fill:#166534;">3. Rutas Propias (`http.app`) y Apagar lo que No Uses</text>

  <text x="586" y="392" class="body">Para webhooks de terceros (Stripe, Slack, GitHub) que exigen validar firma HMAC:</text>
  <rect x="586" y="406" width="498" height="190" rx="8" fill="#0f172a"/>
  <text x="602" y="430" class="mono" style="fill:#38bdf8;">"http": {</text>
  <text x="602" y="450" class="mono" style="fill:#4ade80;">  "app": "./app/rutas.py:app",       # Starlette/FastAPI montada junto al grafo</text>
  <text x="602" y="470" class="mono" style="fill:#fbbf24;">  "enable_custom_route_auth": true,  # Pasa también por @auth.authenticate</text>
  <text x="602" y="490" class="mono" style="fill:#f87171;">  "disable_mcp": true,               # Apaga /mcp si no lo necesitas</text>
  <text x="602" y="510" class="mono" style="fill:#f87171;">  "disable_a2a": true                # Apaga /a2a si no lo necesitas</text>
  <text x="602" y="530" class="mono" style="fill:#38bdf8;">}</text>
  <text x="602" y="562" class="body" style="fill:#cbd5e1;font-size:11.5px;">💡 Principio de mínima exposición: cada protocolo habilitado es una puerta más que</text>
  <text x="602" y="580" class="body" style="fill:#cbd5e1;font-size:11.5px;">auditar. Desactiva en `langgraph.json` los protocolos que ningún cliente legítimo use.</text>
</svg>